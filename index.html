<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clutch Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF;
  --paper-raised:#F7F7F5;
  --ink:#121212;
  --ink-muted:#6B6A66;
  --line:#E3E2DD;
  --court:#B3261E;
  --court-soft:#F7E3E1;
  --clay:#7A2E22;
  --clay-soft:#EFE0DB;
  --gold:#96722A;
  --gold-soft:#F1E7D1;
  --away:#0A0A0A;
  --away-soft:#EAE9E6;
  --live:#166534;
  --shadow: 0 1px 0 rgba(18,18,18,0.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121110;
    --paper-raised:#1A1917;
    --ink:#F2F1EE;
    --ink-muted:#9F9D97;
    --line:#2B2A26;
    --court:#E2453B;
    --court-soft:#361E1A;
    --clay:#C96B57;
    --clay-soft:#301F19;
    --gold:#D1A851;
    --gold-soft:#302811;
    --away:#F6F5F1;
    --away-soft:#242320;
    --live:#4ADE80;
    --shadow: 0 1px 0 rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --paper:#121110;
  --paper-raised:#1A1917;
  --ink:#F2F1EE;
  --ink-muted:#9F9D97;
  --line:#2B2A26;
  --court:#E2453B;
  --court-soft:#361E1A;
  --clay:#C96B57;
  --clay-soft:#301F19;
  --gold:#D1A851;
  --gold-soft:#302811;
  --away:#F6F5F1;
  --away-soft:#242320;
  --live:#4ADE80;
  --shadow: 0 1px 0 rgba(0,0,0,0.4);
}

*{box-sizing:border-box;}
html{text-size-adjust:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Source Serif 4', Georgia, 'Times New Roman', serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
h1,h2,h3,.disp{
  font-family:'Anton', 'Arial Narrow', sans-serif;
  text-transform:uppercase;
  letter-spacing:0.01em;
  font-weight:400;
  text-wrap:balance;
  line-height:1.02;
  margin:0;
}
.mono{font-family:'JetBrains Mono', ui-monospace, Menlo, monospace;}
.tnum{font-variant-numeric:tabular-nums;}

/* ---------- layout shell ---------- */
#app{min-height:100%;}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px;}

/* ---------- masthead ---------- */
.masthead{position:relative;background:var(--paper);border-bottom:1px solid var(--line);}
.masthead-top{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:17px 20px;}
.logo{font-size:29px;display:flex;align-items:baseline;gap:7px;white-space:nowrap;letter-spacing:-0.01em;}
.logo .dot{color:var(--clay);}
.nav{display:flex;gap:2px;flex-wrap:wrap;align-items:center;}
.nav a{
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;
  padding:10px 14px;border-radius:5px;color:var(--ink-muted);position:relative;transition:color .12s ease;
}
.nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2px;border-radius:2px;background:var(--accent,var(--court));transform:scaleX(0);transition:transform .15s ease;transform-origin:left;}
.nav a:hover{color:var(--ink);}
.nav a:hover::after{transform:scaleX(1);}
.nav a.active{color:var(--ink);font-weight:700;}
.nav a.active::after{transform:scaleX(1);}
.nav a:focus-visible{outline:2px solid var(--court);outline-offset:1px;}
.nav-more{position:relative;}
.nav-more-trigger{
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;
  padding:10px 14px;border-radius:5px;color:var(--ink-muted);position:relative;transition:color .12s ease;
  display:inline-flex;align-items:center;gap:4px;cursor:pointer;
}
.nav-more-trigger:hover{color:var(--ink);}
.nav-more .chev{display:inline-block;font-size:9px;transition:transform .15s ease;}
.nav-more:hover .chev,.nav-more:focus-within .chev,.nav-more.open .chev{transform:rotate(180deg);}
.nav-more-list{display:none;position:absolute;right:0;top:100%;margin-top:6px;background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 28px rgba(20,24,28,0.14);padding:6px;min-width:172px;z-index:20;}
.nav-more-list::before{content:"";position:absolute;top:-6px;left:0;right:0;height:6px;}
.nav-more:hover .nav-more-list,.nav-more:focus-within .nav-more-list,.nav-more.open .nav-more-list{display:block;}
.nav-more-list a{display:block;border-radius:5px;}
.nav-more-list a::after{display:none;}
.nav-more-list a:hover{background:var(--paper);}
.nav-more-trigger:focus-visible{outline:2px solid var(--court);outline-offset:2px;border-radius:2px;}
.nav-divider{width:1px;height:20px;background:var(--line);margin:0 2px;}
.nav-icons{display:flex;align-items:center;gap:2px;position:relative;}
.nav-icons .icon-btn{color:var(--ink-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;width:34px;height:34px;border-radius:50%;transition:background .12s ease,color .12s ease;}
.nav-icons .icon-btn:hover{color:var(--ink);background:var(--paper-raised);}
.nav-icons .icon-btn:focus-visible{outline:2px solid var(--court);outline-offset:2px;}
.search-panel{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 28px rgba(20,24,28,0.14);padding:10px;width:280px;z-index:30;}
.search-panel:not([hidden]){display:block;}
.search-input{width:100%;box-sizing:border-box;font-family:'JetBrains Mono',monospace;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);}
.search-input:focus-visible{outline:2px solid var(--court);outline-offset:1px;}
.search-results{margin-top:8px;max-height:280px;overflow-y:auto;}
.search-result{display:flex;flex-direction:column;gap:2px;padding:8px 8px;border-radius:5px;}
.search-result:hover,.search-result:focus-visible,.search-result.active{background:var(--paper);}
.search-result .sr-sport{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-muted);}
.search-result .sr-headline{font-size:13px;line-height:1.35;color:var(--ink);}
.search-empty{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-muted);padding:8px;}

/* ---------- row 1: scoreboard strip ---------- */
.scorebar{background:linear-gradient(100deg,#141310,#1C1A15 55%,#141310);border-bottom:2px solid var(--accent,var(--court));}
.scorebar-inner{display:flex;align-items:stretch;min-height:52px;overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;}
.scorebar-inner::-webkit-scrollbar{height:0;}
.scorebar-select-wrap{flex:none;border-right:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;}
.scorebar-select{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.03em;color:#F2F1EE;background-color:transparent;border:none;padding:9px 26px 9px 16px;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9F9D97 50%),linear-gradient(135deg,#9F9D97 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
.scorebar-select option{color:#121212;}
.scorebar-context{flex:none;display:flex;align-items:center;padding:0 16px;border-right:1px solid rgba(255,255,255,0.1);border-left:3px solid var(--accent,var(--court));font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.08em;color:#F2F1EE;white-space:nowrap;}
.scorebar-games{flex:1;display:flex;}
.scorebar-empty{padding:0 18px;display:flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#9F9D97;white-space:nowrap;}
.game-card{flex:0 0 auto;min-width:172px;border-right:1px solid rgba(255,255,255,0.1);padding:7px 16px;display:flex;flex-direction:column;justify-content:center;gap:4px;transition:background .12s ease;}
.scorebar-games .game-card:nth-child(even){background:rgba(255,255,255,0.03);}
.game-card:hover{background:rgba(255,255,255,0.05);}
.game-status{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#9F9D97;}
.game-status.live{color:var(--live);}
.game-status.live::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--live);margin-right:5px;animation:pulse 1.3s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:0.5;}50%{opacity:1;}}
@media (prefers-reduced-motion: reduce){.game-status.live::before{animation:none;}}
.game-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.team{display:flex;align-items:center;gap:8px;min-width:0;}
.team-abbr{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:#F2F1EE;}
.team-logo{width:22px;height:22px;object-fit:contain;border-radius:50%;background:#fff;padding:2px;box-sizing:border-box;flex:none;}
.team-record{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#9F9D97;}
.team-score{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#F2F1EE;}
.scorebar-updated{flex:none;display:flex;align-items:center;padding:0 16px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9F9D97;white-space:nowrap;border-left:1px solid rgba(255,255,255,0.1);font-variant-numeric:tabular-nums;}
.scorebar-full{flex:none;display:flex;align-items:center;padding:0 18px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#F2F1EE;white-space:nowrap;border-left:1px solid rgba(255,255,255,0.1);transition:opacity .12s ease;}
.scorebar-full:hover{opacity:0.75;}

/* ---------- live tracker (db-backed, updates without a republish) ---------- */
.live-tracker{background:var(--ink);border-bottom:1px solid var(--line);}
.live-tracker-inner{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;overflow-x:auto;}
.marquee-track{display:flex;align-items:center;gap:16px;flex:none;}
@media (max-width:760px){
  .live-tracker-inner{overflow-x:hidden;gap:0;}
  .live-tracker-inner .marquee-track{animation:marquee-scroll 16s linear infinite;}
}
@keyframes marquee-scroll{from{transform:translateX(0);}to{transform:translateX(-100%);}}
@media (max-width:760px) and (prefers-reduced-motion: reduce){
  .live-tracker-inner .marquee-track{animation:none;}
  .live-tracker-inner{overflow-x:auto;}
}
.lt-label{flex:none;display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#EDEDE8;}
.lt-label .dot{width:6px;height:6px;border-radius:50%;background:var(--court);animation:pulse 1.3s ease-in-out infinite;}
@media (prefers-reduced-motion: reduce){.lt-label .dot{animation:none;}}
.lt-card{flex:none;display:flex;align-items:center;gap:10px;background:#1A1917;border:1px solid #2B2A26;border-radius:999px;padding:7px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#EDEDE8;white-space:nowrap;text-decoration:none;transition:border-color .15s ease;}
.lt-card:hover{border-color:var(--court);}
.lt-card .st{font-weight:700;letter-spacing:0.05em;font-size:10px;padding:2px 7px;border-radius:3px;}
.lt-card .st.live{background:var(--court);color:#fff;}
.lt-card .st.upcoming{background:#2B2A26;color:#9F9D97;}
.lt-card .st.final{background:#2B2A26;color:#D1A851;}
.lt-card .score{font-weight:700;}
.lt-card .ago{color:#8A8F86;font-size:10.5px;}

/* ---------- row 3: contextual sub-nav ---------- */
.subnav{background:var(--paper);border-bottom:2px solid var(--accent,var(--court));}
.subnav-inner{display:flex;align-items:center;gap:22px;padding:0 20px;overflow-x:auto;max-width:1180px;margin:0 auto;}
.subnav-id{display:flex;align-items:center;gap:8px;padding:10px 0;flex:none;}
.subnav-id .mono-badge{width:22px;height:22px;border-radius:4px;background:var(--accent,var(--court));color:#fff;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;flex:none;}
.subnav-id .sp-name{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:16px;white-space:nowrap;}
.subtab{position:relative;flex:none;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;color:var(--ink-muted);padding:13px 0;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap;}
.subtab:hover{color:var(--ink);}
.subtab.active{color:var(--ink);border-color:var(--accent,var(--court));}
.subtab.disabled{opacity:0.4;cursor:default;}
.subtab:not(.disabled)::after{content:"";position:absolute;inset:-4px 0;}
.subtab:focus-visible{outline:2px solid var(--accent,var(--court));outline-offset:3px;border-radius:2px;}

/* ---------- pills / tags ---------- */
.pill{
  display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;
  font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;line-height:1.5;
}
.pill-recap{background:var(--court-soft);color:var(--court);}
.pill-preview{background:var(--away-soft);color:var(--away);}
.pill-injury{background:var(--clay-soft);color:var(--clay);}
.pill-debate{background:var(--gold-soft);color:var(--gold);}
.pill-analysis{background:var(--ink);color:var(--paper);}
.chip{
  position:relative;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;letter-spacing:0.03em;
  padding:6px 11px;border:1px solid var(--line);border-radius:999px;color:var(--ink-muted);background:var(--paper-raised);
  cursor:pointer;transition:border-color .12s ease,color .12s ease;
}
.chip:hover{color:var(--ink);}
.chip.on{color:var(--ink);border-color:var(--accent,currentColor);background:color-mix(in srgb, var(--accent,var(--court)) 10%, var(--paper-raised));}
.chip::after{content:"";position:absolute;inset:-9px -2px;}
.chip:focus-visible{outline:2px solid var(--accent,var(--court));outline-offset:2px;}
.fixtures-fallback{display:none;font-family:'JetBrains Mono',monospace;color:var(--ink-muted);font-size:12.5px;margin-top:12px;line-height:1.6;}

/* ---------- home hero ---------- */
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;padding:32px 0 10px;}
.hero-main{border:1px solid var(--line);background:var(--paper-raised);border-radius:6px;padding:28px;box-shadow:var(--shadow);}
.hero-kicker{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.1em;color:var(--court);text-transform:uppercase;margin-bottom:12px;display:block;}
.hero-main h1{font-size:44px;margin:0 0 14px;}
.hero-dek{font-size:18px;line-height:1.5;color:var(--ink-muted);font-style:italic;max-width:62ch;}
.hero-meta{margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-muted);}

.take-widget{border:1px solid var(--line);background:var(--paper-raised);border-radius:6px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;}
.take-widget h2{font-size:17px;margin-bottom:14px;}
.take-row{display:flex;flex-direction:column;gap:10px;flex:1;}
.take-side{border-left:3px solid var(--line);padding:4px 0 4px 12px;}
.take-side.for{border-color:var(--court);}
.take-side.against{border-color:var(--clay);}
.take-side .who{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-muted);display:block;margin-bottom:3px;}
.take-side p{margin:0;font-size:14.5px;line-height:1.45;}

/* ---------- bento grid (homepage) ---------- */
.bento-head{display:flex;align-items:baseline;justify-content:space-between;margin:40px 0 14px;}
.bento-head h2{font-size:20px;}
.bento-head .sub{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-muted);}
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.b-tile{border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);min-height:150px;position:relative;}
.b-tile.b-2{grid-column:span 2;}
.b-tile:not(.b-quote):not(.b-quiet){background:color-mix(in srgb, var(--accent, var(--court)) var(--tint,10%), var(--paper-raised));transition:background .15s ease, transform .15s ease;}
.b-tile:not(.b-quote):not(.b-quiet):hover{background:color-mix(in srgb, var(--accent, var(--court)) calc(var(--tint,10%) + 10%), var(--paper-raised));transform:translateY(-2px);}
.b-icon{width:30px;height:30px;color:var(--accent,var(--ink));flex:none;}
.b-tile .b-name{font-size:30px;color:var(--accent,var(--ink));}
.b-tile.b-2 .b-name{font-size:40px;}
.b-tile .b-headline{font-family:'Anton',sans-serif;font-size:17px;font-weight:400;color:var(--ink);letter-spacing:0.01em;line-height:1.22;text-transform:none;}
.b-tile .b-status{font-family:'Source Serif 4',Georgia,serif;font-size:12.5px;font-weight:400;color:var(--ink-muted);letter-spacing:0;line-height:1.5;text-transform:none;}
.b-tile .b-peek{font-size:13.5px;color:var(--ink-muted);margin-top:auto;padding-top:10px;border-top:1px solid color-mix(in srgb, var(--accent,var(--court)) 25%, var(--line));}
.b-tile .b-go{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.04em;color:var(--accent,var(--court));position:absolute;top:22px;right:22px;}
.b-tile.b-live{border-color:var(--live);}
.b-live-badge{display:inline-flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.06em;color:var(--live);align-self:flex-start;}
.b-live-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--live);margin-right:6px;animation:pulse 1.3s ease-in-out infinite;}
@media (prefers-reduced-motion: reduce){.b-live-badge .dot{animation:none;}}
.b-tile.b-quote{background:#121212;color:#EDEDE8;border-color:#121212;}
.b-tile.b-quote .b-q-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#D1A851;}
.b-tile.b-quote .b-q-text{font-size:16px;line-height:1.4;font-style:italic;}
.b-tile.b-quote .b-q-who{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9F9D97;margin-top:auto;padding-top:10px;border-top:1px solid #2B2A26;}
.b-tile.b-quote .b-q-link{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;color:#D1A851;align-self:flex-start;}
.b-tile.b-quiet{background:var(--paper-raised);}
.b-tile.b-quiet .b-quiet-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:4px;}
.b-quiet-row{display:flex;flex-direction:column;gap:4px;padding:10px 6px;margin:0 -6px;border-bottom:1px solid var(--line);border-radius:6px;color:inherit;text-decoration:none;transition:background-color .12s ease;}
.b-quiet-row:last-child{border-bottom:none;}
.b-quiet-row:hover,.b-quiet-row:focus-visible,.b-quiet-row:active{background-color:var(--line);}
.b-quiet-row .nm-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.b-quiet-row .nm{font-size:14px;font-weight:700;}
.b-quiet-row .go{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-muted);flex:none;}
.b-quiet-row .st{font-family:'Anton',sans-serif;font-size:12.5px;font-weight:400;color:var(--ink-muted);line-height:1.4;letter-spacing:0.01em;text-transform:none;}
@media (max-width:760px){.bento{grid-template-columns:repeat(2,1fr);}.b-tile.b-2{grid-column:span 2;}}
.bento-secondary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px;}
.bento-secondary .b-tile{min-height:0;padding:18px;}
@media (max-width:760px){.bento-secondary{grid-template-columns:1fr;}}

/* ---------- priority board ---------- */
.board-head{display:flex;align-items:baseline;justify-content:space-between;margin:38px 0 4px;border-bottom:2px solid var(--ink);padding-bottom:8px;}
.board-head h2{font-size:20px;}
.board-head .sub{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-muted);}
.board{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper-raised);}
.board-row{display:grid;grid-template-columns:34px 70px 1fr auto;align-items:center;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line);border-left:5px solid var(--accent,var(--court));background:color-mix(in srgb, var(--accent, var(--court)) var(--tint,6%), var(--paper-raised));transition:background .15s ease;}
.board-row:last-child{border-bottom:none;}
.board-row:hover{background:color-mix(in srgb, var(--accent, var(--court)) calc(var(--tint,6%) + 8%), var(--paper-raised));}
.board-row.tier-1{--tint:20%;padding:26px 24px;}
.board-row.tier-2{--tint:12%;padding:22px 22px;}
.board-row.tier-3{--tint:7%;}
.board-row .rank{font-family:'JetBrains Mono',monospace;color:var(--ink-muted);font-size:12px;font-weight:700;}
.board-row .name-wrap{display:flex;flex-direction:column;gap:3px;min-width:0;}
.board-row .status{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-muted);letter-spacing:0.03em;font-weight:600;}
.board-row .peek{font-size:13.5px;color:var(--ink-muted);margin-top:2px;}
.board-row .go{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;color:var(--accent,var(--court));white-space:nowrap;background:var(--paper);padding:7px 14px;border-radius:999px;border:1px solid var(--accent,var(--court));}
a.board-row{display:grid;}
.board-row.tier-1 .sport-name{font-size:42px;color:var(--accent,var(--ink));}
.board-row.tier-2 .sport-name{font-size:30px;}
.board-row.tier-3 .sport-name{font-size:21px;}
.heatmeter{display:flex;gap:2px;align-items:center;}
.heatmeter i{width:5px;height:14px;border-radius:1px;background:var(--line);display:block;}
.heatmeter i.on{background:var(--accent,var(--clay));}

.quiet-strip{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 6px;}
.quiet-chip{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:10px 14px;background:var(--paper-raised);flex:1 1 220px;}
.quiet-chip .status{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-muted);letter-spacing:0.03em;}

/* ---------- insider wire ---------- */
.wire{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;margin-top:14px;scroll-snap-type:x proximity;}
.wire::-webkit-scrollbar{height:6px;}
.wire::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.wire-card{flex:0 0 280px;scroll-snap-align:start;border:1px solid var(--line);border-radius:6px;background:var(--paper-raised);padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
.wire-top{display:flex;align-items:center;justify-content:space-between;}
.wire-team-wrap{display:flex;align-items:center;gap:7px;min-width:0;}
.wire-logo{width:18px;height:18px;object-fit:contain;flex:none;}
.wire-team{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink);}
.wire-time{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-muted);}
.wire-note{font-size:14px;line-height:1.45;}
.wire-src{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-muted);display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:8px;margin-top:2px;}
.wire-src b{color:var(--ink);font-weight:700;}
.wire-src .src-link{color:var(--court);font-weight:600;}

/* ---------- hub ---------- */
.hub-head{padding:30px 0 20px;border-bottom:1px solid var(--line);}
.hub-head .hub-status{display:flex;align-items:center;gap:10px;margin-top:10px;}
.hub-head h1{font-size:50px;color:var(--accent,var(--ink));}
.league-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}

.rail-head{display:flex;align-items:baseline;gap:12px;margin:34px 0 14px;}
.rail-head h3{font-size:19px;}
.rail-head .pill{position:relative;top:-2px;}
.rail{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity;}
.rail::-webkit-scrollbar{height:6px;}
.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.card{
  flex:0 0 300px;scroll-snap-align:start;border:1px solid var(--line);border-radius:6px;background:var(--paper-raised);
  padding:16px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow);
}
.card h4{font-family:'Anton',sans-serif;text-transform:none;letter-spacing:0;font-size:18px;line-height:1.18;font-weight:400;}
.card p{font-size:13.5px;line-height:1.45;color:var(--ink-muted);margin:0;}
.card .meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-muted);display:flex;gap:8px;margin-top:auto;}

/* ---------- sports news (long-form) ---------- */
.sn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding:36px 0 60px;}
.sn-card{
  border:1px solid var(--line);border-radius:10px;background:var(--paper-raised);
  padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);
  transition:border-color .15s ease,transform .15s ease;
}
.sn-card:hover{border-color:var(--accent,var(--court));transform:translateY(-2px);}
.sn-card-top{display:flex;align-items:center;gap:10px;}
.sn-card-sport{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--accent,var(--court));}
.sn-card h3{font-family:'Anton',sans-serif;text-transform:none;letter-spacing:0;font-size:24px;line-height:1.15;font-weight:400;}
.sn-card p{font-size:14.5px;line-height:1.5;color:var(--ink-muted);margin:0;}
.sn-card .meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-muted);display:flex;gap:8px;margin-top:auto;}
.sn-empty{padding:60px 0;text-align:center;color:var(--ink-muted);border-top:1px solid var(--line);}
@media (max-width:760px){.sn-grid{grid-template-columns:1fr;}}

/* ---------- placeholder hub ---------- */
.ph-skel{border:1px dashed var(--line);border-radius:6px;padding:30px;margin-top:28px;text-align:center;color:var(--ink-muted);}
.ph-skel .disp{font-size:26px;color:var(--ink);margin-bottom:8px;}
.ph-cats{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}

/* ---------- article ---------- */
.breadcrumb{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-muted);padding:22px 0 0;}
.breadcrumb a:hover{color:var(--ink);text-decoration:underline;}
.article-head{padding:14px 0 28px;border-bottom:1px solid var(--line);}
.article-head h1{font-size:38px;margin:14px 0 12px;max-width:26ch;}
.article-dek{font-size:19px;font-style:italic;color:var(--ink-muted);max-width:60ch;line-height:1.5;}
.byline{margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.byline .prov{background:var(--court-soft);color:var(--court);padding:3px 8px;border-radius:3px;font-weight:600;}

.article-body{display:grid;grid-template-columns:1fr 280px;gap:40px;padding:28px 0 60px;align-items:start;}
.prose{font-size:17.5px;line-height:1.7;max-width:66ch;}
.prose p{margin:0 0 18px;}
.prose p:first-of-type::first-letter{
  font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-style:italic;font-size:50px;float:left;line-height:0.72;padding:4px 6px 0 0;color:var(--accent,var(--court));
}
.qa{background:var(--paper-raised);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:26px;}
.qa .label{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:10px;display:block;}
.qa dt{font-weight:600;font-size:14.5px;margin-top:10px;}
.qa dt:first-of-type{margin-top:0;}
.qa dd{margin:3px 0 0;font-size:14.5px;color:var(--ink-muted);}
.qa dl{margin:0;}

.pullquote{border-left:3px solid var(--accent,var(--court));margin:26px 0;padding:2px 0 2px 20px;font-size:21px;line-height:1.4;font-style:italic;}
.related-callout{display:block;margin:30px 0 10px;padding:18px 20px;border:1px solid var(--line);border-radius:8px;background:var(--paper-raised);text-decoration:none;transition:border-color .15s ease;}
.related-callout:hover{border-color:var(--accent,var(--court));}
.related-callout .rc-label{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--accent,var(--court));margin-bottom:6px;}
.related-callout .rc-headline{display:block;font-family:'Anton',sans-serif;font-size:17px;color:var(--ink);}

.takes{display:flex;flex-direction:column;gap:14px;margin:26px 0;}
.take-card{border-radius:6px;padding:16px 18px;border:1px solid var(--line);}
.take-card.for{background:var(--court-soft);border-color:var(--court);}
.take-card.against{background:var(--clay-soft);border-color:var(--clay);}
.take-card .who{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;display:block;margin-bottom:6px;}
.take-card.for .who{color:var(--court);}
.take-card.against .who{color:var(--clay);}
.take-card p{margin:0;font-size:15.5px;line-height:1.5;}

.sidebar{display:flex;flex-direction:column;gap:18px;position:sticky;top:20px;}
.box{border:1px solid var(--line);border-radius:6px;background:var(--paper-raised);padding:16px 18px;}
.box h5{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 12px;}
.odds-row{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);}
.odds-row:last-child{border-bottom:none;}
.odds-row .line{color:var(--ink-muted);font-weight:600;}
.injury-item{padding:9px 0;border-bottom:1px solid var(--line);}
.injury-item:last-child{border-bottom:none;}
.injury-item .nm{font-weight:600;font-size:14px;}
.injury-item .st{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.04em;text-transform:uppercase;color:var(--clay);display:block;margin-top:1px;}
.injury-item .dt{font-size:12.5px;color:var(--ink-muted);margin-top:3px;}


/* ---------- MLB "Baseball Edition" hub ---------- */
.mlb-page{background:#0A0C0B;color:#EDEDE8;}
.mlb-progress{position:fixed;top:0;left:0;height:3px;background:#D1A851;z-index:50;width:0%;transition:width .1s linear;}
.mlb-nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid #22251F;max-width:1180px;margin:0 auto;}
.mlb-nav .mlb-logo{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:0.04em;color:#EDEDE8;}
.mlb-nav .mlb-links{display:flex;gap:26px;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.08em;color:#8A8F86;text-transform:uppercase;}
.mlb-nav .mlb-links a:hover{color:#EDEDE8;}
.mlb-hero{position:relative;min-height:380px;display:flex;align-items:center;padding:60px 0;overflow:hidden;max-width:1180px;margin:0 auto;}
.mlb-ghost{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Anton',sans-serif;font-size:clamp(90px,16vw,220px);color:transparent;-webkit-text-stroke:1px #2A2D26;letter-spacing:0.02em;white-space:nowrap;pointer-events:none;z-index:0;}
.mlb-hero-content{position:relative;z-index:1;max-width:760px;}
.mlb-hero-content .eyebrow{font-family:'JetBrains Mono',monospace;color:#D1A851;font-size:12px;font-weight:700;letter-spacing:0.12em;}
.mlb-hero-content h1{font-family:'Anton',sans-serif;font-size:clamp(32px,5vw,54px);color:#EDEDE8;margin:14px 0;text-transform:uppercase;line-height:1.05;}
.mlb-hero-content p{font-size:16px;color:#AEB3A8;line-height:1.6;max-width:56ch;}
.mlb-path{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:0 20px 10px;}
.mlb-path-stage{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 22px;border:1px solid #2A2D26;border-radius:8px;background:#0A0C0B;min-width:112px;}
.mlb-path-stage.is-current{border-color:#D1A851;background:rgba(209,168,81,0.08);}
.mlb-path-stage .rnd{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:0.08em;color:#8A8F86;text-transform:uppercase;}
.mlb-path-stage.is-current .rnd{color:#D1A851;}
.mlb-path-stage .res{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#EDEDE8;letter-spacing:0.02em;}
.mlb-path-arrow{color:#4A4E47;font-size:15px;flex:none;}
@media (max-width:640px){.mlb-path{gap:8px;}.mlb-path-stage{padding:10px 14px;min-width:0;flex:1;}.mlb-path-arrow{display:none;}}
.mlb-stat-line{font-family:'Anton',sans-serif;font-size:clamp(20px,3vw,34px);text-transform:uppercase;color:#EDEDE8;text-align:center;max-width:820px;margin:30px auto 50px;line-height:1.3;}
.mlb-stat-line b{color:#D1A851;}
.mlb-section{max-width:1180px;margin:0 auto;padding:10px 0 50px;position:relative;z-index:1;}
.mlb-section .rail-head h3,.mlb-section .board-head h2{color:#EDEDE8;}
.mlb-section .card{background:#13150F;border-color:#22251F;}
.mlb-section .card h4{color:#EDEDE8;}
.mlb-section .pill-recap{background:rgba(209,168,81,0.14);color:#D1A851;}
.mlb-section .pill-preview{background:rgba(237,237,232,0.08);color:#C7C5BE;}
.mlb-section .pill-injury{background:rgba(201,107,87,0.14);color:#C96B57;}

/* ---------- F1 page ---------- */
.f1-page{background:#FAFAF8;}
.f1-topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid #E4E4DF;max-width:1180px;margin:0 auto;}
.f1-topbar .f1-logo{font-family:'Anton',sans-serif;font-size:19px;letter-spacing:0.03em;color:#0B0B0B;text-transform:uppercase;}
.f1-topbar .f1-store{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.08em;color:#0B0B0B;text-transform:uppercase;}
.f1-track-wrap{max-width:1180px;margin:0 auto;padding:50px 0 20px;display:flex;justify-content:center;}
.f1-next{max-width:1180px;margin:0 auto;padding:0 0 50px;}
.f1-next .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;letter-spacing:0.1em;color:#8A8F86;text-transform:uppercase;}
.f1-next h1{font-family:'Anton',sans-serif;font-size:clamp(34px,5.5vw,58px);color:#0B0B0B;text-transform:uppercase;margin:8px 0 24px;}
.f1-countdown{display:flex;gap:30px;margin-bottom:26px;}
.f1-countdown .unit{text-align:left;}
.f1-countdown .num{font-family:'JetBrains Mono',monospace;font-size:clamp(34px,6vw,64px);font-weight:700;color:#0B0B0B;font-variant-numeric:tabular-nums;line-height:1;}
.f1-countdown .lbl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:#8A8F86;text-transform:uppercase;margin-top:4px;}
.f1-next p{font-size:15px;color:#4A4E47;max-width:62ch;line-height:1.6;margin-bottom:26px;}
.f1-pill-btn{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;background:#0B0B0B;color:#fff;padding:14px 24px;}

.f1-dark{background:#0B0B0B;color:#F2F2EC;position:relative;overflow:hidden;}
.f1-grid-lines{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg, rgba(242,242,236,0.06) 0, rgba(242,242,236,0.06) 1px, transparent 1px, transparent 160px);pointer-events:none;z-index:0;}
.f1-helmet-section{position:relative;max-width:1180px;margin:0 auto;padding:90px 0;min-height:70vh;display:flex;align-items:center;justify-content:center;z-index:1;}
.f1-helmet-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:30px;width:100%;}
.f1-helmet-stats{display:flex;flex-direction:column;gap:26px;}
.f1-helmet-stats.right{align-items:flex-end;text-align:right;}
.f1-helmet-stats .n{font-family:'Anton',sans-serif;font-size:36px;color:#F2F2EC;}
.f1-helmet-stats .l{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9A9D94;letter-spacing:0.05em;text-transform:uppercase;margin-top:2px;}
.f1-helmet-svg{filter:drop-shadow(0 20px 40px rgba(0,0,0,0.5));will-change:transform;}
.f1-quote{text-align:center;font-family:'Anton',sans-serif;font-size:clamp(18px,2.6vw,30px);line-height:1.35;max-width:820px;margin:60px auto 0;text-transform:uppercase;color:#D8D8CE;position:relative;z-index:1;}
.f1-quote b{color:#D1A851;}

.f1-schedule{max-width:1180px;margin:0 auto;padding:60px 0;}
.f1-schedule-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
.f1-schedule-head h2{font-family:'Anton',sans-serif;font-size:26px;text-transform:uppercase;color:#0B0B0B;}
.f1-tabs{display:flex;gap:18px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;}
.f1-tabs span{color:#8A8F86;padding-bottom:4px;}
.f1-tabs span.on{color:#0B0B0B;border-bottom:2px solid #0B0B0B;}
.f1-row{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid #E4E4DF;font-family:'JetBrains Mono',monospace;}
.f1-row .s{font-weight:700;letter-spacing:0.04em;text-transform:uppercase;font-size:13px;color:#0B0B0B;}
/* the bespoke MLB/F1 hubs center on a 1180px column but, unlike .wrap, never gave it
   horizontal padding — fine once the viewport is wider than 1180px, but content sits
   flush against the screen edge on every mobile and most laptop widths */
.mlb-nav,.mlb-hero,.mlb-pins,.mlb-section,
.f1-topbar,.f1-track-wrap,.f1-next,.f1-helmet-section,.f1-schedule{
  padding-left:20px;padding-right:20px;
}
.f1-row .t{font-size:13px;color:#4A4E47;}

.f1-result-item{border-bottom:1px solid #E4E4DF;}
.f1-result-item summary{list-style:none;cursor:pointer;}
.f1-result-item summary::-webkit-details-marker{display:none;}
.f1-result-row{display:grid;grid-template-columns:18px 40px 1fr 170px 110px;gap:10px;padding:11px 0;font-family:'JetBrains Mono',monospace;font-size:12.5px;align-items:baseline;}
.f1-result-row::before{content:"▸";color:#8A8F86;transition:transform .15s ease;align-self:center;}
.f1-result-item[open] .f1-result-row::before{transform:rotate(90deg);}
.f1-result-row .rnd{font-weight:700;color:#8A8F86;}
.f1-result-row .gp{color:#0B0B0B;font-weight:600;}
.f1-result-row .win{color:#0B0B0B;}
.f1-result-row .win .note{color:#C76B1E;font-size:10.5px;margin-left:5px;}
.f1-result-row .tm{color:#4A4E47;text-align:right;}
.f1-podium{padding:2px 0 14px 68px;display:flex;flex-direction:column;gap:5px;}
.f1-podium-row{display:flex;gap:14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#4A4E47;}
.f1-podium-row .p{font-weight:700;width:22px;}
.f1-podium-row .p1{color:#9C7A2E;}
.f1-podium-row .d{color:#0B0B0B;font-weight:600;width:130px;}
.f1-podium-row .t{color:#6B6F66;flex:1;min-width:0;}
.f1-podium-row .g{color:#8A8F86;width:72px;text-align:right;flex:none;}
.f1-standing-row{display:grid;grid-template-columns:26px 140px 120px 1fr 48px;gap:12px;padding:10px 0;border-bottom:1px solid #E4E4DF;font-family:'JetBrains Mono',monospace;font-size:12.5px;align-items:center;}
.f1-standing-row .pos{font-weight:700;color:#8A8F86;}
.f1-standing-row.p1 .pos{color:#9C7A2E;}
.f1-standing-row .drv{color:#0B0B0B;font-weight:600;}
.f1-standing-row .tm{color:#4A4E47;}
.f1-standing-row .barwrap{height:6px;background:#E4E4DF;border-radius:3px;overflow:hidden;}
.f1-standing-row .bar{height:100%;background:#B3261E;border-radius:3px;}
.f1-standing-row .pts{text-align:right;font-weight:700;color:#0B0B0B;}

/* ---------- fixtures table ---------- */
.fx-wrap{margin-top:8px;}
.fx-group{margin-bottom:22px;}
.fx-group h4{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent,var(--ink-muted));margin:0 0 6px;}

function teamLogo(scope, abbr){
  return (TEAM_LOGOS[scope] && TEAM_LOGOS[scope][abbr]) || null;
}
function fxBadgeColor(abbr){
  let h = 0;
  for(let i=0;i<abbr.length;i++) h = (h*31 + abbr.charCodeAt(i)) % 360;
  return `hsl(${h},55%,38%)`;
}
function fxTeam(abbr, scope){
  const logo = teamLogo(scope, abbr);
  const mark = logo
    ? `<img class="fx-badge fx-logo" src="${logo}" alt="" loading="lazy">`
    : `<span class="fx-badge" style="background:${fxBadgeColor(abbr)}">${abbr.slice(0,3)}</span>`;
  return `<span class="fx-team">${mark}${abbr}</span>`;
}
const FX_LOGO_SCOPE = {ucl:'football', nfl:'nfl'};
function renderFixtures(key){
  const fx = FIXTURES[key];
  const scope = FX_LOGO_SCOPE[key];
  return `<div class="fx-wrap">
    ${fx.weeks.map(w=>`
      <div class="fx-group">
        <h4>${w.week}</h4>
        ${w.games.map(g=>`<div class="fx-row">
          <span class="fx-teams">${fxTeam(g.away, scope)} <span class="vs">at</span> ${fxTeam(g.home, scope)}</span>
          ${g.score ? `<span class="fx-score tnum">${g.score}</span>` : '<span></span>'}
          <span class="fx-status">${g.status}</span>
        </div>`).join('')}
        ${w.note ? `<div class="fx-note">${w.note}</div>` : ''}
      </div>
    `).join('')}
  </div>`;
}

const STD_DARK_BACKDROP = new Set(['NZ']);
function stdTeamCell(abbr, name, scope){
  const logo = teamLogo(scope, abbr);
  const mark = logo
    ? `<img class="std-badge${STD_DARK_BACKDROP.has(abbr)?' std-badge-dark':''}" src="${logo}" alt="" loading="lazy">`
    : `<span class="std-badge std-badge-fallback" style="background:${fxBadgeColor(abbr)}">${abbr.slice(0,3)}</span>`;
  return `${mark}<span class="std-name">${name}</span>`;
}
const STD_ZONE_CLASS = {
  'Round of 16':'zone-top', 'Champions League':'zone-top',
  'Playoffs':'zone-mid', 'Europa League':'zone-mid', 'Conference League':'zone-mid',
  'Eliminated':'zone-out', 'Relegation':'zone-out',
};
function stdZoneClass(zones, pos){
  const z = zones && zones.find(([from,to])=>pos>=from && pos<=to);
  return z ? {cls: STD_ZONE_CLASS[z[2]], label: z[2]} : {cls:'', label:''};
}
function renderStandingsTable(key){
  const t = FOOTBALL_STANDINGS[key];
  const zoneLabels = t.zones ? [...new Set(t.zones.map(z=>z[2]))] : [];
  return `<div class="div-section">
    <div class="div-section-head"><h3 class="disp">Standings</h3><span class="sub">${t.label}</span></div>
    <div class="std-table">
      <div class="std-row std-head"><span class="std-pos"></span><span class="std-team">Team</span><span class="tnum std-col-gp">GP</span><span class="tnum std-col-wdl">W</span><span class="tnum std-col-wdl">D</span><span class="tnum std-col-wdl">L</span><span class="tnum std-col-wdl">GD</span><span class="tnum std-pts">Pts</span></div>
      ${t.rows.map((r,i)=>{
        const gd = r.gf - r.ga;
        const zone = stdZoneClass(t.zones, i+1);
        return `<div class="std-row ${zone.cls}" title="${zone.label}">
          <span class="std-pos">${i+1}</span>
          <span class="std-team">${stdTeamCell(r.abbr, r.team, 'football')}</span>
          <span class="tnum std-col-gp">${r.gp}</span><span class="tnum std-col-wdl">${r.w}</span><span class="tnum std-col-wdl">${r.d}</span><span class="tnum std-col-wdl">${r.l}</span>
          <span class="tnum std-col-wdl">${gd>0?'+':''}${gd}</span><span class="tnum std-pts">${r.pts}</span>
        </div>`;
      }).join('')}
    </div>
    ${zoneLabels.length ? `<div class="std-legend">${zoneLabels.map(l=>`<span class="std-legend-item"><span class="std-legend-swatch ${STD_ZONE_CLASS[l]}"></span>${l}</span>`).join('')}</div>` : ''}
  </div>`;
}
function renderNFLStandings(){
  return `<div class="div-section">
    <div class="div-section-head"><h3 class="disp">Standings</h3><span class="sub">AFC &amp; NFC · Week 8</span></div>
    <div class="div-grid">
      ${NFL_STANDINGS.map(div=>`<div class="div-col">
        <h4>${div.name}</h4>
        <div class="nfl-std-table">
          <div class="nfl-std-row nfl-std-head"><span class="nfl-std-team">Team</span><span class="tnum">W</span><span class="tnum">L</span><span class="tnum">T</span><span class="tnum">PCT</span></div>
          ${div.teams.map(team=>`<div class="nfl-std-row">
            <a class="nfl-std-team" href="#/nfl-team/${team.abbr}">${stdTeamCell(team.abbr, team.name, 'nfl')}</a>
            <span class="tnum">${team.w}</span><span class="tnum">${team.l}</span><span class="tnum">${team.t}</span><span class="tnum">${team.pct}</span>
          </div>`).join('')}
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}

function teamBadge(abbr){
  return `<span class="cric-badge">${abbr}</span>`;
}
function renderCricketMatchCard(m, hasReport){
  const live = m.status === 'live';
  const clickable = hasReport ? ' role="button" tabindex="0" onclick="document.getElementById(\'cric-report\').scrollIntoView({behavior:\'smooth\',block:\'start\'})" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();this.click();}"' : '';
  return `<div class="cric-card ${live?'is-live':''}${hasReport?' is-clickable':''}"${clickable}>
    <div class="cric-card-head">
      <span class="cric-card-title">${m.teams.away.name} vs ${m.teams.home.name}</span>
      ${live ? `<span class="cric-live-tag"><span class="dot"></span>LIVE</span>` : ''}
    </div>
    <div class="cric-card-sub">${m.series} · ${m.matchInfo || m.matchLabel} · ${m.venue}</div>
    <div class="cric-card-teams">
      <div class="cric-card-team">
        ${teamBadge(m.teams.away.abbr)}
        <span class="nm">${m.teams.away.name}</span>
        ${m.teams.away.score!=null ? `<span class="sc tnum">${m.teams.away.score}${m.teams.away.wkts!=null?'/'+m.teams.away.wkts:''}</span><span class="ov">(${m.teams.away.overs} ov)</span>` : ''}
      </div>
      <div class="cric-card-team">
        ${teamBadge(m.teams.home.abbr)}
        <span class="nm">${m.teams.home.name}</span>
        ${m.teams.home.score!=null ? `<span class="sc tnum">${m.teams.home.score}${m.teams.home.wkts!=null?'/'+m.teams.home.wkts:''}</span><span class="ov">(${m.teams.home.overs} ov)</span>` : ''}
      </div>
    </div>
    <div class="cric-card-result">${m.resultLine}</div>
    ${hasReport ? `<div class="cric-card-jump">${live?'View live scorecard':'View scorecard'} ↓</div>` : ''}
  </div>`;
}
function topBatters(inn,n){ return [...inn.batting].sort((a,b)=>b.r-a.r).slice(0,n); }
function topBowlers(inn,n){ return [...inn.bowling].sort((a,b)=>b.w-a.w || a.econ-b.econ).slice(0,n); }
function renderCricketSummary(matchId){
  const m = CRICKET_SCORECARDS[matchId];
  if(!m) return '';
  return `${m.playerOfMatch ? `<div class="cric-pom"><span class="l">Player of the Match</span><span class="nm">${m.playerOfMatch.name}</span><span class="line">(${m.playerOfMatch.team}) · ${m.playerOfMatch.line}</span></div>` : ''}
  ${m.innings.map((inn,i)=>{
    const bowlInn = m.innings[1-i] || {bowling:[]};
    if(inn.yetToBat){
      return `<div class="cric-summary-block">
        <div class="cric-summary-head">${inn.team} · yet to bat</div>
      </div>`;
    }
    return `<div class="cric-summary-block">
      <div class="cric-summary-head">${inn.team} · ${inn.total}${inn.wkts<10?'/'+inn.wkts:''} (${inn.overs})</div>
      <div class="cric-summary-cols">
        <div class="cric-summary-col">
          <span class="h">Top batting</span>
          ${topBatters(inn,3).map(b=>`<div class="row"><span class="nm">${b.name}</span><span class="st tnum">${b.r} (${b.b})</span></div>`).join('')}
        </div>
        <div class="cric-summary-col">
          <span class="h">Top bowling</span>
          ${topBowlers(bowlInn,3).map(b=>`<div class="row"><span class="nm">${b.name}</span><span class="st tnum">${b.w}/${b.r} (${b.o})</span></div>`).join('')}
        </div>
      </div>
    </div>`;
  }).join('')}`;
}
function renderCricketScorecardTable(matchId){
  const m = CRICKET_SCORECARDS[matchId];
  if(!m) return '';
  return `<div class="cric-sc-tabs">
    ${m.innings.map((inn,i)=>`<span class="chip ${i===0?'on':''}" data-inn="${i}" role="button" tabindex="0" aria-pressed="${i===0?'true':'false'}" onclick="showCricInnings('${matchId}',${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">${inn.team}</span>`).join('')}

  ${m.innings.map((inn,i)=>`<div class="cric-innings" data-inn="${i}" style="${i===0?'':'display:none;'}">
    ${inn.yetToBat ? `<p class="fixtures-fallback">${inn.team} hasn't batted yet.</p>` : `
    <div class="cric-bat-table">
      <div class="cric-bat-row cric-bat-head"><span class="nm">Batting</span><span>R</span><span>B</span><span>4s</span><span>6s</span><span>SR</span></div>

        <span class="tnum">${b.r}</span><span class="tnum">${b.b}</span><span class="tnum">${b.fours}</span><span class="tnum">${b.sixes}</span><span class="tnum">${b.sr.toFixed(2)}</span>

    </div>
    ${inn.fow ? `<div class="cric-fow"><span class="h">Fall of wickets</span><span class="line">${inn.fow}</span></div>` : ''}
    <div class="cric-bowl-table">
      <div class="cric-bowl-row cric-bowl-head"><span class="nm">Bowling</span><span>O</span><span>M</span><span>R</span><span>W</span><span>Econ</span></div>

function renderCricketWidgets(){
  // Always surface the most recently completed match's scorecard (last entry added to
  // CRICKET_SCORECARDS) rather than one matched to the upcoming live match's teams — a team
  // match can pick an older result and bury the latest one, which is the whole point of this widget.
  const reportMatchId = Object.keys(CRICKET_SCORECARDS).slice(-1)[0];
  return `
    ${renderCricketMatchCard(CRICKET_LIVE_MATCH, !!reportMatchId)}
    ${reportMatchId ? `
    <div class="cric-report" id="cric-report">
      <div class="cric-report-head"><h3 class="disp">${CRICKET_SCORECARDS[reportMatchId].title}</h3><span class="sub">${CRICKET_SCORECARDS[reportMatchId].result}</span></div>
      <div class="cric-report-tabs">
        <span class="chip on" data-view="summary" role="button" tabindex="0" aria-pressed="true" onclick="showCricView('summary')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">Summary</span>
        <span class="chip" data-view="scorecard" role="button" tabindex="0" aria-pressed="false" onclick="showCricView('scorecard')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">Scorecard</span>
      </div>
      <div class="cric-view" data-view="summary">${renderCricketSummary(reportMatchId)}</div>
      <div class="cric-view" data-view="scorecard" style="display:none;">${renderCricketScorecardTable(reportMatchId)}</div>
    </div>` : ''}
  `;
}
function showCricView(view){
  document.querySelectorAll('.cric-report-tabs .chip').forEach(c=>{

        ['Who were the key performers?','Liam Hicks hit a first-inning, two-run homer for Tampa Bay; Sal Frelick\'s solo homer in the sixth tied it for Milwaukee, and Cooper Pratt\'s RBI single in the seventh, scoring Brice Turang, put the Brewers ahead for good. Abner Uribe got the win and Aaron Ashby struck out three to close it out for the save.']],
    body:[
      'Tampa Bay jumped on Milwaukee starter Logan Henderson immediately. Chandler Simpson singled home Yandy Diaz, Junior Caminero singled home Simpson, and Liam Hicks followed with a two-run homer to right-center that made it 4-0 before the Brewers had even batted.',
      'Milwaukee answered right back in the bottom of the first — William Contreras\' RBI single scored Jackson Chourio, and Garrett Mitchell\'s RBI single brought in Jake Bauers to cut the deficit to 4-2 before the inning was out. David Hamilton reached on a fielding error by Rays first baseman Jonathan Aranda in the fourth, with Cooper Pratt scoring on the play to make it 4-3, and Sal Frelick\'s solo homer to center in the sixth tied the game at 4-4.',
      'The go-ahead run came in the seventh: Pratt lined a single into right field to score Brice Turang and put the Brewers in front for the first time all night, 5-4. The bullpen made it hold up — Abner Uribe worked 1.1 scoreless innings for the win, and Aaron Ashby struck out three over the final two innings, stranding the potential tying run at third when Yandy Diaz was rung up on a checked swing to end it, his third save of the postseason. Rays starter Drew Rasmussen allowed three runs in 3.2 innings, and reliever Tyler Wells took the loss after letting an inherited run score in the fourth. Milwaukee, which won Game 1 3-2, now takes a 2-0 series lead to Tropicana Field for Game 3 on Monday.',
    ],
    related:'world-series-game2-breakdown',
  },
  {id:'world-series-game2-breakdown', sport:'mlb', cat:'analysis',
    headline:'How Milwaukee\'s Bullpen Buried a 4-0 Hole in Game 2',
    dek:'Logan Henderson didn\'t survive the third inning, but six scoreless innings from the Brewers\' bullpen — and a run chipped away almost every inning on offense — turned a laugher into a 2-0 World Series lead.',
    byline:'Clutch Room MLB Desk', mins:7, time:'Oct 25, 2026',
    qa:[['How bad was the start for Milwaukee?','Logan Henderson allowed four runs on three hits in three innings, including Liam Hicks\' two-run homer, and didn\'t pitch a fourth.'],
        ['What changed after that?','Five Brewers relievers combined for six scoreless innings on four hits allowed, with Abner Uribe getting the win and Aaron Ashby closing it out with three strikeouts for the save.']],
    body:[
      'Game 2 looked like a laugher early. Logan Henderson lasted exactly three innings, and the first of them was a disaster — Chandler Simpson, Junior Caminero and Liam Hicks strung together three straight hits, Hicks\' two-run shot to right-center making it 4-0 before Milwaukee had come to bat. Henderson settled in after that, but by the time he was done he\'d allowed four runs on three hits, and the Brewers needed six more innings of pitching just to keep the game within reach.',
      'They got exactly that. Three relievers bridged the gap after Henderson without letting the Rays add to the lead, and then Abner Uribe and Aaron Ashby finished it off: five Milwaukee relievers combined to throw six scoreless innings, allowing just four hits and no runs the rest of the way. Ashby, fresh off closing out Game 4 of the NLCS, worked the final 1.2 innings and struck out three, stranding the tying run at third when Yandy Diaz was rung up on a checked swing to end the game.',
      'The offense did its part too, chipping away an inning or two at a time rather than in one swing: William Contreras and Garrett Mitchell\'s RBI singles made it 4-2 in the first, a fielding error by Rays first baseman Jonathan Aranda brought another run home in the fourth, Sal Frelick\'s solo homer tied it in the sixth, and Cooper Pratt\'s go-ahead single in the seventh — his second RBI hit of the night — scored Brice Turang for the eventual winning margin.',
      'It\'s the second time in two games Milwaukee has needed its bullpen to protect a lead late — Trevor Megill survived a shaky ninth in Game 1 — and the pattern now looks like a real asset rather than a worry: the Brewers have outscored the Rays 8-6 through two games without ever trailing for long, and they take a 2-0 lead on the road to Tropicana Field, needing two wins in three games at Tampa Bay for the franchise\'s first title since 1982.',
    ],
    related:'world-series-game2-recap',
  },
  {id:'world-series-game3-recap', sport:'mlb', cat:'recap',
    headline:'Brewers Rout Rays 10-1 in Game 3, Take Commanding 3-0 World Series Lead',
    dek:'Robert Gasser allowed just one hit over six scoreless innings and an eight-run fifth inning — capped by Jackson Chourio going 4-for-4 — buried Tampa Bay at Tropicana Field.',
    byline:'Clutch Room MLB Desk', mins:6, time:'Oct 26, 2026',
    qa:[['What was the final score?','Brewers 10, Rays 1, at Tropicana Field in Game 3 — Milwaukee leads the World Series 3-0.'],
        ['What happened in the fifth inning?','Milwaukee was already up 2-0 when it sent Freddy Peralta out for the fifth; he was charged with 5 earned runs on 7 hits over 4.2 innings without getting an out in the frame, reliever Cam Booser allowed 4 more runs before Cole Sulser finally recorded the third out of an 8-run inning.']],
    body:[
      'Milwaukee didn\'t just beat the Rays in Game 3, it buried them. An 8-run fifth inning turned a tight 2-0 game into a laugher, and the Brewers cruised to a 10-1 win at Tropicana Field that puts them one win from their first World Series title since 1982.',
      'Robert Gasser was the story before the fifth inning ever happened, pitching one-hit ball through six scoreless innings against a Rays lineup that had given Milwaukee all it could handle in the first two games. Tampa Bay starter Freddy Peralta, the ALCS MVP, couldn\'t get through the fifth: he was charged with five earned runs on seven hits over 4.2 innings, and reliever Cam Booser made things worse by allowing four more runs before Cole Sulser finally got the third out of an inning that saw eight runs cross the plate.',
      'Jackson Chourio led the onslaught, going 4-for-4, and the Brewers got contributions up and down the order — every player in Milwaukee\'s lineup except Jake Bauers recorded at least one hit and one RBI. It\'s the kind of complete offensive performance that has defined this World Series run: Milwaukee has now outscored Tampa Bay 18-7 across three games.',
      'The Rays, who trailed 2-0 in this series after dropping two one-run games at American Family Field, now face elimination. Game 4 is back at Tropicana Field today, with Milwaukee needing just one more win to close it out.',
    ],
    pull:'An 8-run fifth inning turned a tight pitchers\' duel into a laugher — Milwaukee is one win from the title.',
    related:'world-series-game3-breakdown',
  },
  {id:'world-series-game3-breakdown', sport:'mlb', cat:'analysis',
    headline:'How a Five-Batter Stretch in the Fifth Buried Tampa Bay in Game 3',
    dek:'Robert Gasser\'s one-hit night gets the attention, but the number that matters most is 18-7 — Milwaukee\'s cumulative scoring margin through three games of a series that now looks nothing like the one-run affairs of Games 1 and 2.',
    byline:'Clutch Room MLB Desk', mins:7, time:'Oct 26, 2026',
    qa:[['Why did the Rays pull Freddy Peralta mid-inning?','He had already allowed 5 earned runs on 7 hits without recording an out in the fifth, and Tampa Bay turned to reliever Cam Booser to try to stop the bleeding — Booser allowed four more runs before Cole Sulser finally ended the inning.'],
        ['How does this series compare to Games 1 and 2?','Both of the first two games were decided by a single run late. Game 3 was the opposite: Milwaukee led 2-0 into the fifth and then blew it open, finishing an 18-7 series scoring margin through three games.']],
    body:[
      'Games 1 and 2 of this World Series were tense, one-run, bullpen-decided affairs — the kind of series that looked like it could go either way. Game 3 was nothing like that. Milwaukee led 2-0 going to the fifth inning, a manageable margin for a Rays team that had already shown it could claw back from four runs down. Then the inning that decided the World Series happened: eight runs, one out recorded by Freddy Peralta, four more allowed by reliever Cam Booser, and a laugher that ended 10-1.',
      'The pitching matchup flipped from what anyone would have expected. Peralta, the ALCS MVP, was charged with five earned runs on seven hits over 4.2 innings — he didn\'t survive the fifth. Robert Gasser, on the other side, was the one who looked like a Cy Young contender: six scoreless innings, one hit allowed. For a Brewers pitching staff that has now thrown three straight strong-to-dominant starts in the World Series, it\'s the clearest sign yet that Milwaukee built this roster for exactly this kind of series.',
      'Jackson Chourio\'s 4-for-4 night was the headline offensive performance, but the real story was depth: every Brewer in the lineup except Jake Bauers recorded a hit and an RBI. That\'s not one player carrying a game, it\'s a lineup that made Tampa Bay pay for every mistake once Peralta\'s outing unraveled.',
      'Zoom out and the series numbers tell the story cleanly. Milwaukee has outscored Tampa Bay 18-7 through three games — 3-2, 5-4 and now 10-1 — a cumulative margin that looks nothing like the game-by-game scores suggested entering Game 3. The Rays, who have already shown they can win close games, now need something they haven\'t had to find yet in this series: a response to a blowout, on the road, facing elimination in Game 4 at Tropicana Field.',
    ],
    related:'world-series-game3-recap',
  },
  {id:'mlb-injury-watch', sport:'mlb', cat:'debate',
    headline:'First Take: Is This World Series Already Over?',
    dek:'Milwaukee has outscored Tampa Bay 18-7 and never trailed in the ninth inning of any game. Two Clutch Room writers argue whether the Rays have anything left, facing elimination in Game 4.',
    byline:'Clutch Room Debate Desk', mins:5, time:'Oct 27, 2026',
    takes:[
      {side:'for', who:'Take: No team comes back from 0-3 — history says it\'s done', text:'No team has ever rallied from down 0-3 to win a World Series. Add in that Milwaukee just dropped a 10-1 blowout on a Rays team that had been competitive in Games 1 and 2, and the pattern looks like a club pulling away, not one vulnerable to a letdown. Tampa Bay needs to win four straight against a team playing its best baseball of the postseason — that\'s not a live scenario, it\'s a formality waiting to happen.'},
      {side:'against', who:'Take: Elimination games have a way of changing a series', text:'Tampa Bay has a healthy rotation left and nothing to lose — teams playing with their season on the line have found another gear before. Milwaukee has to win just once more, which means every mistake now carries more weight for the favorite too. Win Game 4 at home and the series heads back to Milwaukee with the Rays suddenly having tasted a response; that\'s a very different story than the one being written right now.'},
    ],
    body:['Facing elimination for the first time all series, Tampa Bay heads into Game 4 at Tropicana Field needing to win four straight just to become the first team in World Series history to come back from 0-3 — while Milwaukee needs one win, anywhere, to close out its first title since 1982.'],
  },

  {id:'tennis-debate', sport:'tennis', cat:'debate',

  {id:'shanghai-final-recap', sport:'tennis', cat:'recap',
    headline:'Davidovich Fokina Wins Shanghai for His First Masters 1000 Title',
    dek:'Alejandro Davidovich Fokina beat Rafael Jodar 1-6, 7-6(5), 6-4 in a two-hour, 28-minute final — a run that also knocked out Hubert Hurkacz and top seed Alexander Zverev along the way.',
    byline:'Clutch Room Tennis Desk', mins:6, time:'Oct 18, 2026',
    qa:[['What was the final score?','Alejandro Davidovich Fokina beat Rafael Jodar 1-6, 7-6(5), 6-4 in two hours and 28 minutes.'],
        ['Who else did Davidovich Fokina beat en route to the title?','He saved a match point against Frances Tiafoe in the third round, then rallied from a set down to beat both Hubert Hurkacz and top seed Alexander Zverev.']],
    body:[
      'Not the champion anyone in Shanghai\'s draw projected a week ago: Alejandro Davidovich Fokina beat Rafael Jodar 1-6, 7-6(5), 6-4 in the final, claiming his third ATP Tour title overall and, for the first time in his career, a Masters 1000 trophy.',
      'The path there was the story as much as the final itself. Davidovich Fokina saved a match point against Frances Tiafoe just to survive the third round, then rallied from a set down to beat Hubert Hurkacz and — in the quarterfinals — top seed Alexander Zverev, the man this draw had been projected to run through on the way to a potential Djokovic final that never materialized.',
      'Jodar, the next-gen star who reached his own first Masters 1000 final, took the opening set 6-1 and looked for a stretch like he\'d close this out in straight sets. Davidovich Fokina turned it in the second-set tiebreak and leaned on the deeper petrol tank over two and a half hours, closing it out 6-4 in the third.',
      'It settles, in the most direct way possible, the question this week\'s draw raised before a ball was struck: this wasn\'t a fifth title for an established champion repeating in familiar territory — it\'s a new name on the trophy, won the hard way, through three separate comeback wins against three different kinds of opponents.',
    ],
    pull:'He saved a match point just to reach the third round. By the final, he\'d beaten the No. 1 seed and a fellow first-time finalist to win his first Masters 1000.',
  },
  {id:'lyon-ningbo-osaka-finals-recap', sport:'tennis', cat:'recap',
    headline:'Musetti Ends a Four-Year Title Drought in Lyon as Rybakina, Siniakova and Griekspoor Also Win Tour Finals',
    dek:'Lorenzo Musetti beat Taylor Fritz 6-3, 6-4 to win the ATP Lyon Open, his first title since 2022, Elena Rybakina defended her Ningbo crown and Katerina Siniakova won in Osaka, while Tallon Griekspoor rallied past Jan-Lennard Struff to win Brussels.',
    byline:'Clutch Room Tennis Desk', mins:5, time:'Oct 25, 2026',
    qa:[['What happened in Lyon?','Lorenzo Musetti beat Taylor Fritz 6-3, 6-4 in 80 minutes to win the ATP Lyon Open — his first tour-level title since 2022 and third of his career.'],
        ['What happened on the WTA side?','Elena Rybakina beat Leylah Fernandez 6-2, 6-2 to defend her Ningbo Open title, and Katerina Siniakova beat Ashlyn Krueger 6-1, 6-0 to win the Kinoshita Group Japan Open in Osaka.'],
        ['Who won in Brussels?','Tallon Griekspoor beat Jan-Lennard Struff 4-6, 6-3, 6-4 to win the BNP Paribas Fortis European Open, his fourth career ATP Tour title and first since Mallorca last June.']],
    body:[
      'Lorenzo Musetti closed out a four-year wait for a title on Sunday, beating Taylor Fritz 6-3, 6-4 in straight sets to win the ATP Lyon Open. It\'s Musetti\'s third career tour-level title and his first since 2022, ending a run of final losses that had stretched his drought out well beyond what his ranking and results suggested it should have.',
      'In Ningbo, Elena Rybakina needed just 6-2, 6-2 to see off Leylah Fernandez and defend the title she won there a year ago — her first trophy since climbing to world No. 1, and a reminder that the ranking hasn\'t dulled her ball-striking at this level.',
      'The week\'s most lopsided final belonged to Katerina Siniakova, who routed Ashlyn Krueger 6-1, 6-0 in just 68 minutes to win the Kinoshita Group Japan Open in Osaka. It\'s Siniakova\'s sixth career singles title and the first by a Czech player at the Osaka event, ten years after she lost in that same final.',
      'In Brussels, Tallon Griekspoor completed the week\'s most dramatic run, rallying from a set down for the third consecutive match to beat Jan-Lennard Struff 4-6, 6-3, 6-4 and win the BNP Paribas Fortis European Open. The 30-year-old, ranked No. 60, had already upset second seed Jiří Lehečka in the quarter-finals and third seed Francisco Cerundolo in the semis before closing out Struff in two hours and two minutes, winning 84% of points on his first serve and striking 19 aces. It\'s his fourth ATP Tour title and first since Mallorca last June. "Another big fight, very, very challenging match again," Griekspoor said afterward. "I don\'t know how it went my way — I just tried to stay in there." Struff, 36, had beaten sixth seed Zizou Bergs and top seed Arthur Fils en route to the final.',
    ],
  },

  {id:'ucl-recap', sport:'football', league:'Champions League', cat:'recap',
    headline:'Tresoldi\'s Hat-Trick Sinks Inter as Barcelona and Arsenal Win Big on Matchday 2',
    dek:'Nicolò Tresoldi\'s treble fired Club Brugge to a 4-3 San Siro thriller, Lamine Yamal set up both Barcelona goals in a comeback win, and Sabah won a Champions League match for the first time in their history.',
    byline:'Clutch Room Football Desk', mins:5, time:'Oct 14, 2026',
    qa:[['What were Tuesday\'s results?','Barcelona 4-1 Galatasaray, Arsenal 3-0 Lille, Sporting CP 2-0 Lens, Viking 3-3 Bayern Munich, Inter 3-4 Club Brugge, Atlético Madrid 2-0 Manchester United, Sabah 2-0 Slavia Praha, Villarreal 3-1 Napoli, Leipzig 1-0 PSV.'],
        ['What about Wednesday\'s games?','Manchester City vs. PSG, Roma vs. Real Madrid and the rest of Wednesday\'s slate are still to be played.']],
    body:[
      'Nicolò Tresoldi scored a hat-trick as Club Brugge beat Inter 4-3 in a genuine San Siro thriller, the night\'s best individual performance on a matchday that had no shortage of them. Barcelona came from behind to beat Galatasaray 4-1 behind two Lamine Yamal assists, and Arsenal cruised past Lille 3-0 with Jurriën Timber named Player of the Match.',
      'Elsewhere, Sporting CP\'s Luis Suárez became the club\'s outright all-time leading scorer in the competition during a 2-0 win at Lens, Harry Kane extended his Champions League scoring streak to nine straight games (a penalty and a header) but still only salvaged a 3-3 draw for Bayern Munich at Viking, and Sabah beat Slavia Praha 2-0 for the first Champions League win in the club\'s history.',
      'Atlético Madrid beat Manchester United 2-0, Villarreal beat Napoli 3-1, and Leipzig edged PSV 1-0 in a tighter, quieter corner of the matchday. Wednesday still has the two heaviest remaining fixtures to come — Manchester City host PSG, and Roma face Real Madrid.',
    ],
    related:'ucl-breakout-performances',
  },
  {id:'ucl-breakout-performances', sport:'football', league:'Champions League', cat:'analysis',
    headline:'The Breakout Night: Tresoldi, Mickels and the Players Who Made Matchday 2',
    dek:'A hat-trick from a forward most casual fans had never heard of, a historic first win for the competition\'s smallest club, and a teenager setting up goals for fun — the real story of Matchday 2 was written by players outside the usual headlines.',
    byline:'Clutch Room Football Desk', mins:7, time:'Oct 14, 2026',
    qa:[['Who was the standout performer of the matchday?','Nicolò Tresoldi, who scored a hat-trick for Club Brugge in a 4-3 win away at Inter Milan — arguably the single best individual performance of Matchday 2.'],
        ['What made Sabah\'s result historic?','Their 2-0 win over Slavia Praha, sealed by Joy-Lance Mickels, was the first Champions League win in the Azerbaijani club\'s history.']],
    body:[
      'Every Champions League matchday has its headline result, but Matchday 2\'s most interesting story wasn\'t at the top of the table — it was the players making their names inside games that weren\'t supposed to be about them. Nicolò Tresoldi\'s hat-trick for Club Brugge, away at a full San Siro against Inter, is the kind of performance that changes how a player gets talked about overnight. Brugge won 4-3 in a genuine shootout of a match, and Tresoldi was directly responsible for more of it than anyone else on the pitch.',
      'Lamine Yamal didn\'t need to score to be the best player on the field in Barcelona\'s 4-1 comeback win over Galatasaray — he set up both Fermín López\'s header and Anthony Gordon\'s goal, continuing to look like a teenager operating on a completely different timeline than his actual age. He was a deserved Player of the Match, and at this point in his career, that\'s becoming the expectation rather than the story.',
      'The quieter breakout belongs to Sabah. Beating Slavia Praha 2-0, sealed by a goal from Joy-Lance Mickels, doesn\'t sound like a historic result on paper — until you know it\'s the first Champions League win in the Azerbaijani club\'s history. For a team whose entire competitive existence in Europe\'s top competition had been winless, that\'s a result worth more to the club than three points usually are.',
      'A few players extended rather than started their stories: Luis Suárez became Sporting CP\'s all-time leading scorer in the competition, a record built over time rather than in one night, while Harry Kane\'s penalty and header stretched his Champions League scoring run to nine consecutive games — a streak that now says as much about his consistency as any single performance could. Jurriën Timber\'s Player of the Match award in Arsenal\'s comfortable 3-0 win over Lille was the night\'s most conventional kind of good, the sort of performance that holds a clean sheet together without ever needing a moment of individual brilliance to be noticed.',
      'Put together, Matchday 2 is a reminder of what the Champions League\'s league phase was actually built to surface: not just the usual superclub storylines, but a 20-year-old forward most casual fans had never heard of a day ago, and a club from Azerbaijan writing its first real sentence in the competition\'s history.',
    ],
    related:'ucl-recap',
  },
  {id:'ucl-md2-wednesday-recap', sport:'football', league:'Champions League', cat:'recap',
    headline:'PSG Stun Manchester City 4-2, Real Madrid Score Three Late to Win in Rome',
    dek:'Wednesday closed out Matchday 2 with City\'s first home defeat of the campaign and a Real Madrid comeback that turned a 3-1 deficit into a 4-3 win in the final eight minutes.',
    byline:'Clutch Room Football Desk', mins:6, time:'Oct 15, 2026',
    qa:[['What happened at the Etihad?','Paris Saint-Germain won 4-2 away at Manchester City, City\'s first home defeat of the season.'],
        ['How did Real Madrid beat Roma?','Madrid trailed for most of the match before scoring three times in the final eight minutes to win 4-3 in Rome.']],
    body:[
      'Manchester City\'s unbeaten home record this season didn\'t survive Matchday 2. Paris Saint-Germain went to the Etihad and won 4-2, the kind of result that reshapes how the rest of City\'s league phase gets talked about and confirms PSG remain the team to beat even with last season\'s continental success behind them.',
      'In Rome, Real Madrid needed a finish to match the occasion. Trailing Roma for most of the night, Carlo Ancelotti\'s side scored three times in the final eight minutes to turn what looked like a damaging away defeat into a 4-3 win — the kind of late collapse-and-recovery that will be remembered as one of the signature results of this Champions League season regardless of how the rest of it goes.',
      'Elsewhere on a genuinely stacked Wednesday slate: Liverpool won 6-3 away at LASK, Feyenoord beat Como 3-2, Aston Villa routed Fenerbahçe 6-0, Shakhtar Donetsk beat AEK Athens 3-1, Real Betis beat Porto 3-2, Stuttgart won 3-0 at Slovan Bratislava, and Bodø/Glimt beat Borussia Dortmund 1-0 in one of the night\'s bigger surprises.',
      'With Matchday 2 now complete across both nights, City\'s home defeat and Madrid\'s late drama were the two results that will dominate the conversation heading into Matchday 3 on Tuesday — a stacked single day that includes Fenerbahçe-Slavia Praha, Roma-Slovan Bratislava, Liverpool-Villarreal, Manchester City-AEK Athens, and the standout fixture of the round, PSG hosting Barcelona. Wednesday follows with Bayern-Arsenal and Real Madrid-RB Leipzig among the headline games.',
    ],
    pull:'City\'s first home defeat of the season and a Real Madrid team that scored three goals in eight minutes to steal a result in Rome.',
  },

  {id:'liverpool-city-recap', sport:'football', league:'Premier League', cat:'recap',
    headline:'Ten-Man Liverpool Routed 3-0 at Anfield as Man City Stay Perfect',

    ],

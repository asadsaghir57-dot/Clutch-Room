    related:'pak-sl-series-wrap',
  },
  {id:'pak-sl-series-wrap', sport:'cricket', cat:'analysis',
    headline:'Series Wrap: How Farhan and Imran Won Pakistan the T20I Series',
    dek:'A full statistical look back at the three-match series — Sahibzada Farhan\'s 238 runs at a strike rate north of 160, Mohammad Imran\'s 6 wickets at barely 10 apiece, and the moments that decided a 2-1 result despite Sri Lanka\'s consolation win in the finale.',
    byline:'Clutch Room Cricket Desk', mins:7, time:'Oct 14, 2026',
    qa:[['Who was the standout player of the series?','Sahibzada Farhan, who finished as the leading run-scorer with 238 runs at an average of 79.33 across the three matches, while also captaining the side to the series win.'],
        ['Who was the leading wicket-taker?','Mohammad Imran, Pakistan\'s T20I debutant seamer, took 6 wickets at an average of 10.50 — the standout bowling return of the series on either side.']],
    body:[
      'Pakistan\'s 2-1 series win over Sri Lanka was built almost entirely on two performers: captain Sahibzada Farhan, who finished the three matches with 238 runs at an average of 79.33, and Mohammad Imran, a T20I debutant seamer who took 6 wickets at an average of 10.50 — comfortably the best bowling return of the series from either side. Maaz Sadaqat backed Farhan up with 146 runs at 48.66, giving Pakistan two batters firing at once in every game they won.',
      'The opener set the tone. Sri Lanka posted 182/8 at Rawalpindi behind Lahiru Udara\'s 91 off 55, but Pakistan chased it down with four wickets and seven balls in hand — Farhan\'s 89 off 53 doing the heavy lifting, with Sadaqat\'s 50 off 29 balls (three sixes) turning a tight chase into a comfortable one in the back half. Naseem Shah\'s 3/36 had kept Sri Lanka from really getting away in the first innings, but it was Imran\'s tidy 2/21 that did the real damage when Pakistan needed outs, not just economy.',
      'Game two was the series\' most one-sided: Pakistan posted 215/3, their highest T20I total on home soil, with Sadaqat\'s 96 off 51 and Farhan\'s 73 off 44 doing almost all of the scoring, before Imran\'s 3/11 in four overs made sure 133/7 was Sri Lanka\'s ceiling. By the time the series was already decided, Pakistan had scored at a combined strike rate that made the format look easy — right up until it didn\'t.',
      'Sri Lanka\'s consolation in the dead-rubber finale was built on exactly the kind of individual brilliance that had gone Pakistan\'s way all series, just reversed: Kusal Mendis, under pressure as a captain who\'d lost the first two games, played the single best innings by either team\'s batter in the series — an unbeaten 87 off 48 that chased down 168 with overs to spare. It was too little, too late for the series itself, but it meant Pakistan didn\'t get the clean sweep that looked likely after two games.',
      'Across all three matches, the series came down to a simple read: when Farhan and Sadaqat both scored, Pakistan won comfortably; when Pakistan\'s bowling let a Sri Lankan top-order batter get set — Udara in Game 1, Mendis in Game 3 — the margins tightened or flipped entirely. Imran\'s consistency with the ball was the swing factor keeping that from mattering more often than it did.',
    ],
    related:'pak-sl-3rd-t20i-recap',
  },
  {id:'pak-sl-odi-1st-match-recap', sport:'cricket', cat:'recap',
    headline:'Pakistan Open ODI Tri-Series With a 37-Run Win Over Sri Lanka',
    dek:'Pakistan posted 305 at Rawalpindi and held on as Sri Lanka fell short at 268 — Salman Ali Agha, playing his first international since being dropped as T20I captain, named Player of the Match.',
    byline:'Clutch Room Cricket Desk', mins:5, time:'Oct 18, 2026',
    qa:[['What was the final result?','Pakistan 305, Sri Lanka 268 — Pakistan won by 37 runs.'],
        ['Who was Player of the Match?','Salman Ali Agha — his first international appearance since being dropped from the Test squad and sacked as T20I captain.']],
    body:[
      'Pakistan opened the ODI tri-series with England and Sri Lanka the way they wanted to: a comfortable, if not dominant, 37-run win at Rawalpindi, posting 305 and holding off a Sri Lankan chase that fell short at 268.',
      'The story of the day belonged to Salman Ali Agha. His Player of the Match performance came in his first international outing since a rough stretch that saw him dropped from the Test squad mid-tour and removed as T20I captain — a genuine statement return in a format where Pakistan need him most heading into World Cup preparation.',
      'The tri-series runs through October 31, with Pakistan, England and Sri Lanka all using these matches explicitly as building blocks toward the ODI World Cup rather than treating them as a standalone series — captain Shaheen Shah Afridi has been clear that the format is the focus for the rest of the month.',
    ],
  },
  {id:'pak-eng-2nd-odi-recap', sport:'cricket', cat:'recap',
    headline:'Arafat Minhas Wins It With Bat and Ball as Pakistan Beat England by 87 Runs',
    dek:'A fifty (59) and a maiden five-for that turned into 6/40 earned Arafat Minhas Player of the Match after Hasan Nawaz\'s 79 lifted Pakistan to 302/9 and England were bowled out for 215.',
    byline:'Clutch Room Cricket Desk', mins:9, time:'Oct 20, 2026',
    qa:[['What was the final result?','Pakistan 302/9 (50 overs) beat England 215 all out (38.4 overs) by 87 runs at Rawalpindi.'],
        ['Who was Player of the Match?','Arafat Minhas — 59 (58 balls, 9 fours) with the bat, then 6/40 off 8.4 overs with the ball to rip through England\'s middle and lower order.']],
    body:[
      'Harry Brook wins the toss at Rawalpindi Cricket Stadium and sends Pakistan in under the lights — the same read the touring side took in the series opener against Sri Lanka, only this time it\'s a full-strength England attack doing the asking.',
      'Early breakthrough for England. Fakhar Zaman goes without scoring, caught by Joe Root off Gus Atkinson, and the tourists have the start they wanted — a big wicket inside the powerplay against the team that steamrolled Sri Lanka two days ago.',
      'It doesn\'t get easier for the openers. Sonny Baker digs one in short and tight to the body, Saim Ayub can\'t control the pull, and it spirals high to deep backward square where Curran settles under a droppable chance. Pakistan slip to 31/2 inside the powerplay.',
      'Babar Azam and Saad Baig steady things for a while, dragging the total past fifty, but Will Jacks ends the resistance — a skiddy one from back of a length rattles Babar\'s off stump as he aims a loose clip across the line, camped on the back foot when he should have gone forward. He\'s out for 34, and Pakistan are 59/3.',
      'Adil Rashid strikes almost immediately after coming on. Salman Agha goes for the sweep again, top-edges a flighted, slower delivery, and Atkinson pouches it running back from deep fine leg. Pakistan are 81/4 and the innings is unraveling against a disciplined England attack.',
      'Saad Baig and Hasan Nawaz steady the ship. The pair grind through the middle overs, taking Pakistan past 100 and then onward past 130 with a composed fifty-run stand for the fifth wicket.',
      'Then Brook turns back to Atkinson, and it pays off immediately. Baig swivels into a pull off a well-aimed bouncer but mistimes it, and Sam Curran dives forward at deep square leg to complete the catch. Baig departs for a patient 35 off 54 balls, and Pakistan are 133/5 in the 28th over.',
      'Hasan Nawaz doesn\'t blink. He brings up his fifty off 46 balls — his first of the series — with a mix of clean boundaries and the odd mistimed six that still clears the rope, and keeps the scoreboard moving even as partners fall around him.',
      'Arafat Minhas joins him at the crease and the pair settle into a new stand, grinding past 200 together before Jamie Overton finally ends Nawaz. An 87mph yorker from round the wicket spears into the base of the stumps as Nawaz steps away to manufacture room — he\'s bowled for 79 off 74 balls (5 fours, 4 sixes), and Pakistan are 211/6 in the 40th over.',
      'Faheem Ashraf strides out and immediately starts swinging, cracking back-to-back boundaries off Jacks and Rashid. Minhas, given a life earlier by a fumbled chance, brings up his own fifty from 54 balls with a gorgeous cover drive off Baker — his first in international cricket.',
      'Then Baker drags his length back and goes straighter. Minhas backs away looking for the leg side again, skies it, and Harry Brook settles under a reverse-cup take at mid-off. Minhas departs for 59 (58b, 9 fours), Pakistan 283/7 in the 48th over — a vital, chance-assisted innings that still dragged the total into the 280s.',
      'Sam Curran finally gets on the board at the fourth attempt, Faheem Ashraf top-edging a slower ball straight into the hands of Jacks at deep midwicket — Ashraf falls for a brisk 39 off 26 (5 fours, 1 six), 285/8.',
      'Baker comes back to clean up, Naseem Shah holing out to Overton at long-on for 1, Pakistan 296/9 with two balls left. Shaheen Shah Afridi, unbeaten on 10, and Haris Rauf then muscle the very last ball of the innings through midwicket to push Pakistan past 300 — innings closes at 302/9 off the full 50 overs. Baker finishes with career-best figures of 3/65; Nawaz\'s 79 and Minhas\'s 59 did the heavy lifting after Pakistan had been 81/4.',
      'England\'s reply starts the way Pakistan would have feared. Tom Banton and Ben Duckett take the long handle from the outset, racing to a 50-run opening stand inside eight overs and keeping the required rate comfortably behind them through the Powerplay — the pair push the stand to 91 before Haris Rauf finally breaks through, Duckett mistiming a pull straight to Fakhar Zaman at deep fine leg for 45.',
      'That\'s the cue for Arafat Minhas to take over the match a second time. Brought on first change, he has Banton caught behind off bat and pad for 57 and has Harry Brook, England\'s captain, bowled for just 5 two overs later — England slide from 120/1 to 128/3 and the required rate starts climbing.',
      'Joe Root tries to anchor the chase, adding 37 with Sam Curran, but Naseem Shah has Root bowled for 33, and when Curran chips Haris Rauf to a substitute fielder for 27, England are 177/5 and running out of partners. Minhas then rips through the tail almost on his own: Jordan Cox lbw for 18, Jamie Overton caught at mid-off, Will Jacks caught behind and Adil Rashid lbw — four wickets in the space of 17 balls that leave England 214/9.',
      'Gus Atkinson is run out backing up to the next ball, and England are bowled out for 215 in 38.4 overs — 87 runs short. Minhas finishes with 6/40, turning a maiden international half-century into a Player of the Match double that Pakistan will take as a serious statement two games into the tri-series, with England\'s reply never getting within shouting distance after his spell.',
    ],
    pull:'Arafat Minhas backed up his maiden fifty with 6/40 — including four wickets in 17 balls — to seal an 87-run win and the Player of the Match award.',
  },
  {id:'eng-sl-3rd-odi-recap', sport:'cricket', cat:'recap',
    headline:'Sri Lanka Stun England, Chase Down Record 430 With a Ball to Spare After Brook\'s Historic 202',
    dek:'Harry Brook\'s 202 off 116 balls — the fastest double century in ODI history — built England to 429/4, the highest ODI total ever scored in Pakistan. Sri Lanka ran it down anyway, Pavan Rathnayake (130), Dasun Shanaka (97) and an unbeaten Janith Liyanage (61*) completing a stunning 2-wicket win with one ball remaining at Rawalpindi.',
    byline:'Clutch Room Cricket Desk', mins:6, time:'Oct 22, 2026',
    qa:[['What was the final result?','England 429/4 (50 overs); Sri Lanka ran it down, finishing 430/8 off 49.5 overs to win by 2 wickets with 1 ball remaining.'],
        ['What record did Brook break?','The fastest double century in ODI history — 114 balls — beating Shubman Gill\'s 117-ball mark, and the highest individual ODI score by an England batter, passing Ben Stokes\'s 182.']],
    body:[
      'Sri Lanka win the toss at Rawalpindi and opt to field again — the same read as the series opener, now chasing a first win of the tri-series after defeats to Pakistan and England.',
      'Tom Banton and Ben Duckett give England exactly the start they want, racing through the powerplay and on to a brisk 74-run opening stand, before Dunith Wellalage removes both in the space of three overs — Banton for a run-a-ball 50, Duckett lbw for 29 — to leave England 85/2.',
      'From there it is one-way traffic. Joe Root and captain Harry Brook rebuild and then accelerate, taking the third-wicket stand to 159 before Root, well set on 69, picks out Wellalage at long-on off Asitha Fernando in the 37th over. England 244/3.',
      'It barely slows England down. Brook brings up a maiden century off 75 balls and keeps going — 150 off 97, then 200 off 114 to break the record for the fastest double century in ODI history, overhauling Shubman Gill\'s 117-ball mark. Will Jacks explodes alongside him, racing to a 25-ball fifty, and the pair add 150 in just 66 balls for the fourth wicket.',
      'Brook finally falls off the very last ball of the innings, slicing a wide full one to backward point — out for 202 off 116 (21 fours, 10 sixes), the highest individual score by an England batter in ODIs, past Ben Stokes\'s 182. England close on a monstrous 429/4, the highest ODI total ever made on Pakistani soil and the most Sri Lanka have ever conceded in an ODI. Jacks finishes unbeaten on 66 off 30.',
      'Sri Lanka\'s chase is rocked early. Josh Tongue pings the top of off to bowl Kamindu Mendis for 18 — Sri Lanka 23/1 — and two balls later Kusal Mendis is run out for a golden duck without troubling the scorers, 24/2 inside the fifth over.',
      'Avishka Fernando and Pavan Rathnayake steady the innings and then some, both racing to fifties and dragging Sri Lanka from the wreckage into a real chase — a 166-run third-wicket stand that drags the required rate back toward reach.',
      'Then Jamie Overton strikes. Fernando looks to turn one away onside, only to pop a leading edge straight back at the bowler — Overton gobbles up the catch off his own bowling, and Fernando departs for 97 (83b, 11 fours, 2 sixes), three agonising runs short of a century. Sri Lanka 190/3.',
      'Rathnayake and Shanaka turn the rebuild into a flat-out assault, adding 133 for the fourth wicket at better than ten an over — Shanaka tearing into the part-timers, clearing the rope eight times in a 50-ball stay. Rathnayake reaches his maiden ODI century along the way before Sam Curran ends it, Banton completing the catch running in from long-on — Rathnayake out for 130 off 106 (15 fours, 3 sixes), Sri Lanka 323/4 in the 41st over.',
      'Shanaka keeps swinging alongside Janith Liyanage until Liam Dawson has him caught by Banton at long-on, one short of a hundred of his own — out for 97 off 50 (6 fours, 8 sixes), Sri Lanka 363/5 in the 44th over, still needing 67 from 37 balls.',
      'Liyanage picks up right where Shanaka left off. Sahan Arachchige falls for a brisk 13, caught by Jacks off Sam Curran at 406/6, but Liyanage keeps finding the rope, racing to his own fifty off just 21 balls as the overs run down.',
      'Josh Tongue, expensive for most of the innings, nearly drags England back into it at the death — flattening Dunith Wellalage\'s stumps in the 49th over and then yorking Eshan Malinga first ball, two wickets in as many deliveries to leave Sri Lanka 423/8. But Liyanage, unbeaten, and Asitha Fernando see out the rest of the over and get the runs still required, Sri Lanka completing an extraordinary chase at 430/8 with a ball to spare — built on Rathnayake\'s 130, Shanaka\'s 97 and Liyanage\'s unbeaten 61 off 27.',
      'It\'s a brutal footnote to Brook\'s batting masterclass — his record-breaking double century now attached to a losing team total. The result lifts Sri Lanka to 2 points from two games, with Pakistan still unbeaten on top with 4; England, now beaten by both Pakistan and Sri Lanka, drop to 0 points from two and must win at Gaddafi Stadium in Lahore on Sunday to keep any realistic hope of reaching the October 31 final.',
    ],
    pull:'Harry Brook\'s record 202 off 116 balls built England to 429/4, the biggest ODI total ever scored in Pakistan — and Sri Lanka ran it down anyway, with a ball to spare.',
    related:'eng-sl-3rd-odi-analysis',
  },
  {id:'eng-sl-3rd-odi-analysis', sport:'cricket', cat:'analysis',
    headline:'Inside the Numbers: How Sri Lanka Chased Down England\'s Record 429/4',
    dek:'A statistical breakdown of a near-860-run ODI in Rawalpindi — Harry Brook\'s record double century, the part-time bowling that let England get there, and the batting arithmetic that let Sri Lanka chase it down anyway.',
    byline:'Clutch Room Cricket Desk', mins:7, time:'Oct 22, 2026',
    qa:[['How does Brook\'s 202 compare historically?','It\'s the fastest double century in ODI history at 114 balls, beating Shubman Gill\'s 117-ball record, and the highest individual score by an England batter in ODIs, passing Ben Stokes\'s 182 from 2019.'],
        ['What actually let Sri Lanka chase down 430?','Three different batters passed fifty in the second innings alone — Avishka Fernando (97), Pavan Rathnayake (130) and Dasun Shanaka (97) — while Janith Liyanage\'s unbeaten 61 off 27 balls (strike rate 225.92) got Sri Lanka home after Josh Tongue took two wickets in two balls at 423/8.']],
    body:[
      'England\'s 429/4 was built as much on Sri Lanka\'s bowling gaps as on Brook\'s brilliance. Asitha Fernando (10-1-68-1) and Dunith Wellalage (10-0-56-2) were the only frontline options to keep an economy under seven; the rest of the attack — Dilshan Madushanka (10-0-89-0), Eshan Malinga (10-0-91-0), Dasun Shanaka (6-0-74-0, econ 12.33) and part-timers Kamindu Mendis and Janith Liyanage (4 overs between them for 49 runs) — went at nearly nine an over combined. Sri Lanka\'s lack of a fifth frontline bowler is exactly what Brook exploited once he got going.',
      'The partnerships tell the story of England\'s acceleration: 159 between Joe Root (69) and Brook for the third wicket took England from 85/2 to 244/3, then Brook and Will Jacks (66* off 30) added 185 in just 66 balls for the fourth wicket — the innings\' final act, with Brook alone scoring 150 of those 185 runs.',
      'Sri Lanka\'s reply started in freefall — 24/2 inside five overs after Kamindu Mendis (18) and Kusal Mendis (run out for a golden duck) both went cheaply to Josh Tongue and a mix-up in the middle. From there, three separate stands did the rebuilding: Avishka Fernando and Rathnayake put on 166 for the third wicket, Rathnayake and Shanaka added 133 for the fourth, and Liyanage then found support from three different partners — Arachchige, Wellalage and Malinga — as the lower order came and went around him in the final ten overs.',
      'England\'s bowling cost mirrors Sri Lanka\'s: every one of their six bowlers went for at least 7.10 an over, with Sam Curran\'s 9-0-103-2 the most expensive figures on either side. Josh Tongue\'s 8.5-1-79-3 was the difference-maker regardless of the economy rate — removing Kamindu Mendis early and then both Wellalage and Malinga in successive balls at 423/8, the closest England came to completing the biggest defensive total defense in tri-series history.',
      'The tri-series table now reads Pakistan 4 points from two wins, Sri Lanka 2 points from a 1-1 record, and England 0 from two defeats. With Pakistan already through to the October 31 final on current form, Sunday\'s 4th Match between Pakistan and England at Gaddafi Stadium in Lahore is effectively knockout cricket for England\'s hopes of reaching it.',

      'The standings now read Pakistan with three wins from three — 1st Match (beat Sri Lanka by 37), 2nd Match (beat England by 87) and now the 4th Match (beat England by 1 wicket) — a record that has already clinched their spot in the October 31 final at Gaddafi Stadium, regardless of the Pakistan vs Sri Lanka (Oct 27) and Sri Lanka vs England (Oct 29) fixtures still to come.',
      'For England, already beaten twice by Pakistan and once by Sri Lanka\'s record 430-run chase, the tri-series has become a search for pride rather than a path to the final — their faint hope now rests on beating Sri Lanka on the 29th and hoping net run rate falls their way, a long shot after conceding 241 and losing from a position their own top order created.',

  {id:'pak-sl-5th-odi-recap', sport:'cricket', cat:'recap',
    headline:'Madushanka\'s Career-Best 5/34 Sinks Pakistan as Sri Lanka Win by 8 Wickets, Book Final Spot',
    dek:'Dilshan Madushanka ripped through Pakistan\'s middle and lower order to bowl them out for 110, and Sri Lanka chased it down in 18.1 overs — a result that sends both sides to the October 31 final and eliminates England.',
    byline:'Clutch Room Cricket Desk', mins:5, time:'Oct 27, 2026',
    qa:[['What was the result?','Sri Lanka won by 8 wickets, chasing down 111 in 18.1 overs after bowling Pakistan out for 110 in 25.3 overs at Gaddafi Stadium, Lahore.'],
        ['What does the result mean for the tri-series?','Sri Lanka join already-qualified Pakistan in the October 31 final at Gaddafi Stadium. England are mathematically eliminated, making their 6th-match meeting with Sri Lanka on Thursday a dead rubber.']],
    body:[
      'Sri Lanka won the toss at Gaddafi Stadium and chose to field, the same read that has worked all series on a ground that has produced some huge totals — only this time it was Pakistan, not the bowling side, who had no answer.',
      'Dilshan Madushanka set the tone early, having Fakhar Zaman fend a short ball straight to point for 5, and kept coming back for more. Asitha Fernando snuck a yorker past Maaz Sadaqat\'s bat for an lbw, and Eshan Malinga removed Babar Azam — who top-scored with 29 off 33 — lbw to a ball that nipped back in. From there the collapse was total: Saad Baig drove straight to short cover, Salman Agha feathered behind to the keeper, and Shadab Khan — reprieved by review earlier in the series — gloved a sweep to Kusal Mendis with no reviews left to check it, leaving Pakistan 64/6 inside 15 overs.',
      'Arafat Minhas and Hasan Nawaz put together the innings\' highest stand, 27 for the seventh wicket, before Madushanka returned to end it — a sharp bouncer had Minhas top-edging to Kamindu Mendis at slip, and from 91/7 Pakistan lost their last three wickets for 19 more runs. Madushanka finished with 5/34, a career-best and just his second ODI five-for, the first having come against India at the 2023 World Cup. Pakistan were all out for 110 in 25.3 overs — their second-lowest ODI total at home, and their lowest-ever at home against Sri Lanka.',
      'Chasing 111, Sri Lanka lost both openers cheaply but never looked troubled. Avishka Fernando pulled Shaheen Shah Afridi straight to midwicket for 16, and Kusal Mendis was bowled off a bizarre deflection — his own bat ricocheting the ball onto the stumps after he\'d already defended it — for 8. Kamindu Mendis anchored the chase throughout, surviving an early dropped catch behind the stumps, and finished unbeaten on 62 off 60 balls as Pavan Rathnayake\'s unbeaten 23 sealed an 8-wicket win in just 18.1 overs.',
      'The win snaps a five-match losing streak for Sri Lanka against Pakistan and, combined with Pakistan\'s already-clinched spot, sends both sides through to Saturday\'s final at Gaddafi Stadium — a rematch of this exact fixture. England, already eliminated after three straight tri-series defeats, now play a dead-rubber 6th match against Sri Lanka on Thursday.',
    ],
    pull:'Dilshan Madushanka\'s 5/34 bowled Pakistan out for 110, their lowest-ever home total against Sri Lanka — who chased it down in 18.1 overs to book a final spot alongside Pakistan.',

  },
  {id:'pak-sl-5th-odi-analysis', sport:'cricket', cat:'analysis',
    headline:'Inside the Numbers: How Madushanka\'s 5/34 Set Up the Tri-Series Final',
    dek:'A statistical look at Pakistan\'s collapse to 110 all out, the soft dismissals that defined it, and what a rematch final at Gaddafi Stadium means after six group matches.',
    byline:'Clutch Room Cricket Desk', mins:7, time:'Oct 27, 2026',
    qa:[['How significant was Madushanka\'s 5/34?','It\'s a career-best in ODIs and just his second five-wicket haul in the format — the first coming against India at the 2023 World Cup, a tournament where he was among the leading wicket-takers before injuries slowed his progress.'],
        ['Why does this result matter beyond the match itself?','It completes the tri-series final field. Pakistan had already clinched a spot with three wins from three; Sri Lanka\'s win here gives them the second spot, eliminating England and setting up a Pakistan-Sri Lanka final on October 31 — a repeat of this exact fixture.']],
    body:[
      'Pakistan\'s 110 all out was built almost entirely on soft dismissals rather than unplayable deliveries. Of the ten wickets to fall, six came from batters either driving or sweeping straight to a fielder (Maaz Sadaqat, Saad Baig, Salman Agha, Shadab Khan) or losing their shape against the short ball (Fakhar Zaman, Shaheen Shah Afridi) — only Babar Azam\'s lbw and Arafat Minhas\'s top-edged bouncer carried genuine bowler-made wicket-taking deliveries behind them, and both of those were still Madushanka\'s work.',
      'Madushanka\'s 8.3-1-34-5 was built on sustained extra bounce at pace in the mid-130s kph on an otherwise placid pitch — a mismatch that claimed Fakhar Zaman early, Arafat Minhas via a well-set bouncer, Haris Rauf via a diving slip catch, and Shaheen Shah Afridi\'s top-edged hook to finish the innings. Sahan Arachchige\'s 5-0-24-2, after a quiet series to that point, provided the other key breakthroughs either side of the Minhas-Nawaz stand.',
      'Pakistan\'s top order again failed to fire outside of Babar Azam\'s 29 off 33 — the only other batters to reach double figures were Hasan Nawaz (17) and Arafat Minhas (10), with the 27-run seventh-wicket stand between those two the highest of the innings. It is the second time this series Pakistan have been bowled out cheaply chasing or defending a modest total, after Game 1\'s tighter finish against the same opponent.',
      'Sri Lanka\'s chase was similarly one-sided despite two early wickets. Kamindu Mendis\'s unbeaten 62 off 60 balls came with the benefit of a dropped chance behind the stumps from Saad Baig, and a boundary-catch overturned when the fielder was found to have trodden the rope — fortune that compounded a Pakistan bowling attack already short on penetration on a flat surface. Avishka Fernando (16) and Kusal Mendis (8) both fell to deliveries that were, by Pakistan\'s own admission in the chase, against the general run of play.',
      'The result leaves the tri-series table set: Pakistan top with three wins from three, Sri Lanka second on two wins from three (losing only the series opener to Pakistan), and England bottom with three defeats from three and nothing left to play for in Thursday\'s 6th match against Sri Lanka. Saturday\'s October 31 final at Gaddafi Stadium is a straight rematch of Tuesday\'s result — Pakistan will target the response, Sri Lanka the repeat.',
    ],
    related:'pak-sl-5th-odi-recap',
  },

  {id:'clasico-recap', sport:'football', league:'La Liga', cat:'recap',
    headline:'Mbappé\'s Late Double Sinks Barcelona as Real Madrid Win El Clásico 2-1',
    dek:'Kylian Mbappé\'s 87th-minute winner — his 100th goal for the club — answered a Raphinha equalizer and handed Barcelona their first domestic defeat of the season, cutting Real Madrid\'s La Liga deficit to three points.',
    byline:'Clutch Room Football Desk', mins:6, time:'Oct 25, 2026',
    qa:[['What was the final score?','Real Madrid won 2-1 at Camp Nou — Kylian Mbappé scored both Madrid goals (41\', 87\'), with Raphinha\'s 61st-minute strike the only reply for Barcelona.'],
        ['What does the result mean for the title race?','It\'s Barcelona\'s first domestic defeat of the season and pulls Real Madrid to within three points of the La Liga lead, with Atlético Madrid also still in the mix.']],
    body:[
      'Kylian Mbappé opened the scoring in the 41st minute in slightly fortuitous fashion — Gerard Martín\'s attempted clearance for Barcelona cannoned straight off the Frenchman and beat Joan García from close range. Raphinha leveled for the hosts in the 61st, his low shot squeezing through Jude Bellingham\'s legs and beating Andriy Lunin, who got a hand to it but couldn\'t keep it out.',
      'With the game heading for a draw, Mbappé struck again in the 87th minute: Eduardo Camavinga laid the ball off to him inside the box, and Mbappé tucked it into an empty net for his second of the night — and the 100th goal of his Real Madrid career. "The star of the game was the team, the group," Mbappé said afterward. "We had difficult moments in the game, and moments where we dominated. Winning and being in the title race is important. We have to keep going. It\'s a great game but it\'s only three points."',
      'The win is Barcelona\'s first domestic defeat of the season and cuts their La Liga lead over José Mourinho\'s Real Madrid to three points, setting up a tighter finish to the title race than either side would have wanted heading into the international break.',
    ],
    related:'clasico-mbappe-century-analysis',
    pull:'Mbappé\'s night: a fortuitous 41st-minute opener, then a 100th-goal finish for Real Madrid in the 87th that beat Barcelona and the clock.',
  },
  {id:'clasico-mbappe-century-analysis', sport:'football', league:'La Liga', cat:'analysis',
    headline:'Mbappé\'s 100th Goal for Real Madrid Arrives at the Perfect Moment — El Clásico',
    dek:'The Frenchman\'s Clásico winner made him the fourth-fastest player to reach a century of goals for Real Madrid, a milestone that landed the night before the Ballon d\'Or ceremony and with the club still trophyless since he arrived.',
    byline:'Clutch Room Football Desk', mins:7, time:'Oct 25, 2026',
    qa:[['How significant is Mbappé\'s 100-goal milestone?','He\'s the 24th player to reach 100 goals for Real Madrid and the fourth-fastest to do it, behind only Cristiano Ronaldo, Raúl and Alfredo Di Stéfano.'],
        ['Has Mbappé won anything with Real Madrid yet?','Not a major trophy — despite being La Liga\'s top scorer in both of his full seasons at the club, he lost the title to Barcelona in both 2024-25 and 2025-26.']],
    body:[
      'Kylian Mbappé\'s 87th-minute winner at Camp Nou was his 100th goal for Real Madrid, reached across a run that started with a free transfer from Paris Saint-Germain in June 2024, where he\'d scored 256 goals in 308 appearances, after 27 in 60 for Monaco before that. He arrived at the Bernabéu already France\'s record scorer and, since this past summer, the all-time leading scorer in World Cup history.',
      'The century makes him the 24th player to reach three figures for Real Madrid and the fourth-fastest to do it — behind only Cristiano Ronaldo, whose 450 goals in 438 matches remain the club\'s all-time record, Raúl and Alfredo Di Stéfano. Reaching that mark in a Clásico, with the winning goal itself, is the kind of moment Real Madrid\'s history is built on repeating.',
      'What the milestone hasn\'t brought yet is team silverware. Mbappé has been La Liga\'s top scorer in both of his full seasons in Madrid, and in both of them Real Madrid finished runners-up to Barcelona. That history is exactly why his own words after Sunday\'s win leaned away from the individual achievement: "Everyone knows I like to score goals, to help the team. But today, the most important thing was the team\'s win," he said. "If we want to do things this year, we have to be a group."',
      'The timing adds another layer — the goal and the win arrive the day before the 2026 Ballon d\'Or ceremony, where Mbappé is among the contenders. But for Real Madrid, the more immediate number is the three points now separating them from a Barcelona side that had been unbeaten domestically all season, with Atlético Madrid also still in touch at the top — a three-way La Liga fight that a trophyless Mbappé, for all his individual numbers, still needs his team to win.',
    ],
    related:'clasico-recap',
  },
  {id:'harry-kane-ballon-dor', sport:'football', league:'Champions League', cat:'analysis',
    headline:'Harry Kane Wins the 2026 Ballon d\'Or, First Englishman to Win It in 25 Years',
    dek:'The Bayern Munich striker beat out Lamine Yamal, Kylian Mbappé and Lionel Messi for the award, capping a 73-goal season that delivered the Bundesliga, the DFB-Pokal and a World Cup semifinal with England — England\'s first winner since Michael Owen in 2001.',
    byline:'Clutch Room Football Desk', mins:7, time:'Oct 26, 2026',
    qa:[['Who did Harry Kane beat to win the award?','Lamine Yamal, Kylian Mbappé and Lionel Messi were the other leading contenders — Yamal had won the World Cup and La Liga, Mbappé was the World Cup\'s all-time top scorer, and Messi was still producing at the highest level, but Kane\'s season carried the field.'],
        ['When was the last time an Englishman won the Ballon d\'Or?','Michael Owen in 2001 — 25 years before Kane\'s win.']],
    body:[
      'Harry Kane was crowned the 2026 Men\'s Ballon d\'Or winner at a ceremony in London, becoming the first Englishman to win football\'s most prestigious individual award since Michael Owen in 2001. The 33-year-old beat out a field that included Lamine Yamal, Kylian Mbappé and Lionel Messi.',
      'The numbers behind the win are extraordinary even by Kane\'s standards: 73 goals in 65 appearances across the 2025-26 season for Bayern Munich and England, a haul that helped fire Bayern to the Bundesliga title, the DFB-Pokal and the German Supercup. He becomes the fourth Bayern Munich player to win the Ballon d\'Or, following Gerd Müller, Franz Beckenbauer and Karl-Heinz Rummenigge.',
      'His international season added to the case: Kane scored six goals in seven games at the FIFA World Cup before England were eliminated by Argentina in the semifinals, a run that kept him and England in the conversation deep into the tournament even without the trophy itself. Bayern manager Vincent Kompany\'s staff reportedly "ran out of superlatives" describing his season, according to assistant Thomas Tuchel.',
      'Kane had been open about the nerves beforehand. "I think my wife would prefer to know and my family, it\'s very stressful for everyone," he said ahead of the ceremony. "From my point of view, of course, I\'d love to know to just kind of see and not have to wait throughout the whole night. But it is their decision, I can\'t control that." In the end, the decision went his way — a quarter-century after Owen\'s win, and in a year that also saw Alexia Putellas take the Women\'s Ballon d\'Or.',
    ],
    pull:'73 goals, a Bundesliga title and a World Cup semifinal — enough to make Harry Kane the first Englishman to win the Ballon d\'Or since Michael Owen in 2001.',
  },

  {id:'f1-austin-race-recap', sport:'f1', cat:'recap',
    headline:'Antonelli Wins Austin From Pole, But the Title Fight Rolls On to Mexico City',
    dek:'Kimi Antonelli converted pole into a comfortable United States Grand Prix win, beating Charles Leclerc by 13 seconds, but results behind him from George Russell and Lewis Hamilton mean the championship still isn\'t clinched.',
    byline:'Clutch Room F1 Desk', mins:5, time:'Oct 25, 2026',
    qa:[['What was the race result?','Kimi Antonelli won from pole in 1:35:16.650, 13.078s clear of Charles Leclerc, with Max Verstappen third (+17.485s) and Lewis Hamilton fourth (+18.515s).'],
        ['Why didn\'t Antonelli clinch the title in Austin?','He needed the win plus George Russell finishing ninth or lower to be champion. Russell finished eighth, and Hamilton\'s fourth also kept the title mathematically alive, so the championship heads to Mexico City still open.']],
    body:[
      'Kimi Antonelli got a clean launch from pole and led comfortably into Turn 1, with Charles Leclerc muscling past Max Verstappen at the start to take second. Antonelli was never seriously troubled from there, crossing the line 13.078 seconds clear of Leclerc\'s Ferrari, with Verstappen third (+17.485s) and Lewis Hamilton fourth (+18.515s) in the sister Ferrari. Lando Norris was fifth for McLaren.',
      'It was the win Antonelli needed to have any chance of becoming champion in Austin — but not the whole equation. He also needed title rival and Mercedes teammate George Russell to finish ninth or lower, and Lewis Hamilton fifth or lower. Russell finished eighth (+54.303s) and Hamilton fourth, so both conditions that would have handed Antonelli the title were missed, and the championship stays mathematically open heading into the season\'s final rounds.',
      'The standings now read Antonelli 365, Russell 242, Hamilton 241, Verstappen 236, Leclerc 233 and Norris 211 — a gap big enough that Verstappen, Leclerc and Norris are already mathematically eliminated from the title fight regardless of how they finish from here. Only Russell and Hamilton remain alive, both well over 100 points back, as F1 heads to the Autódromo Hermanos Rodríguez for the Mexico City Grand Prix on November 1.',
    ],
    related:'f1-austin-qualifying-recap',
    pull:'Antonelli needed a win and Russell ninth-or-lower to be champion in Austin. He got the win. Russell finished eighth.',
  },
  {id:'f1-mexico-city-preview', sport:'f1', cat:'preview',
    headline:'Antonelli Can Clinch the Title in Mexico City With Just a Ninth-Place Finish',
    dek:'The gap is now big enough that Kimi Antonelli doesn\'t need outside help at the Autódromo Hermanos Rodríguez — any finish from P1 to P9 wraps up the championship outright.',
    byline:'Clutch Room F1 Desk', mins:4, time:'Oct 27, 2026',
    qa:[['What does Antonelli need to do to win the title in Mexico City?','Finish ninth or better. With a 123-point lead over George Russell and only a handful of rounds left this season, even a single point locks the championship beyond Russell\'s reach — no help from a rival required this time.'],
        ['Why is this different from Austin, where he needed Russell to finish ninth or lower?','In Austin the math still depended on what Russell and Hamilton did. With fewer rounds left on the calendar now, Antonelli\'s own result is the only variable that matters — he can clinch with his own car, not by watching the group behind him.'],
        ['Is anything else still undecided in the standings?','Yes — second place. Russell (242), Hamilton (241), Verstappen (236) and Leclerc (233) are separated by just nine points, with Norris (211) not far outside that group either. While Antonelli\'s title fight could be over by Sunday night, the fight for the runner-up spot looks wide open all the way to the season\'s final rounds.']],
    body:[
      'Kimi Antonelli arrives at the Autódromo Hermanos Rodríguez with a buffer that no longer requires him to track what George Russell or Lewis Hamilton are doing on the same page. At 365 points to Russell\'s 242 and Hamilton\'s 241, with only a handful of rounds remaining on the calendar, the math has tipped far enough that any finish from P1 down to P9 on Sunday is enough to make Antonelli champion outright.',
      'That is a meaningfully simpler equation than the one he faced at Austin, where victory alone wasn\'t enough — he also needed Russell to finish ninth or worse. This time Antonelli controls his own outcome. A podium ends it with races still to spare; so, now, does a quiet point-scoring drive to ninth.',
      'While the championship itself may be a formality by Sunday night, the battle directly behind Antonelli is anything but settled. Russell holds second with 242 points, but Hamilton is right behind him at 241, Verstappen at 236 and Leclerc at 233 — four drivers separated by just nine points, with Norris\'s 211 keeping him within shouting distance too. A single strong or disastrous weekend in Mexico City could reshuffle that entire group, and there are still enough rounds left for it to change hands more than once.',
      'Mercedes will still race to win — Antonelli has shown no interest in coasting to a title, including the pole-to-flag run in Austin that set this weekend up. But for the first time all season, the team can walk into a Grand Prix knowing a defensive, play-it-safe result is enough to get the job done, even as four other drivers fight it out just behind him for the spot on the podium he\'ll leave vacant.',
    ],
    related:'f1-austin-race-recap',
    pull:'Antonelli doesn\'t need Russell to slip up anymore — but behind him, four drivers within nine points are still fighting for second.',
  },
];

function jumpSport(id){ location.hash = '#/sport/'+id; }

function toggleNavMore(e){
  e.stopPropagation();
  const wrap = e.currentTarget.closest('.nav-more');
  if(!wrap) return;
  const opening = !wrap.classList.contains('open');
  closeNavMore();
  if(opening){
    wrap.classList.add('open');
    e.currentTarget.setAttribute('aria-expanded','true');
  }
}
function closeNavMore(){
  document.querySelectorAll('.nav-more.open').forEach(w=>{
    w.classList.remove('open');
    const t = w.querySelector('.nav-more-trigger');
    if(t) t.setAttribute('aria-expanded','false');
  });
}

let searchActiveIndex = -1;
function toggleSearch(e){
  e.stopPropagation();
  const btn = document.getElementById('searchBtn');
  const panel = document.getElementById('searchPanel');
  if(!btn || !panel) return;
  const opening = panel.hasAttribute('hidden');
  if(opening){
    panel.removeAttribute('hidden');
    btn.setAttribute('aria-expanded','true');
    const input = document.getElementById('searchInput');
    if(input){
      input.value='';
      document.getElementById('searchResults').innerHTML='';
      searchActiveIndex = -1;
      input.setAttribute('aria-expanded','false');
      input.removeAttribute('aria-activedescendant');
      setTimeout(()=>input.focus(),0);
    }
  } else {
    closeSearch();
  }
}
function closeSearch(){
  const btn = document.getElementById('searchBtn');
  const panel = document.getElementById('searchPanel');
  const input = document.getElementById('searchInput');
  if(panel) panel.setAttribute('hidden','');
  if(btn) btn.setAttribute('aria-expanded','false');
  if(input){ input.setAttribute('aria-expanded','false'); input.removeAttribute('aria-activedescendant'); }
  searchActiveIndex = -1;
}
function setSearchActive(i){
  const options = document.querySelectorAll('#searchResults [role="option"]');
  const input = document.getElementById('searchInput');
  options.forEach((o,idx)=>{
    const active = idx===i;
    o.setAttribute('aria-selected', active ? 'true' : 'false');
    o.classList.toggle('active', active);
  });
  searchActiveIndex = i;
  if(input){
    if(i>=0 && options[i]) input.setAttribute('aria-activedescendant', options[i].id);
    else input.removeAttribute('aria-activedescendant');
  }
}
function searchKeydown(e){
  if(e.key==='Escape'){ closeSearch(); return; }
  const options = Array.from(document.querySelectorAll('#searchResults [role="option"]'));
  if(!options.length) return;
  if(e.key==='ArrowDown'){
    e.preventDefault();
    setSearchActive(searchActiveIndex < options.length-1 ? searchActiveIndex+1 : 0);
  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    setSearchActive(searchActiveIndex > 0 ? searchActiveIndex-1 : options.length-1);
  } else if(e.key==='Enter'){
    if(searchActiveIndex>=0 && options[searchActiveIndex]){
      e.preventDefault();
      options[searchActiveIndex].click();
    }
  }
}
function performSearch(q){
  const resultsEl = document.getElementById('searchResults');
  const input = document.getElementById('searchInput');
  if(!resultsEl) return;
  searchActiveIndex = -1;
  if(input) input.removeAttribute('aria-activedescendant');
  const query = q.trim().toLowerCase();
  if(!query){ resultsEl.innerHTML=''; if(input) input.setAttribute('aria-expanded','false'); return; }
  const matches = ARTICLES.filter(a=>
    a.headline.toLowerCase().includes(query) ||
    (a.dek && a.dek.toLowerCase().includes(query)) ||
    sportById(a.sport).name.toLowerCase().includes(query)
  ).slice(0,6);
  if(input) input.setAttribute('aria-expanded', matches.length ? 'true' : 'false');
  if(!matches.length){
    resultsEl.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'search-empty';
    div.textContent = 'No articles match "'+q.trim()+'"';
    resultsEl.appendChild(div);
    return;
  }
  resultsEl.innerHTML = matches.map((a,i)=>`<a href="#/article/${a.id}" id="search-opt-${i}" role="option" aria-selected="false" class="search-result" onclick="closeSearch()" onmouseenter="setSearchActive(${i})"><span class="sr-sport">${sportById(a.sport).name}</span><span class="sr-headline">${a.headline}</span></a>`).join('');
}
document.addEventListener('click', function(e){
  const panel = document.getElementById('searchPanel');
  if(panel && !panel.hasAttribute('hidden') && !panel.contains(e.target) && e.target.id!=='searchBtn'){
    closeSearch();
  }
  closeNavMore();
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeSearch(); closeNavMore(); }
});

function filterLeague(league){
  document.querySelectorAll('.league-chips .chip').forEach(c=>{
    const on = c.dataset.league===league;
    c.classList.toggle('on', on);
    c.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  document.querySelectorAll('#app .card[data-league]').forEach(card=>{
    card.style.display = (league==='All' || card.dataset.league===league) ? '' : 'none';
  });
  let anyRailVisible = false;
  ['recap','preview','injury','debate'].forEach(cat=>{
    const rail = document.getElementById('rail-'+cat);
    if(!rail) return;
    const anyVisible = Array.from(rail.querySelectorAll('.card')).some(c=>c.style.display!=='none');
    rail.style.display = anyVisible ? '' : 'none';
    if(anyVisible) anyRailVisible = true;
  });
  const noArticles = document.getElementById('no-league-articles');
  if(noArticles) noArticles.style.display = anyRailVisible ? 'none' : 'block';
  const showFixtures = league==='All' || league==='Champions League';
  const fxUcl = document.getElementById('fixtures-ucl');
  const fxFallback = document.getElementById('fixtures-fallback');
  if(fxUcl) fxUcl.style.display = showFixtures ? '' : 'none';
  if(fxFallback) fxFallback.style.display = showFixtures ? 'none' : 'block';
}

function renderHome(){
  const debate = ARTICLES.find(a=>a.cat==='debate' && a.sport==='football');
  const ranked = [...SPORTS].sort((a,b)=>b.heat-a.heat);
  const main = ranked.filter(s=>tierOf(s.heat)<=3);
  const primary = main.slice(0,5);
  const secondary = main.slice(5);
  const quiet = ranked.filter(s=>tierOf(s.heat)===4);
  const peekFor = id => {
    const forSport = ARTICLES.filter(a=>a.sport===id);
    const recaps = forSport.filter(a=>a.cat==='recap');
    return recaps.length ? recaps[recaps.length-1] : forSport[0];
  };
  // Hero always tracks the hottest sport's best available current story (analysis piece
  // preferred over a quick recap) instead of a hardcoded id that goes stale as news moves on.
  const heroFor = (sportId) => {
    const forSport = ARTICLES.filter(a=>a.sport===sportId);
    const analyses = forSport.filter(a=>a.cat==='analysis');
    if(analyses.length) return analyses[analyses.length-1];
    const recaps = forSport.filter(a=>a.cat==='recap');
    if(recaps.length) return recaps[recaps.length-1];
    return forSport[0];
  };
  let hero = null;
  for(const s of ranked){ hero = heroFor(s.id); if(hero) break; }
  const forTake = debate.takes.find(t=>t.side==='for');

  const sportTileHtml = (s,i) => {
    const peek = peekFor(s.id);
    const big = tierOf(s.heat) === 1;
    const accent = s.live ? 'live' : s.accent;
    return `<a class="b-tile ${big?'b-2':''} ${s.live?'b-live':''}" href="#/sport/${s.id}" style="--accent:var(--${accent});--tint:${s.live?26:big?22:tierOf(s.heat)===2?13:8}%;">
      <span class="b-go">${String(i+1).padStart(2,'0')} →</span>
      ${s.live ? `<span class="b-live-badge"><span class="dot"></span>LIVE</span>` : ''}
      <span class="b-icon">${SPORT_ICONS[s.id]||''}</span>
      <span class="b-name disp">${s.name}</span>
      ${s.headline ? `<span class="b-headline">${s.headline}</span>` : ''}
      <span class="b-status">${s.status}</span>
      ${peek ? `<span class="b-peek">${peek.headline}</span>` : ''}
    </a>`;
  };

  return `
  ${masthead({sport:null})}
  <main class="wrap">
    <a class="hero-main" href="#/article/${hero.id}" style="display:block;margin-top:28px;">
      <span class="hero-kicker">Top Story · ${sportById(hero.sport).name}</span>
      <h1>${hero.headline}</h1>
      <p class="hero-dek">${hero.dek}</p>
      <div class="hero-meta">${hero.byline} · ${hero.time} · ${hero.mins} min read</div>
    </a>

    <div class="bento-head"><h2>What's Happening Right Now</h2><span class="sub">Ranked by heat, not alphabet — ${primary.length} sports leading</span></div>
    <div class="bento">
      ${primary.map((s,i)=>sportTileHtml(s,i)).join('')}
    </div>
    <div class="bento-secondary">
      ${secondary.length ? `<div class="b-tile b-quiet">
        <span class="b-quiet-label">Also in Play</span>
        ${secondary.map(s=>`<a class="b-quiet-row" href="#/sport/${s.id}"><span class="nm-row"><span class="nm">${s.name}</span><span class="go">→</span></span><span class="st">${s.headline||s.status}</span></a>`).join('')}
      </div>` : ''}
      ${quiet.length ? `<div class="b-tile b-quiet">
        <span class="b-quiet-label">Quiet This Week</span>
        ${quiet.map(s=>`<a class="b-quiet-row" href="#/sport/${s.id}"><span class="nm-row"><span class="nm">${s.name}</span><span class="go">→</span></span><span class="st">${s.headline||s.status}</span></a>`).join('')}
      </div>` : ''}
      <a class="b-tile b-quote" href="#/article/${debate.id}">
        <span class="b-q-label">Today's Debate</span>
        <span class="b-q-text">"${forTake.text}"</span>
        <span class="b-q-who">${forTake.who}</span>
        <span class="b-q-link">Read both sides →</span>
      </a>
    </div>

    <div class="bento-head"><h2>Insider Wire</h2><span class="sub">Beat reporter notes, continuously tracked</span></div>
    <div class="wire">${INSIDER.map(insiderCard).join('')}</div>
  </main>
  ${footer()}`;
}

function renderHub(sport){
  const s = sportById(sport);

  const byCat = c => [...arts.filter(a=>a.cat===c)].reverse();

  return `

/* ---------------- router ---------------- */
function route(){
  const hash = location.hash.replace(/^#\/?/,'');
  const app = document.getElementById('app');
  if(hash.startsWith('sport/')){
    const id = hash.split('/')[1];
    const s = sportById(id);
    if(id==='mlb'){ app.innerHTML = renderMLBHub(); }
    else if(id==='f1'){ app.innerHTML = renderF1Hub(); }
    else if(id==='nfl'){ app.innerHTML = renderNFLHub(); }
    else if(!s){ app.innerHTML = renderPlaceholderHub('cricket'); }
    else if(s.deep==='full'){ app.innerHTML = renderHub(id); }
    else if(s.deep==='light'){ app.innerHTML = renderLightHub(id); }
    else { app.innerHTML = renderPlaceholderHub(id); }
  } else if(hash.startsWith('article/')){
    app.innerHTML = renderArticle(hash.split('/')[1]);
  } else if(hash.startsWith('nfl-team/')){
    app.innerHTML = renderNFLTeamPage(hash.split('/')[1]);
  } else if(hash === 'about'){
    app.innerHTML = renderAbout();
  } else if(hash === 'sports-news'){
    app.innerHTML = renderSportsNews();
  } else {
    app.innerHTML = renderHome();
  }
  window.scrollTo(0,0);
  onScrollEffects();
  initScrollReveal();
  updatedSecs = 0;
  const secsEl = document.getElementById('updated-secs');
  if(secsEl) secsEl.textContent = '0';
}
window.addEventListener('hashchange', route);

/* ---------------- staggered scroll-reveal ---------------- */
let revealEls = [];
let revealScrollBound = false;
function onRevealScroll(){
  if(revealScrollTicking) return;
  revealScrollTicking = true;
  requestAnimationFrame(checkReveals);
}
let revealScrollTicking = false;
function checkReveals(){
  revealScrollTicking = false;
  if(!revealEls.length) return;
  const vh = window.innerHeight || 800;
  const stepIndex = new Map();
  revealEls = revealEls.filter(el=>{
    if(el.getBoundingClientRect().top >= vh - 40) return true;
    const parent = el.parentElement;
    const idx = stepIndex.get(parent) || 0;
    stepIndex.set(parent, idx+1);
    el.style.transitionDelay = (Math.min(idx,9) * 55) + 'ms';
    el.classList.add('in-view');
    return false;
  });
}
function initScrollReveal(){
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const els = document.querySelectorAll('.b-tile,.card,.wire-card,.div-col,.comp-item');
  if(reduceMotion){
    els.forEach(el=>el.classList.add('in-view'));
    revealEls = [];
    return;
  }
  revealEls = Array.from(els);
  checkReveals();
  if(!revealScrollBound){
    window.addEventListener('scroll', onRevealScroll, {passive:true});
    window.addEventListener('resize', onRevealScroll);
    revealScrollBound = true;
  }
}


let updatedSecs = 0;
setInterval(function(){
  updatedSecs++;
  const el = document.getElementById('updated-secs');
  if(el) el.textContent = String(updatedSecs);
}, 1000);

/* ---------------- F1 scroll-driven helmet + MLB scroll progress ---------------- */
const F1_RACE_TARGET = new Date('2026-11-01T20:00:00Z').getTime();
let scrollTicking = false;
function onScrollEffects(){
  const helmet = document.getElementById('f1-helmet');
  if(helmet && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    const rect = helmet.getBoundingClientRect();
    const vh = window.innerHeight || 800;
    const progress = Math.min(1, Math.max(0, 1 - (rect.top + rect.height/2) / vh));
    const spin = progress * 360;
    const tilt = (progress - 0.5) * 10;
    const scale = 0.82 + progress * 0.32;
    helmet.style.transform = `perspective(900px) rotateY(${spin}deg) rotateZ(${tilt}deg) scale(${scale})`;
  }
  const bar = document.getElementById('mlb-progress');
  if(bar){
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const pct = docHeight > 0 ? Math.min(100, Math.max(0, (window.scrollY / docHeight) * 100)) : 0;
    bar.style.width = pct + '%';
  }
}
window.addEventListener('scroll', function(){
  if(!scrollTicking){
    requestAnimationFrame(function(){ onScrollEffects(); scrollTicking = false; });
    scrollTicking = true;
  }
});
setInterval(function(){
  const dEl = document.getElementById('f1-d');
  if(!dEl) return;
  let diff = F1_RACE_TARGET - Date.now();
  if(diff < 0) diff = 0;
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  const secs = Math.floor((diff % 60000) / 1000);
  dEl.textContent = String(days).padStart(2,'0');
  document.getElementById('f1-h').textContent = String(hours).padStart(2,'0');
  document.getElementById('f1-m').textContent = String(mins).padStart(2,'0');
  document.getElementById('f1-sec').textContent = String(secs).padStart(2,'0');
}, 1000);

route();
</script>
</body>
</html>

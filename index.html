  },
  {id:'football-debate', sport:'football', league:'La Liga', cat:'debate',
    headline:'First Take: Has El Clásico Settled the La Liga Title Race?',
    dek:'Real Madrid\'s win at Camp Nou handed Barcelona their first domestic loss of the season and opened a 3-point gap. Two Clutch Room writers argue whether that\'s decisive or just one result in a long season.',
    byline:'Clutch Room Debate Desk', mins:5, time:'Oct 25, 2026',
    takes:[
      {side:'for', who:'Take: Barcelona\'s aura is gone, and that matters', text:'This wasn\'t just a loss, it was Barcelona\'s first domestic defeat of the season, on their own ground, with Mbappé scoring the winner late. A team that had looked unbeatable now has a psychological scar and a 3-point deficit to make up against a Real Madrid side playing with real conviction. Momentum in a title race is real, and Real Madrid just took all of it.'},
      {side:'against', who:'Take: It\'s one result with two-thirds of the season left', text:'Three points is nothing — Barcelona lost this exact fixture more than once in recent title-winning seasons. Atlético Madrid are still lurking, injuries and fixture congestion will reshape both squads before May, and Barcelona\'s underlying numbers all season have been better than Real Madrid\'s. Calling this decisive in late October is the kind of overreaction that gets forgotten by Christmas.'},
    ],
    body:['Real Madrid\'s 2-1 win at Camp Nou — sealed by Kylian Mbappé\'s 87th-minute goal, his 100th for the club — ended Barcelona\'s unbeaten domestic run and moved Los Blancos 3 points clear at the top, with Atlético Madrid still within touch of both. Whether that gap is the first crack in Barcelona\'s title defense or a blip that gets erased by Christmas is exactly the kind of argument El Clásico exists to start.'],
  },
  {id:'ucl-md3-tuesday-recap', sport:'football', league:'Champions League', cat:'recap',
    headline:'PSG Edge Barcelona 4-2 in Top-of-the-Table Clash as Foden Hat-Trick Powers City, Liverpool Survive Villarreal Thriller',
    dek:'Désiré Doué struck twice in a five-goal game at Parc des Princes, Phil Foden scored a hat-trick with Erling Haaland rested, and Liverpool outlasted Villarreal 4-3 to stay unbeaten on Matchday 3\'s Tuesday slate.',
    byline:'Clutch Room Football Desk', mins:6, time:'Oct 20, 2026',
    qa:[['What happened at Parc des Princes?','PSG beat Barcelona 4-2, with goals from Désiré Doué, Lucas Hernández, Vitinha and Fabián Ruiz; Xavi Espart and Lamine Yamal scored for Barcelona.'],
        ['How did Man City and Liverpool fare?','Man City routed AEK Athens 5-1 behind a Phil Foden hat-trick with Erling Haaland rested, and Liverpool beat Villarreal 4-3 in a seven-goal thriller at Anfield.']],
    body:[
      'Matchday 3\'s marquee fixture lived up to its billing. PSG beat Barcelona 4-2 at Parc des Princes in a clash between the competition\'s two form teams, with Désiré Doué opening the scoring in the 38th minute before Lucas Hernández (72\'), Vitinha (81\') and Fabián Ruiz (86\') put the result out of reach either side of a Xavi Espart strike. Lamine Yamal pulled one back for Barcelona in the 79th minute, but it wasn\'t enough to stop PSG\'s fifth straight win across all competitions.',
      'At the Etihad, Phil Foden scored a hat-trick (34\', 65\', 76\') with Erling Haaland left out of the squad to rest, as Manchester City routed AEK Athens 5-1. Elliot Anderson (12\') and Rayan Cherki (57\') also scored for City, who conceded only a Stavros Pilios goal in the 52nd minute.',
      'Liverpool\'s night at Anfield was the closest of the three. Alexis Mac Allister scored twice (36\', 65\'), Ronald Araújo added a goal in first-half stoppage time, and Florian Wirtz struck in the 68th minute as Liverpool held off a Villarreal side that pushed back through Georges Mikautadze (4\'), Sergi Cardona (29\') and a late Tani Oluwaseyi goal (87\'). The 4-3 win keeps Liverpool unbeaten through three matchdays.',
      'Wednesday closes out Matchday 3 with Arsenal hosting Bayern Munich and RB Leipzig traveling to Real Madrid.',
    ],
    related:'ucl-md3-foden-analysis',
    pull:'Foden\'s hat-trick with Haaland rested, and a seven-goal Anfield thriller, on a night PSG and Barcelona\'s top-of-the-table clash delivered too.',
  },
  {id:'ucl-md3-foden-analysis', sport:'football', league:'Champions League', cat:'analysis',
    headline:'Foden\'s Haaland-less Hat-Trick Is a Reminder Man City Have More Than One Gear',
    dek:'With Erling Haaland rested for the trip to AEK Athens, Phil Foden scored three in a 5-1 win — a data point for a team that\'s leaned heavily on one striker in its biggest games.',
    byline:'Clutch Room Football Desk', mins:6, time:'Oct 20, 2026',
    qa:[['How many goals did Foden score against AEK Athens?','A hat-trick (34\', 65\', 76\') in City\'s 5-1 win, with Elliot Anderson and Rayan Cherki also scoring.'],
        ['Why does the result matter beyond three points?','Haaland was left out to rest, not injured, and City still scored five — evidence of depth heading into the Champions League\'s heavier scheduling stretch.']],
    body:[
      'Erling Haaland has been the explanation for almost everything Manchester City have done well over the past two seasons, so his absence from Tuesday\'s trip to AEK Athens — a rest, not an injury — was the more interesting storyline than the opponent itself. City won 5-1 anyway, and the headline act was Phil Foden, who scored three times (34\', 65\', 76\') in the kind of complete, varied performance that\'s been rarer for him than his talent suggests it should be.',
      'Elliot Anderson opened the scoring in the 12th minute and Rayan Cherki added a fifth in the 57th, meaning City had goals from three different players before Foden\'s hat-trick was even needed to settle the result. AEK\'s only answer was a Stavros Pilios goal in the 52nd minute that briefly made the scoreline respectable without ever threatening it.',
      'None of this erases how important Haaland has been to City\'s attack this season — he remains the focal point in the games that matter most. But a 5-1 win on the road without him, built on a front-footed performance from Foden rather than a backup plan, is exactly the kind of evidence City will want on record as the Champions League schedule gets heavier and squad depth starts to matter as much as any single player.',
    ],
    related:'ucl-md3-tuesday-recap',
  },
  {id:'ucl-md3-wednesday-recap', sport:'football', league:'Champions League', cat:'recap',
    headline:'Rice Rescues Arsenal Draw at Bayern, Real Madrid Rout Leipzig 4-1 to Close Out Matchday 3',
    dek:'Declan Rice\'s 82nd-minute leveler denied Bayern Munich at the Allianz Arena, while Kylian Mbappé and Yan Diomandé struck late to turn a tight game into a rout at the Bernabéu.',
    byline:'Clutch Room Football Desk', mins:6, time:'Oct 21, 2026',
    qa:[['What happened at the Allianz Arena?','Bayern Munich and Arsenal drew 2-2 — Eberechi Eze (25\') and Declan Rice (82\') scored for Arsenal, Alphonso Davies (35\') and a Harry Kane penalty (61\') leveled it twice for Bayern.'],
        ['How did Real Madrid fare against RB Leipzig?','Real Madrid won 4-1 at the Bernabéu, with goals from Bernardo Silva (43\'), Arda Güler (52\'), Kylian Mbappé (83\') and Yan Diomandé (87\'); Tidiam Gomis scored Leipzig\'s consolation (85\').']],
    body:[
      'Matchday 3 closed with a result nobody at the Allianz Arena saw coming by full time. Arsenal looked set for a first defeat in 14 league phase or group stage games after Harry Kane\'s 61st-minute penalty put Bayern Munich back in front, but Declan Rice raced onto a slick passing move from Noni Madueke and Viktor Gyökeres to beat Manuel Neuer from an acute angle in the 82nd minute and salvage a 2-2 draw. Eberechi Eze had opened the scoring in the 25th minute after replacing the injured Bukayo Saka, before Alphonso Davies leveled for Bayern in the 35th off a Kane assist.',
      'Kane\'s penalty, awarded after his shot struck Jurrien Timber\'s arm, was also a milestone: it extended his run of scoring in Champions League matches to 10 in a row and took his career tally against Arsenal to 16 goals in 22 appearances. Bayern were missing Michael Olise (suspension) and Joshua Kimmich (family reasons).',
      'At the Bernabéu, Real Madrid needed longer to get going but finished with a flourish. Bernardo Silva broke the deadlock in the 43rd minute after RB Leipzig goalkeeper Maarten Vandevoordt had saved an earlier Arda Güler effort, and Güler doubled the lead himself in the 52nd, tapping in a Kylian Mbappé header. Mbappé added his own goal in the 83rd before Yan Diomandé volleyed in a fourth in the 87th; Tidiam Gomis pulled one back for Leipzig on a quick counter in between (85\'). The 4-1 win keeps José Mourinho\'s side unbeaten through three Champions League matchdays heading into this weekend\'s Clásico against Barcelona.',
    ],
    related:'ucl-md3-kane-streak-analysis',
    pull:'Declan Rice\'s 82nd-minute leveler denied Bayern at the Allianz Arena; across town, Mbappé and Diomandé turned a tight Bernabéu game into a rout.',
  },
  {id:'ucl-md3-kane-streak-analysis', sport:'football', league:'Champions League', cat:'analysis',
    headline:'Harry Kane Is One Game From Matching Cristiano Ronaldo\'s Champions League Scoring Streak',
    dek:'Kane\'s penalty against Arsenal stretched his run to 10 consecutive Champions League matches with a goal — level with everyone in the competition\'s history except Ronaldo, whose 11-game streak from 2017-18 remains the target.',
    byline:'Clutch Room Football Desk', mins:5, time:'Oct 21, 2026',
    qa:[['How long is Kane\'s current scoring streak?','10 consecutive Champions League matches with at least one goal, after his penalty against Arsenal on Matchday 3.'],
        ['Whose record is he chasing?','Cristiano Ronaldo\'s — Ronaldo scored in 11 straight Champions League games between June 2017 and April 2018, still the competition\'s all-time mark.']],
    body:[
      'Harry Kane\'s 61st-minute penalty against Arsenal did more than drag Bayern Munich level — it stretched his run of scoring in consecutive Champions League matches to 10, matching every player in the competition\'s history bar one: Cristiano Ronaldo, who scored in 11 straight Champions League games between June 2017 and April 2018, a run that has stood untouched for more than eight years.',
      'The penalty also extended a personal rivalry: Kane\'s goal was his 16th in 22 career appearances against Arsenal, a remarkable rate even by his standards. He had already broken Lionel Messi\'s record for most Champions League goals scored after turning 30, a mark he passed earlier this matchday cycle.',
      'None of it was enough to win Wednesday\'s match outright — Declan Rice\'s 82nd-minute equalizer meant Kane\'s goal only bought a point, not three. But the streak survives the draw, and Bayern\'s next Champions League fixture is the one that will decide whether Kane ties or falls short of the Portuguese forward\'s record.',
    ],
    related:'ucl-md3-wednesday-recap',
  },

  {id:'dusseldorf-padel-qf-recap', sport:'padel', cat:'recap',
    headline:'Tapia-Coello and Lebrón-Augsburger Reach the Semifinals in Düsseldorf',
    dek:'The No. 1 and No. 3 seeds both won in straight sets on Friday, while the rest of the men\'s quarterfinals — including defending champions Galán-Chingotto — were held over to Saturday.',
    byline:'Clutch Room Padel Desk', mins:4, time:'Oct 9, 2026',
    qa:[['What were the results?','Agustín Tapia and Arturo Coello (No. 1 seeds) beat Gonzalo Alfonso and Vicente Libaak 6-2, 7-5; Juan Lebrón and Leo Augsburger (No. 3 seeds) beat Miguel Arce Simo and Javi Tello 6-3, 6-3.'],

    body:[
      'Two of Friday\'s two completed men\'s quarterfinals in Düsseldorf went exactly as seeded. Agustín Tapia and Arturo Coello, the No. 1 seeds, beat Gonzalo Alfonso and Vicente Libaak 6-2, 7-5 on Center Court, and Juan Lebrón and Leo Augsburger, seeded No. 3, were just as clean on Court 2, beating Miguel Arce Simo and Javi Tello 6-3, 6-3.',

      'On the women\'s side, Friday also wrapped three quarterfinals: Ariana Sánchez and Alejandra Ustero Prieto, the No. 3 seeds, beat Ariana Salazar Bengoechea and Alba Osoro Ulrich (No. 7) 6-1, 6-1; María Calvo and Claudia Fernández Sánchez (No. 4) beat Marta Ortega Gallego and Sofía Araujo (No. 5) 6-0, 6-3; and Beatriz González Fernández and Paula Josemaría Martín, the No. 2 seeds, beat María Guinart España and Alba Alonso De Villa 6-0, 6-1.',

    pull:'Tapia-Coello and Lebrón-Augsburger didn\'t drop a set — but the draw\'s biggest potential quarterfinal, against defending champions Galán-Chingotto, is still unplayed.',

  {id:'milano-padel-final-recap', sport:'padel', cat:'recap',
    headline:'Tapia-Coello Win Milano P1 Too, Beating Lebrón-Augsburger in Three',
    dek:'A week after Düsseldorf, Agustín Tapia and Arturo Coello won again — this time the hard way, dropping the opening set before closing it out 4-6, 6-3, 6-2.',

    qa:[['Who won the men\'s final?','Agustín Tapia and Arturo Coello beat Juan Lebrón and Leo Augsburger 4-6, 6-3, 6-2.'],
        ['What happened in the women\'s final?','Bea González and Paula Josemaría beat Andrea Ustero and Ariana Sánchez 7-6, 6-3.']],
    body:[
      'Tapia and Coello made it back-to-back titles, but Milano made them work for it in a way Düsseldorf never did. Lebrón and Augsburger, the No. 3 seeds, took the opening set 6-4 and had the No. 1 pair on the back foot before Tapia-Coello reset, took the second set 6-3, and closed out the title 6-2 in the decider.',

  },
  {id:'kuwait-major-opening-day', sport:'padel', cat:'recap',
    headline:'No. 2 Seeds Galán-Chingotto Withdraw as Kuwait Major\'s Qualifiers Steal Opening Day',
    dek:'Alejandro Galán\'s last-minute injury forced him and Federico Chingotto out before their opener, while two teams that came through qualifying — Axelsson-Ortega and Abud-Belluati — both rallied from a set down to reach the Round of 32.',
    byline:'Clutch Room Padel Desk', mins:4, time:'Oct 25, 2026',
    qa:[['Why did Galán and Chingotto withdraw?','Alejandro Galán suffered a last-minute injury before the No. 2 seeds\' opening match, forcing the team out of the draw entirely.'],
        ['Who were the standout winners on opening day?','Adam Axelsson and Mario Ortega, who came through qualifying, upset No. 17 seeds Maxi Sánchez and Sanyo Gutiérrez in a final-set tie-break. Juan Cruz Belluati and Martín Abud, also qualifiers, won the longest match of the day to beat No. 25 seeds Javier Martínez and Luis Hernández in three sets.']],
    body:[
      'The Kuwait Premier Padel Major — the third Major of the 2026 season — got underway with one of its top seeds already gone. Second seeds Alejandro Galán and Federico Chingotto were forced to withdraw just before their opening match after a last-minute injury to Galán, handing their Round of 32 opponents a walkover before a ball was struck.',
      'The day belonged instead to the players who had to win their way into the main draw. Adam Axelsson and Mario Ortega, through from qualifying, pulled off the biggest upset of the day, dropping the opening set to No. 17 seeds Maxi Sánchez and Sanyo Gutiérrez before winning a 9-7 tie-break and closing it out 6-3 in the decider. It\'s the best Major result of Axelsson\'s career to date.',
      'Juan Cruz Belluati and Martín Abud matched that run in the longest match of the day, needing two hours and 43 minutes to beat No. 25 seeds Javier Martínez and Luis Hernández 3-6, 6-2, 7-5 — the first main-draw win of Abud\'s career at a Major. Their reward is a Round of 32 date with No. 3 seeds Juan Lebrón and Leo Augsburger.',
      'The women\'s draw and several of the tour\'s top men\'s teams — including defending Milano P1 champions Agustín Tapia and Arturo Coello — begin their campaigns as the tournament continues through October 31.',
    ],
    pull:'Galán\'s injury took out a No. 2 seed before a ball was struck — and two qualifiers made the most of the opening it created.',
  },

  {id:'pistons-celtics-opener-recap', sport:'basketball', cat:'recap',
    headline:'Pistons Erase a 22-Point Hole, Stun Paul George\'s Celtics 121-113 in Opener',
    dek:'Detroit trailed by 22 with eight minutes left and still won, closing the season opener on a 23-0 run as Cade Cunningham, Jalen Duren and Javonte Green overcame a 38-point Celtics debut from Paul George.',
    byline:'Clutch Room Basketball Desk', mins:5, time:'Oct 20, 2026',
    qa:[['What was the final score?','Pistons 121, Celtics 113, at Little Caesars Arena in Detroit\'s season opener.'],
        ['How big was the comeback?','Boston led 72-50 with about eight minutes to play before Detroit closed the game on a 23-0 run — one of the largest opening-night comebacks in NBA history.']],
    body:[
      'Paul George\'s first regular-season game in a Celtics uniform looked like a rout for most of three quarters. Boston led by as many as 22 points, up 72-50 with eight minutes to go, before the Pistons answered with a 23-0 run that turned Opening Night into one of the most stunning comebacks in franchise history — a 121-113 win at Little Caesars Arena.',
      'Cade Cunningham ran the fourth-quarter surge, finishing with 22 points and eight assists and going 5-for-5 from the free-throw line down the stretch. Jalen Duren added 22 points and nine rebounds inside, and Duncan Robinson scored 15 of his 21 points in the final period alone. Javonte Green sparked the burst off the bench, hitting five 3-pointers and finishing a game-high plus-21 in just 18 minutes.',
      'Boston had controlled the game behind Paul George, who set a Celtics debut scoring record with 38 points in his first appearance for his new team after the offseason trade that sent Jaylen Brown to Philadelphia. But Jayson Tatum struggled to find any rhythm, shooting just 6-for-23, and Boston\'s offense went cold at the exact moment Detroit\'s defense tightened and its bench caught fire.',
      'It\'s the kind of win Detroit built its identity on a year ago: a team that doesn\'t blink when it falls behind. Boston, meanwhile, gets an uncomfortable answer to the one question hanging over its new-look roster — whether adding George was enough to paper over the loss of Brown on nights the shots aren\'t falling for Tatum.',
    ],
    pull:'Down 22 with eight minutes left, the Pistons closed the game on a 23-0 run to stun Paul George\'s Celtics in his regular-season debut.',
  },

  {id:'sixers-knicks-opener-recap', sport:'basketball', cat:'recap',
    headline:'76ers Spoil Knicks\' Banner Night, Win LeBron and Jaylen Brown\'s Philadelphia Debuts 106-100',
    dek:'Tyrese Maxey scored 28, Jaylen Brown capped a 29-18 third quarter with a buzzer-beating 3 off a LeBron James inbound, and Philadelphia ruined New York\'s championship ring ceremony at Madison Square Garden.',
    byline:'Clutch Room Basketball Desk', mins:5, time:'Oct 20, 2026',
    qa:[['What was the final score?','76ers 106, Knicks 100, at Madison Square Garden — the night New York raised its first championship banner in over 50 years.'],
        ['How did the new Sixers do in their Philadelphia debuts?','Jaylen Brown scored 19 points on 8 rebounds and 6 assists, including a buzzer-beating 3 to end the third quarter off a LeBron James inbound pass. James added 14 points, 9 rebounds and 7 assists.']],
    body:[
      'The Knicks got their banner and their rings. They didn\'t get the result. New York\'s championship celebration at Madison Square Garden turned into a 106-100 loss to a 76ers team that spent the offseason rebuilding around LeBron James and Jaylen Brown, both of whom made it a Philadelphia debut to remember.',
      'New York led 58-54 at halftime and looked in control until Philadelphia turned the third quarter into a 29-18 swing, capped when Brown caught a LeBron James inbound pass and buried a 3 at the buzzer to end the period. Tyrese Maxey led all scorers with 28 points, Brown finished with 19 points, 8 rebounds and 6 assists, and James added 14 points, 9 rebounds and 7 assists in 33 minutes on 5-of-13 shooting.',
      'Jalen Brunson led the Knicks with 21 points and Karl-Anthony Towns added 19 points and 12 rebounds, but New York couldn\'t find an answer for Philadelphia\'s third-quarter burst in front of its own crowd on what was supposed to be an unambiguously good night.',
    ],
    related:'sixers-lebron-brown-debut-analysis',
    pull:'Brown\'s buzzer-beating 3 off a LeBron inbound capped a 29-18 third quarter that turned New York\'s ring night into a loss.',
  },
  {id:'sixers-lebron-brown-debut-analysis', sport:'basketball', cat:'analysis',
    headline:'LeBron James and Jaylen Brown\'s First Night in Philadelphia Looked Like a Finished Product',
    dek:'A 14-point, 9-rebound, 7-assist floor-general game from LeBron James and a buzzer-beating dagger from Jaylen Brown, on the road against the defending champions, is as clean a debut as a rebuilt roster can ask for.',
    byline:'Clutch Room Basketball Desk', mins:6, time:'Oct 20, 2026',
    qa:[['Why does one opening-night game matter this much?','Philadelphia built its whole offseason around James and Brown, and the first real test — on the road, on the Knicks\' banner night — produced the exact kind of play the trade was made for: a LeBron-to-Brown connection deciding the game in real time.'],
        ['What stood out statistically?','LeBron James finished with 14 points, 9 rebounds and 7 assists in 33 minutes, and Jaylen Brown\'s 19 points, 8 rebounds and 6 assists included the buzzer-beating 3 off James\' own inbound pass that turned a 58-54 deficit into a one-possession game by the end of the third.']],
    body:[
      'Philadelphia didn\'t just win its first game with LeBron James and Jaylen Brown in the building — it won on the one possession that was supposed to justify the entire offseason. Up against it at halftime, down 58-54 to a Knicks team raising its first championship banner in half a century, the 76ers needed their two new stars to look like exactly what the front office sold when it built this roster around them. For one third-quarter sequence, they did: James took the inbound, found Brown, and Brown buried a 3 at the horn to cap a 29-18 quarter that flipped the game.',
      'The box score backs up the eye test. James\' line — 14 points, 9 rebounds, 7 assists in 33 minutes on 5-of-13 shooting — is a floor-general stat line, not a scoring one, and that\'s the point: Philadelphia doesn\'t need him to be its leading scorer when Tyrese Maxey is dropping 28. It needs him to be the connective tissue, and seven assists against a defending-champion defense on the road is exactly that. Brown\'s 19 points, 8 rebounds and 6 assists round out a game where all three of Philadelphia\'s stars produced winning numbers on the same night, something that doesn\'t always happen even when a roster is built specifically for it to happen.',
      'None of this guarantees anything about April. But the Knicks are the team Philadelphia has to get through if the rebuild is going to mean anything, and the 76ers just beat them, on New York\'s own floor, on the night that was supposed to belong entirely to the champions. If the goal was proof of concept, Opening Night delivered it in the most literal way possible — one inbound pass, one catch-and-shoot 3, one game decided by the exact two players the trade was about.',
    ],
    related:'sixers-knicks-opener-recap',
  },

  {id:'thunder-spurs-opener-recap', sport:'basketball', cat:'recap',
    headline:'Thunder Cap NBA Opening Night by Routing Spurs 116-104 as Wembanyama Goes 1-of-13',
    dek:'Shai Gilgeous-Alexander scored 32 and Jared McCain added 20 off the bench in the season opener at Frost Bank Center, while Victor Wembanyama missed his first 12 shots before finishing with just 12 points.',
    byline:'Clutch Room Basketball Desk', mins:4, time:'Oct 21, 2026',
    qa:[['What was the final score?','Thunder 116, Spurs 104, in a rematch of last season\'s Western Conference finals at Frost Bank Center in San Antonio.'],
        ['What happened to Victor Wembanyama?','He missed his first 12 shot attempts — his only field goal came on an alley-oop pass from De\'Aaron Fox at the third-quarter buzzer — and finished with 12 points on 1-of-13 shooting.']],
    body:[
      'Oklahoma City closed out NBA Opening Night the way it spent last postseason: in control against San Antonio. The Thunder led for all but the first five minutes, pulling away to a 65-44 halftime lead behind Shai Gilgeous-Alexander (32 points, 6 rebounds, 4 assists) and a reserve burst from Jared McCain, who scored 20 on 6-of-8 three-point shooting, in a 116-104 win at Frost Bank Center.',
      'San Antonio cut the deficit to single digits in the third quarter, with Stephon Castle scoring 24 points and grabbing 7 rebounds to keep the Spurs within range. But Victor Wembanyama\'s season debut was a nightmare from the floor — he missed his first 12 field-goal attempts, including a blocked alley-oop try, before his only make came on a De\'Aaron Fox lob as time expired in the third quarter. He finished 1-of-13 for 12 points.',
      'It\'s a single opening-night result, and nobody in San Antonio will mistake it for a trend after one off shooting night from their franchise cornerstone. But for a Thunder team that beat this same Spurs roster in last season\'s Western Conference finals, picking right back up with a 12-point road win is the cleanest possible start to a title defense.',
    ],
  },
  {id:'cavs-wolves-ot-recap', sport:'basketball', cat:'recap',
    headline:'Cavaliers Stun Timberwolves 127-125 in OT, End Minnesota\'s Unbeaten Start',
    dek:'Anthony Edwards scored 47 in his new backcourt alongside LaMelo Ball, but Cleveland outlasted Minnesota in overtime on Monday, while the Thunder improved to 4-0 by routing the Suns and the Warriors finally broke through at 0-3.',
    byline:'Clutch Room Basketball Desk', mins:5, time:'Oct 27, 2026',
    qa:[['How did the Cavaliers beat the Timberwolves?','Cleveland won 127-125 in overtime despite 47 points from Anthony Edwards, ending Minnesota\'s unbeaten start to the season at 3-1.'],
        ['What else happened around the league Monday?','Oklahoma City routed Phoenix 125-114 to improve to 4-0, with Devin Booker held to a career-low 3 points, and Golden State snapped an 0-3 start by routing Denver 134-114 at Ball Arena.']],
    body:[
      'Anthony Edwards put up 47 points and had Minnesota in position to stay unbeaten, but Cleveland forced overtime and pulled away late for a 127-125 win that ends the Timberwolves\' perfect start at 3-1. It\'s the first real loss for the Edwards-LaMelo Ball backcourt the Wolves built over the summer — the pairing had opened the season 3-0, including a 117-94 win over Toronto in which Ball added 15 points and 8 assists alongside Edwards\' 26 — and it\'s the kind of result that won\'t show up as a signature win until later in the season, but it\'s an early signal the Cavaliers can play with anyone.',
      'Oklahoma City kept rolling, routing Phoenix 125-114 to move to 4-0 — the headline, though, was what happened to the Suns\' franchise player. Devin Booker was held to a career-low 3 points, an almost unthinkable number for a player of his caliber, as the Thunder\'s defense smothered Phoenix\'s offense for the second straight game against a contender.',
      'Golden State finally got on the board, routing Denver 134-114 at Ball Arena to snap an 0-3 start that had the Warriors looking like an outlier among last season\'s contenders. Three results, three very different storylines, on a Monday slate that reshuffled the league\'s early pecking order.',
    ],
  },

  {id:'giannis-heat-rough-start', sport:'basketball', cat:'analysis',
    headline:'Giannis\'s Miami Debut Has the Heat Off to Their Worst Start in Nearly Two Decades',
    dek:'The blockbuster trade that sent Antetokounmpo from Milwaukee to Miami over the summer was supposed to make the Heat contenders overnight. Instead, Miami has opened the season 0-3 — its worst start since 2007-08.',
    byline:'Clutch Room Basketball Desk', mins:7, time:'Oct 26, 2026',
    qa:[['What was the trade?','Miami acquired Giannis Antetokounmpo and Bobby Portis from Milwaukee in exchange for Tyler Herro, Kel\'el Ware, Jaime Jaquez Jr., Kasparas Jakučionis, three first-round picks, a pick swap and a second-rounder.'],
        ['Why has Miami started so poorly despite adding a two-time MVP?','The returning context matters: the Heat gave up four rotation players including their leading scorer in Herro to get Antetokounmpo, and integrating a new franchise centerpiece into an otherwise retooled roster has produced an 0-3 start, the team\'s worst since the 2007-08 season.']],
    body:[
      'It was supposed to be the move that finally gave Miami its next superstar. Instead, three games into the Giannis Antetokounmpo era, the Heat are off to their worst start in nearly two decades.',
      'The trade itself was a genuine blockbuster: Miami sent Tyler Herro, Kel\'el Ware, Jaime Jaquez Jr., Kasparas Jakučionis and a haul of draft capital to Milwaukee for Antetokounmpo and Bobby Portis, ending a saga between the two-time MVP and the only organization he\'d ever known. Bam Adebayo was the one piece the Heat refused to include, and the expectation across the league was that pairing Antetokounmpo with Adebayo and Miami\'s culture would make the Heat instant contenders in the East.',
      'The results so far haven\'t matched the fit on paper. Miami opened the season 0-3, its worst start since the 2007-08 season, with the roster still visibly working through the chemistry costs of trading away four rotation regulars — Herro most of all — in the same deal that brought its new star in. None of that erases what Antetokounmpo still is on the floor individually, but it\'s a reminder that even a trade this lopsided on paper takes time to actually turn into wins.',
      'The bigger questions — whether this roster construction works long-term, and how patient a fan base that gave up so much will be — are season-long stories. The next few weeks, as Antetokounmpo and his new teammates search for an identity, will say a lot about which direction this goes.',
    ],
  },
  {id:'warriors-lendeborg-butler-porzingis', sport:'basketball', cat:'recap',
    headline:'Rookie Yaxel Lendeborg Drops 31 as Warriors Snap 0-3 Start Without Butler, Porzingis',
    dek:'With Jimmy Butler still recovering from a torn ACL and Kristaps Porzingis out indefinitely, No. 11 pick Yaxel Lendeborg has been thrust into a starting role — and delivered a 31-point outing in the win that finally got Golden State on the board.',
    byline:'Clutch Room Basketball Desk', mins:6, time:'Oct 27, 2026',
    qa:[['Why are Jimmy Butler and Kristaps Porzingis both out?','Butler is recovering from a torn right ACL that ended his 2025-26 season — head coach Steve Kerr has given a return timeline of January or February. Porzingis is dealing with recurring symptoms from postural orthostatic tachycardia syndrome (POTS) and is out indefinitely while he weighs his basketball future.'],
        ['How has rookie Yaxel Lendeborg performed?','The No. 11 pick in the 2026 draft was named the Warriors\' starter at power forward for the regular-season opener and scored 12 points in his NBA debut before exploding for 31 points in Golden State\'s win over Denver that snapped their 0-3 start.']],
    body:[
      'Golden State opened the season without two of its most important players. Jimmy Butler is still working back from the torn right ACL that ended his 2025-26 season, with Steve Kerr pegging his return for somewhere between January and February. Kristaps Porzingis, meanwhile, is out indefinitely as he manages recurring symptoms from postural orthostatic tachycardia syndrome — serious enough that he\'s said to be contemplating his basketball future entirely.',
      'That left a significant hole in Golden State\'s frontcourt, and head coach Steve Kerr\'s answer was to hand real minutes to rookie Yaxel Lendeborg, the No. 11 pick in this year\'s draft, who was named a starter for the regular-season opener. He scored 12 points on 5-of-11 shooting in his NBA debut against the Lakers, a quiet but promising first outing for a player who\'d already turned heads in Summer League.',
      'The breakout came days later: Lendeborg exploded for 31 points as the Warriors finally broke through, routing Denver 134-114 at Ball Arena to snap an 0-3 start that had the franchise looking unrecognizable from last season\'s contender. With both Butler and Porzingis sidelined for the foreseeable future, how far a rookie forward can carry extra weight on a veteran roster is suddenly one of the more interesting subplots of Golden State\'s season.',
    ],
    related:'cavs-wolves-ot-recap',
  },

  {id:'pak-sl-1st-t20i-preview', sport:'cricket', cat:'preview',
    headline:'Pakistan vs Sri Lanka: Rawalpindi Sets Up a Fresh T20I Series Opener',
    dek:'Clear skies, a new-look Pakistan XI and two first-time series captains headline the opening T20I of Sri Lanka\'s tour, Friday at Rawalpindi Cricket Stadium.',
    byline:'Clutch Room Cricket Desk', mins:5, time:'Oct 8, 2026',
    qa:[['Who is playing and where?','Pakistan host Sri Lanka in the 1st T20I of a three-match series at Rawalpindi Cricket Stadium, Friday, October 9, 6:00 PM PKT.'],
        ['Who are the captains?','Sahibzada Farhan leads Pakistan and Kusal Mendis captains Sri Lanka.'],
        ['What\'s the weather forecast?','Clear skies with no real rain threat — a daytime high near 28–32°C (82–90°F) cooling to 16–21°C by the evening session.']],
    body:[
      'Sri Lanka\'s tour of Pakistan opens with three T20Is in Rawalpindi — the only fixtures in the format between the two sides this season — before the tour shifts into ODI and Test cricket later on. Friday\'s opener kicks off at 6:00 PM local time under lights at Rawalpindi Cricket Stadium.',
      'Both sides go in with their white-ball setups still taking shape. Sahibzada Farhan captains a Pakistan top order built around Saim Ayub, Maaz Sadaqat and Fakhar Zaman, with Khawaja Nafay behind the stumps and Hasan Nawaz, Abdul Samad and Shadab Khan adding depth through the middle order; the seam-and-spin mix late in the XI is expected to come from Naseem Shah or Razaullah, Salman Mirza, and either Sufiyan Moqim or Abrar Ahmed.',
      'Kusal Mendis leads a Sri Lanka attack leaning heavily on spin — Maheesh Theekshana, Dunith Wellalage and Vijayakanth Viyaskanth all in the mix — backed by a pace trio of Nuwan Thushara, Binura Fernando and Eshan Malinga. On a ground that has historically rewarded spin through the middle overs, how Mendis sequences his three slow bowlers against an unsettled Pakistan middle order is the tactical question worth watching from the first over.',
      'Conditions should not be a factor either way: forecasts call for a largely sunny day with no meaningful rain threat, setting up a clean run at a full 20 overs a side.',
    ],
  },

  {id:'pak-sl-1st-t20i-recap', sport:'cricket', cat:'recap',
    headline:'Farhan\'s 89 Seals a Four-Wicket Chase as Pakistan Open the Series 1-0',
    dek:'Sri Lanka\'s 182/8 wasn\'t enough — Sahibzada Farhan\'s 89 off 53 led Pakistan home to 187/6 with seven balls to spare in the series opener at Rawalpindi.',
    byline:'Clutch Room Cricket Desk', mins:4, time:'Oct 9, 2026',
    qa:[['Who won the toss?','Sri Lanka, who chose to bat first.'],
        ['What was the final result?','Pakistan chased down Sri Lanka\'s 182/8 with 187/6 in 18.5 overs, winning by 4 wickets with 7 balls remaining. Sahibzada Farhan was Player of the Match for his 89 off 53 balls.']],
    body:[
      'GONE! Kusal Mendis edges one straight to Mohammad Imran off Naseem Shah inside the first over — the Sri Lankan captain goes for just 1, and Pakistan have the start they wanted.',
      'And there\'s the second! Kamil Mishara holes out too, caught by Fakhar Zaman off Mohammad Imran, who now has 1/10 from his first 2.2 overs. Sri Lanka slip to 35/2, with extras (8, all wides) doing almost as much work as the bat.',
      'Lahiru Udara and Kamindu Mendis steadied things from there, and Sri Lanka eventually posted 182/8 — a total that looked competitive but wasn\'t, once captain Sahibzada Farhan got going. Farhan\'s 89 off 53 balls drove the chase, and Pakistan got home at 187/6 with 18.5 overs gone, a 4-wicket win with 7 balls to spare that put the hosts 1-0 up in the series.',

  {id:'boxing-chicago-schofield-bahdi', sport:'boxing', cat:'recap',
    headline:'Schofield Outworks Bahdi for Unanimous Decision, Claims Vacant WBA Title',
    dek:'Both fighters hit the canvas in Chicago, but Floyd Schofield\'s volume — 117 landed punches to Bahdi\'s 74 — settled it clearly on the cards. Earlier, a late-notice replacement stunned the flyweight co-feature.',
    byline:'Clutch Room Boxing Desk', mins:5, time:'Oct 12, 2026',
    qa:[['What was the final verdict?','Floyd Schofield won by unanimous decision, 115-111, 116-110 and 119-108, to claim the vacant WBA lightweight title.'],
        ['What happened to the Collazo-Sandoval flyweight fight?','Oscar Collazo withdrew with a rib injury before fight week. Late replacement Sergio Mendoza stepped in and stopped Ricardo Sandoval with three knockdowns, becoming unified flyweight champion.']],
    body:[
      'Floyd Schofield claimed the vacant WBA lightweight title at Wintrust Arena, outworking Lucas Bahdi across the full distance for a unanimous decision — scorecards of 115-111, 116-110 and 119-108. Both fighters were dropped during the fight, but the volume gap was decisive: Schofield landed 117 punches to Bahdi\'s 74, using speed and movement to control the pace and recover whenever Bahdi found success.',
      'The night\'s bigger surprise came earlier. Oscar Collazo, the scheduled flyweight titleholder, withdrew with a rib injury in training, and the WBC/WBA bout went ahead anyway with late replacement Sergio Mendoza stepping in against Ricardo Sandoval. Mendoza scored three knockdowns and stopped Sandoval at 1:43, walking away as the new unified flyweight champion in what was supposed to be someone else\'s fight entirely.',
    ],
  },

  {id:'f1-singapore-upgrades-penalties', sport:'f1', cat:'preview',

        ['Is he at least getting Mercedes\' new engine?','No — FIA development rules stopped Mercedes from fast-tracking his upgraded power unit to Singapore; it\'s now expected to arrive at the US Grand Prix in Austin instead.']],
    body:[
      'George Russell\'s Singapore weekend is compromised before a lap counts for points. Mercedes confirmed a power unit change after his retirement in Sepang, which triggers a grid penalty of at least 10 places for Sunday\'s Grand Prix — the penalty doesn\'t touch Saturday\'s sprint, the last of the 2026 season.',
      'The frustrating part for Mercedes: FIA development rules stopped them fast-tracking Russell\'s planned engine upgrade to soften the blow. He\'s taking the penalty on his current-specification unit, with the upgraded version now expected at COTA instead.',
      'On the development side, Red Bull brought new sidepods, floor geometry and flow conditioning, with Oscar Piastri calling the update "clearly big" enough to put Red Bull in the same class as Mercedes. McLaren isn\'t bringing new parts this weekend — the team wants to better extract performance from the upgrade it introduced in Baku, though Marina Bay\'s slow, 90-degree corners may not suit the car\'s strengths.',
    ],
    pull:'Russell takes the penalty on his old engine — the upgrade everyone expected doesn\'t show up until Austin.',
  },
  {id:'f1-singapore-press-day', sport:'f1', cat:'preview',
    headline:'Singapore Press Day: What the Grid Is Actually Saying Before Practice 1',
    dek:'From Alonso\'s "less straights" optimism to Colapinto chasing down a 22-point gap, Thursday\'s press conference set real expectations ahead of Friday practice.',
    byline:'Clutch Room F1 Desk', mins:5, time:'Oct 8, 2026',
    qa:[['What is Fernando Alonso expecting?','He\'s cautiously optimistic — Singapore\'s layout has fewer straights than recent tracks, which he thinks suits Aston Martin\'s current car.'],
        ['Who\'s chasing points this weekend?','Esteban Ocon says Haas "should have been in the points" at multiple recent races and wants to finally convert that pace into a result; Franco Colapinto says Alpine has the speed to cut into Racing Bulls\' 22-point championship lead.']],
    body:[
      'Thursday\'s press conference is usually a formality. This one actually set real stakes for the weekend. Fernando Alonso was cautiously optimistic about Aston Martin\'s chances, pointing to Singapore\'s layout having fewer straights than recent rounds — "less straights," in his own words, as the simple explanation for why this track should suit the car better than Malaysia did.',
      'Further down the midfield, Esteban Ocon said Haas has been fast enough to score points at multiple recent races without actually doing it, and wants Singapore to be the weekend that finally converts pace into result. Franco Colapinto was even more direct about the stakes: Alpine trails Racing Bulls by 22 points in the championship fight, and he believes the team has shown enough speed recently to start closing that gap.',
      'Lando Norris flagged the issue that\'s actually cost him positions lately — straight-line speed — but said McLaren has addressed it and that Singapore\'s corner-heavy layout should play to the car\'s strengths regardless. Gabriel Bortoleto confirmed Audi\'s recent upgrades are working as intended across multiple corner types, though he named heat management as still "one of our biggest limitations" at a track known for punishing exactly that.',
      'None of it replaces an actual lap time, which is what Friday\'s Practice 1 will finally provide. But it\'s a real look at where five teams think they stand before a single sector gets set.',
    ],
    pull:'Alonso wants fewer straights, Colapinto wants to cut 22 points, and Bortoleto is already worried about the heat — real stakes before a wheel turns.',
  },

  {id:'f1-singapore-fp1-recap', sport:'f1', cat:'recap',
    headline:'Russell Tops the Only Practice Session of a Compressed Singapore Weekend',

    byline:'Clutch Room F1 Desk', mins:4, time:'Oct 9, 2026',
    qa:[['What were the Practice 1 times?','George Russell led at 1:32.274, with Charles Leclerc 0.198s back in second and Lando Norris third, around three tenths behind.'],
        ['Why was there only one practice session?','Singapore is a sprint weekend — the format replaces FP2 and FP3 with Sprint Qualifying and the Sprint race, so Friday\'s single session was the only practice before qualifying sets the grid.']],
    body:[
      'George Russell\'s Mercedes topped the only practice session of the Singapore weekend, running a 1:32.274 around Marina Bay to beat Charles Leclerc\'s Ferrari by 0.198 seconds, with Lando Norris third for McLaren roughly three tenths back.',
      'Leclerc\'s teammate Lewis Hamilton was fourth, Oscar Piastri fifth, and championship leader Kimi Antonelli seventh for Mercedes — split by Max Verstappen\'s Red Bull in sixth. Isack Hadjar, Pierre Gasly and Liam Lawson rounded out the top ten.',
      'Because this is a sprint weekend, there\'s no FP2 or FP3 to adjust setups before it counts — Sprint Qualifying sets Saturday\'s sprint grid directly off this one session\'s read, which puts extra weight on a practice that\'s normally just a data-gathering exercise.',
    ],
    pull:'One practice session, then straight into Sprint Qualifying — Russell\'s Friday pace carries extra weight on a compressed weekend.',
  },
  {id:'f1-singapore-sprint-quali-recap', sport:'f1', cat:'recap',
    headline:'Hamilton Grabs a Surprise Sprint Pole, Four Tenths Clear of Gasly',
    dek:'Fourth in Friday practice, Lewis Hamilton found another gear when it counted — taking Sprint Qualifying pole at Marina Bay with Pierre Gasly and Fernando Alonso completing the top three.',
    byline:'Clutch Room F1 Desk', mins:4, time:'Oct 9, 2026',
    qa:[['Who took sprint pole?','Lewis Hamilton, with a 1:33.7, just under a second clear of Pierre Gasly in second.'],
        ['Who else made the top three?','Fernando Alonso was third, 1.2 seconds off Hamilton\'s pace.']],
    body:[
      'Lewis Hamilton\'s Ferrari was fourth-fastest in Friday practice. By the end of Sprint Qualifying, it was on pole — a 1:33.7 around Marina Bay that left Pierre Gasly\'s Alpine in second, roughly nine tenths back, with Fernando Alonso third for Aston Martin, 1.2 seconds off the pace.',
      'It\'s a result that scrambles the script written after practice, where Russell, Leclerc and Norris had set the pace. None of that trio starts Saturday\'s sprint at the front — a reminder that on a single-lap, low-fuel, track-evolving Singapore surface, practice pace and qualifying pace don\'t always point the same direction.',
      'Hamilton\'s grid penalty-free pole also stands in contrast to teammate Charles Leclerc\'s weekend — and to George Russell, who already knew he was starting Sunday\'s Grand Prix near the back after his earlier engine-change penalty, though that penalty doesn\'t apply to Saturday\'s sprint grid.',
    ],
    pull:'Fourth in practice, first in qualifying — Hamilton\'s sprint pole flips the form book Marina Bay seemed to be writing on Friday.',
  },
  {id:'f1-singapore-race-recap', sport:'f1', cat:'recap',
    headline:'Verstappen Leads Every Lap in Singapore, His Second Straight Win',
    dek:'Max Verstappen controlled the Singapore Grand Prix from lights to flag, beating Charles Leclerc by 7.3 seconds for his second consecutive victory after Malaysia.',
    byline:'Clutch Room F1 Desk', mins:4, time:'Oct 12, 2026',
    qa:[['What was the final result?','Max Verstappen won from pole, leading every lap, with Charles Leclerc second (+7.335s) and Kimi Antonelli third (+24.573s).'],
        ['What does this mean for the championship?','It\'s Verstappen\'s second straight win, moving him up to fourth in the standings, though Kimi Antonelli still leads comfortably on 335 points.']],
    body:[
      'Max Verstappen led every single lap of the Singapore Grand Prix, converting pole position into a start-to-finish win and backing up his victory in Malaysia with another dominant performance — his first Singapore win in 250 F1 starts. Charles Leclerc held second for Ferrari, 7.3 seconds back, with Kimi Antonelli completing the podium 24.6 seconds behind.',
      'Lando Norris and Oscar Piastri took fourth and fifth for McLaren, while Lewis Hamilton — who topped Friday practice and had talked up Ferrari\'s pace into the weekend — could only manage sixth, more than 53 seconds off the win. George Russell\'s grid penalty from his earlier engine change left him to recover to ninth.',
      'It\'s back-to-back wins for Verstappen and Red Bull, and while Kimi Antonelli\'s championship lead remains substantial, two dominant results in a row from the defending-form Red Bull car are exactly the kind of late-season momentum that turns a comfortable points gap into a genuine title fight.',
    ],
    related:'f1-singapore-race-breakdown',
  },
  {id:'f1-singapore-race-breakdown', sport:'f1', cat:'analysis',
    headline:'Lights to Flag: Breaking Down Verstappen\'s Dominant Singapore Weekend',
    dek:'A full look at how Red Bull turned pole position into a start-to-finish win at Marina Bay, who else moved up the order, and what it means for a championship race that\'s suddenly tighter than the points gap suggests.',
    byline:'Clutch Room F1 Desk', mins:7, time:'Oct 12, 2026',
    qa:[['Did anyone seriously challenge Verstappen?','No — leading every lap means there was no safety-car reshuffle or strategy gamble that put him under real pressure; Leclerc\'s 7.3-second gap at the flag was as close as it got.'],
        ['What happened to Hamilton after his strong Friday and sprint pole?','He finished sixth, 53.2 seconds off the win in the Grand Prix — a reminder that single-lap pace and full-race race pace are different problems at Marina Bay.']],
    body:[
      'There\'s a version of "led every lap" that still involves late drama — a safety car bunching the field, a slow pit stop, a late-race tire gamble from a rival. Singapore wasn\'t that. Max Verstappen converted pole into the lead at turn one and was never seriously challenged for it, crossing the line 7.335 seconds clear of Charles Leclerc\'s Ferrari. It was his first win at this circuit in 250 career starts — a genuinely rare hole in his résumé, now filled.',
      'The full order behind him tells its own story about where the grid actually stands heading into the season\'s final stretch. Kimi Antonelli held third for Mercedes despite carrying the championship lead and all the pressure that comes with it, finishing 24.6 seconds back. Lando Norris and Oscar Piastri were fourth and fifth for McLaren, a result that keeps the team in touch without threatening the podium picture. Lewis Hamilton\'s race was the real disappointment of the weekend: after topping Friday practice and talking confidently about Ferrari\'s pace, he slipped to sixth, over 53 seconds behind Verstappen by the finish — a gap that single-lap speed on a Friday simply didn\'t predict.',
      'George Russell\'s recovery drive to ninth, from the grid penalty picked up after his Sepang engine change, was a quietly useful result for Mercedes\' constructors\' points, even if it did nothing for his own championship math. Further back, Pierre Gasly, Oliver Bearman, Esteban Ocon and Carlos Sainz all finished a lap down, and three cars failed to see the finish: Lance Stroll, Franco Colapinto and Gabriel Bortoleto all retired, Bortoleto\'s race ending after just seven laps.',
      'The standings now read Antonelli 335, Russell 238, Hamilton 222, Verstappen 213, Leclerc 209 — numbers that still have Antonelli comfortably in front, but a 335-to-213 gap with races still to run is a very different conversation after back-to-back Verstappen wins than it was before Malaysia. Red Bull has found real pace at exactly the point in the season where it matters most to be peaking, and a driver who\'d gone winless for most of the year now has two in a row.',
    ],
    related:'f1-singapore-race-recap',
  },

  {id:'f1-austin-fp1-recap', sport:'f1', cat:'recap',
    headline:'Leclerc Tops First Practice at COTA in Upgraded Ferrari, Verstappen Close Behind',
    dek:'Charles Leclerc headed Friday\'s opening session in Austin at 1:36.052, edging Max Verstappen by 0.084 seconds as Ferrari rolled out a new aero package for the season\'s closing stretch.',
    byline:'Clutch Room F1 Desk', mins:4, time:'Oct 23, 2026',
    qa:[['What were the FP1 times?','Charles Leclerc led at 1:36.052, with Max Verstappen 0.084s back in second and Lando Norris third, 0.245s off the pace.'],
        ['Any incidents during the session?','Several drivers had laps cancelled, including Isack Hadjar, who still showed top-six pace but was classified 14th; Nico Hülkenberg\'s session ended early with a technical problem, and Alex Albon never set a representative lap time.']],
    body:[
      'Charles Leclerc headed first practice at the Circuit of the Americas, setting a best lap of 1:36.052 to lead Max Verstappen by 0.084 seconds and Lando Norris by 0.245, as Ferrari rolled out what the team has billed as a significant aerodynamic upgrade for the final stretch of the 2026 season. George Russell and Kimi Antonelli filled out the top five for Mercedes, who brought their own updates to Austin.',
      'Lewis Hamilton was sixth in the sister Ferrari, with Oscar Piastri seventh for McLaren and Gabriel Bortoleto eighth for Audi. The session was messier for others: Isack Hadjar had laps cancelled and was classified 14th despite flashing top-six pace, Alex Albon never logged a representative time, and Nico Hülkenberg\'s session ended early after a technical problem with his Audi.',
      'One practice session is a small sample, but Leclerc\'s pace at the top of the sheet gives Ferrari a useful marker to build on through FP2, FP3 and qualifying as the team pushes to close out the season with its new package.',
    ],
    related:'f1-austin-fp2-recap',
  },
  {id:'f1-austin-fp2-recap', sport:'f1', cat:'recap',
    headline:'Leclerc Doubles Up, Tops FP2 as Well Ahead of Antonelli and Verstappen',

    byline:'Clutch Room F1 Desk', mins:4, time:'Oct 23, 2026',

    body:[
      'Charles Leclerc backed up his morning benchmark with another fastest lap in second practice at the Circuit of the Americas, running 0.042 seconds clear of championship leader Kimi Antonelli to complete a Ferrari-led Friday in Austin. Max Verstappen was third for Red Bull, just under two tenths off the pace.',
      'Lewis Hamilton was fourth in the sister Ferrari and George Russell fifth for Mercedes, with Liam Lawson a notable sixth for Racing Bulls ahead of both McLarens — Lando Norris seventh and Oscar Piastri eighth. Isack Hadjar was ninth, a tidier session than the cancelled laps that limited his FP1.',

  {id:'f1-austin-qualifying-recap', sport:'f1', cat:'recap',
    headline:'Antonelli Grabs Pole in Austin, One Win From the Title',
    dek:'Kimi Antonelli out-qualified both Red Bulls to take his seventh pole of the season at the Circuit of the Americas, with Max Verstappen and Isack Hadjar completing the front three and Lando Norris\' final lap deleted for track limits.',
    byline:'Clutch Room F1 Desk', mins:5, time:'Oct 24, 2026',
    qa:[['What was the qualifying result?','Kimi Antonelli took pole at 1:34.035, with Max Verstappen second (+0.179s) and Red Bull teammate Isack Hadjar third (+0.215s); Charles Leclerc and Lewis Hamilton completed the top five for Ferrari.'],
        ['Any grid penalties to watch for Sunday?','Arvid Lindblad (9th) drops five places for exceeding his engine-component allocation, and Franco Colapinto (14th) drops ten for a new control electronics unit; Gabriel Bortoleto also picked up a power-unit penalty, which promotes both Sergio Perez and Valtteri Bottas a position.']],
    body:[
      'Kimi Antonelli out-qualified both Red Bulls at the Circuit of the Americas, setting a 1:34.035 in Q3 that stood up as pole position even though the Mercedes driver abandoned his final lap. Max Verstappen was second, 0.179 seconds back, with Red Bull teammate Isack Hadjar third at +0.215; Charles Leclerc and Lewis Hamilton completed the top five for Ferrari. It\'s Antonelli\'s seventh pole of the season and his first since Belgium, on a weekend where a win Sunday would be enough to clinch the championship.',
      'The order flipped repeatedly across the hour. Lando Norris had topped Q1 by nearly two tenths over Charles Leclerc, and Max Verstappen led Q2 at 1:34.471. But Norris\' provisional Q3 benchmark was deleted for track limits, dropping him to eighth and promoting McLaren teammate Oscar Piastri to seventh. George Russell, who went first in the Q3 shootout with a 1:34.476, ultimately settled for sixth. "We got pole so we\'ll try to win tomorrow," Antonelli said afterward. "Max has been very quick, and also Isack did an incredible job in qualifying... I\'m happy that we stuck it on pole."',
      'There are grid changes to track before Sunday\'s race. Arvid Lindblad qualified ninth but drops five places for exceeding his permitted internal combustion engine allocation, and Franco Colapinto\'s 14th-place lap is wiped out by a 10-place penalty for a new control electronics unit; Gabriel Bortoleto\'s own power-unit penalty promotes Sergio Perez and Valtteri Bottas a position each at the back of the grid. None of it touches the sharp end, where Antonelli leads the championship by 97 points over Russell heading into a race he can win outright to clinch it.',
    ],
  },

  {id:'nfl-tnf-bucs-cowboys-recap', sport:'nfl', cat:'recap',
    headline:'Undrafted Rookie Jalon Daniels Outduels Dak Prescott as Bucs Stun Cowboys 24-16',
    dek:'A double-digit home favorite with a defense that still hasn\'t forced a single interception, Dallas got exactly the kind of result that stat predicted — a 24-16 loss to a winless Tampa Bay team starting a rookie making his second career start.',
    byline:'Clutch Room NFL Desk', mins:5, time:'Oct 9, 2026',
    qa:[['What was the final score?','Buccaneers 24, Cowboys 16, Thursday Night Football at AT&T Stadium.'],
        ['Who started at quarterback for Tampa Bay?','Undrafted rookie Jalon Daniels made his second career start in place of the injured Baker Mayfield, and outplayed Dak Prescott.']],
    body:[
      'The number everyone flagged before kickoff turned out to be the whole story. Dallas came in having forced zero interceptions through four games — the only defense in the league without one — and a winless Tampa Bay team starting an undrafted rookie quarterback took full advantage, winning 24-16 to pick up its first victory of the season.',
      'Jalon Daniels, making just his second career start for the injured Baker Mayfield, outplayed Dak Prescott on the night that mattered most for his own team. Dallas\'s offense, which came in scoring at a near-top-of-the-league rate, couldn\'t out-score a defense that entered the week ranked fourth overall — exactly the matchup that made Dallas\'s double-digit opening line look shaky to begin with.',
      'It\'s Dallas\'s second loss in three games and drops them to 2-3, while Tampa Bay climbs off the bottom of the standings to 1-4. For a Cowboys defense that still hasn\'t taken the ball away all season, Thursday was the data point that finally showed up on the scoreboard instead of just the stat sheet.',
    ],
    pull:'Dallas still hasn\'t forced a single interception all season — and a winless team with a rookie making his second career start beat them anyway.',
  },
  {id:'nfl-week5-sunday-recap', sport:'nfl', cat:'recap',
    headline:'Ravens Erase an Eight-Point Deficit in 40 Seconds, Win in Overtime',
    dek:'Tyler Huntley threw a tying touchdown with 40 seconds left and scored the OT winner himself as Baltimore beat Atlanta 30-23 on a Sunday that also saw the Patriots and Lions post 45-point blowouts.',
    byline:'Clutch Room NFL Desk', mins:4, time:'Oct 12, 2026',
    qa:[['How did the Ravens win?','Down 23-15 with 40 seconds left, Tyler Huntley threw a 7-yard touchdown to Devontez Walker and Derrick Henry ran in the 2-point conversion to force overtime, where Huntley capped a 14-play, 68-yard drive with the winning score.'],
        ['What were the other notable results?','New England routed Las Vegas 45-17, Detroit routed Arizona 45-21, and New York Giants and Washington played to a 27-27 overtime tie.']],
    body:[
      'Baltimore trailed Atlanta 23-15 with 40 seconds on the clock and needed a touchdown and a two-point conversion just to survive. They got both: Tyler Huntley, filling in for the injured Lamar Jackson, found Devontez Walker for a 7-yard score, and Derrick Henry powered in on a direct-snap run to tie it at 23. In overtime, Huntley drove Baltimore 68 yards on 14 plays and finished it himself on a short touchdown run, sealed by a game-ending Kyle Hamilton interception. Huntley\'s final line: 24-of-32 for 201 yards and two touchdowns.',
      'Elsewhere, Sunday had no shortage of lopsided scores: New England beat Las Vegas 45-17, Detroit beat Arizona 45-21, Pittsburgh beat Indianapolis 34-22, and Green Bay beat Chicago 31-7. New York Giants and Washington played to a 27-27 overtime tie, and San Francisco survived Seattle 32-29.',
      'Full board: Jacksonville 19, Philadelphia 17 · Green Bay 31, Chicago 7 · Houston 26, Tennessee 3 · Cincinnati 31, Miami 24 · New England 45, Las Vegas 17 · Minnesota 23, New Orleans 13 · New York Jets 17, Cleveland 12 · Pittsburgh 34, Indianapolis 22 · New York Giants 27, Washington 27 (OT) · Denver 23, Los Angeles Chargers 17 · Detroit 45, Arizona 21 · San Francisco 32, Seattle 29 · Baltimore 30, Atlanta 23 (OT).',
    ],
    related:'nfl-week5-sunday-breakdown',
  },
  {id:'nfl-week5-sunday-breakdown', sport:'nfl', cat:'analysis',
    headline:'Huntley\'s Finest Hour: Inside the Ravens\' Overtime Classic, and What a 45-Point Sunday Says About the Rest of the Field',
    dek:'Baltimore\'s backup quarterback delivered the signature win of his career filling in for an injured Lamar Jackson — and a wild Week 5 Sunday reshuffled more than one division race in the process.',
    byline:'Clutch Room NFL Desk', mins:8, time:'Oct 12, 2026',
    qa:[['What does the Ravens\' win mean for the standings?','It gives Baltimore sole possession of first place in the AFC North at 4-1.'],
        ['Why was Tyler Huntley starting?','Lamar Jackson is out with an ankle injury; Huntley was filling in as Baltimore\'s starter.']],
    body:[
      'Forty seconds. That was the window Tyler Huntley had to save Baltimore\'s Sunday, down 23-15 with the Falcons about to run out the clock on a real upset. He used it as well as a backup quarterback possibly could: a 7-yard strike to Devontez Walker to make it a one-score game, then handing off to Derrick Henry on a direct snap for the two-point conversion that tied it at 23 and sent the game to overtime.',
      'What Huntley did next is the part that turns a nice finish into a signature win. Rather than a quick defensive stand and a short field goal drive, Baltimore methodically marched 68 yards across 14 plays — over seven minutes of game clock — and Huntley finished the drive himself on a short touchdown run. Kyle Hamilton\'s interception on Atlanta\'s ensuing possession made sure it stuck. Huntley\'s final numbers, 24-of-32 for 201 yards and two touchdowns, undersell what the day actually required of him: command of a 14-play game-winning drive with his starting job on the line and his franchise quarterback watching from the sideline with an ankle injury.',
      'The result moves Baltimore to 4-1 and sole possession of first in the AFC North — a division that was expected to be a dogfight all year and now has a clear, if unlikely, pacesetter while its best player is hurt. That\'s the real story underneath the box score: good backup quarterback play is often the difference between a playoff seed and a bad August for a team with real aspirations, and Sunday was the first real evidence Baltimore has that answer covered.',
      'Zoom out from Baltimore and Sunday had a split personality. Four games finished decided by three points or less, including the Ravens\' OT classic and a Giants-Commanders game that went to overtime and still couldn\'t be separated, ending 27-27. But the day was just as defined by its blowouts — New England\'s 45-17 rout of Las Vegas and Detroit\'s 45-21 demolition of Arizona both point to teams rounding into form at exactly the right time of year, five weeks in, with the results now substantial enough to mean something beyond a single Sunday.',
      'None of that changes what will be remembered first from Week 5: a backup quarterback, forty seconds, and a franchise that now has to decide how much of its season plan just got rewritten.',
    ],
    related:'nfl-week5-sunday-recap',
  },
  {id:'nfl-harrison-jr-trade', sport:'nfl', cat:'recap',
    headline:'Texans Land Marvin Harrison Jr. From the Cardinals in the Season\'s First Big Trade',

    byline:'Clutch Room NFL Desk', mins:4, time:'Oct 12, 2026',

        ['Why Houston?','Harrison played at Ohio State with Texans quarterback C.J. Stroud — head coach DeMeco Ryans confirmed the move to reporters Sunday, capping weeks of back-and-forth after an earlier Texans offer was turned down.']],

      'The Texans have made the first significant trade of the season, acquiring Marvin Harrison Jr. from the Cardinals in a deal confirmed by head coach DeMeco Ryans. Houston sends a 2027 second-round pick and a 2027 sixth-round pick to Arizona; the Cardinals send back Harrison and a 2027 seventh-round pick.',

  {id:'nfl-week7-sunday-recap', sport:'nfl', cat:'recap',

    body:[

  {id:'nfl-week7-mnf-recap', sport:'nfl', cat:'recap',
    headline:'49ers Hold Off Commanders Comeback, Win 23-17 to Stay Unbeaten',
    dek:'Christian McCaffrey scored twice and Malik Mustapha\'s fourth-down pass breakup sealed it as San Francisco improved to 6-0, surviving a Washington rally from a 23-3 deficit led by Jayden Daniels.',
    byline:'Clutch Room NFL Desk', mins:5, time:'Oct 20, 2026',
    qa:[['What was the final score?','49ers 23, Commanders 17, on Monday Night Football to close out Week 7.'],
        ['How did Washington get back in it?','Down 23-3, Jayden Daniels threw a touchdown pass to Rachaad White with 9:22 left to cut the lead to 23-17; San Francisco\'s offense slowed in the second half after receiver Mike Evans left the game.']],
    body:[
      'San Francisco came out of the gate scoring touchdowns on each of its first two drives, and Christian McCaffrey\'s second score of the night made it 23-3 late in the third quarter — the kind of lead that looked like it would turn Monday night into a laugher.',
      'Instead, Washington\'s night turned into a scramble on two fronts. Terry McLaurin was carted off with an apparent knee injury in the first half, while San Francisco\'s own offense lost momentum after Mike Evans left the game, opening a window the Commanders used to climb back into it.',
      'Jayden Daniels, who finished without an interception, hit Rachaad White for a touchdown with 9:22 remaining to make it 23-17. Washington got the ball back with a chance to tie or win it, but an intentional grounding penalty on Daniels set the offense back, and Malik Mustapha broke up a fourth-down pass — with a sack on the final snap putting it away for good.',
      'The 49ers move to 6-0 to stay the league\'s last unbeaten team; the Commanders fall to 1-4-1.',
    ],
    pull:'Washington erased a 20-point deficit down to six — but Malik Mustapha\'s fourth-down pass breakup kept the 49ers unbeaten.',
  },
  {id:'nfl-week8-tnf-recap', sport:'nfl', cat:'recap',
    headline:'Cairo Santos\' Career-Long 58-Yarder Holds Off Patriots as Bears Win 30-24',
    dek:'Caleb Williams threw two touchdowns and Luther Burden III caught the go-ahead score, but it took a career-long 58-yard field goal from Cairo Santos and Rome Odunze recovering a late onside kick to put away a Drake Maye rally at Soldier Field.',
    byline:'Clutch Room NFL Desk', mins:4, time:'Oct 22, 2026',

    body:[
      'Caleb Williams threw for 308 yards and two touchdowns — a 24-yarder to Luther Burden III and a 12-yarder to Colston Loveland — as the Bears held off a late push from New England to win 30-24 at Soldier Field. Burden finished as the game\'s leading receiver with 130 yards on four catches.',
      'Drake Maye kept the Patriots in it all night, throwing for 253 yards with a touchdown to Eli Raridon and a 48-yard touchdown catch-and-run to Rhamondre Stevenson right before halftime, plus a rushing score. But a red-zone interception by D\'Marco Jackson set up a Chicago score, and Cairo Santos — who had missed a 53-yard try earlier — answered with a career-long 58-yarder to push the lead to 30-21.',
      'New England cut it back to 30-24 but couldn\'t complete the comeback: Chicago\'s Rome Odunze recovered the Patriots\' last-gasp onside kick to run out the clock. The Bears move to 5-2; New England falls to 4-3.',

  {id:'nfl-week8-seahawks-chiefs-recap', sport:'nfl', cat:'recap',
    headline:'Seahawks Shut Down Mahomes and the Chiefs, Hand Kansas City Its First Loss 20-3',
    dek:'Jaxon Smith-Njigba caught nine passes for 150 yards and a touchdown and Seattle\'s defense limited Kenneth Walker III to 36 yards as the Super Bowl champions ended the Chiefs\' unbeaten start on Sunday Night Football.',
    byline:'Clutch Room NFL Desk', mins:5, time:'Oct 26, 2026',
    qa:[['What was the final score?','Seahawks 20, Chiefs 3, on Sunday Night Football at Lumen Field — Seattle improves to 4-3, Kansas City falls to 5-1.'],
        ['How badly did Seattle contain the Chiefs\' offense?','Kansas City managed just 213 total yards, with Patrick Mahomes throwing for 165 yards and an interception and Kenneth Walker III — who was averaging a league-leading 133 yards per game — held to 36 yards on 14 carries.']],
    body:[
      'Seattle came in off a two-game skid and played like a team with something to prove, handing Kansas City its first loss of the season in a 20-3 defensive statement at Lumen Field. Jaxon Smith-Njigba, the NFL\'s leading receiver, caught nine passes for 150 yards and a touchdown, while Sam Darnold threw for 257 yards and Emanuel Wilson added 100 yards and a score on the ground.',
      'The story of the night was what Seattle\'s defense did to Kansas City\'s offense. Kenneth Walker III — the reigning Super Bowl MVP for the Seahawks before signing with the Chiefs in the offseason, and the league\'s leading rusher coming in at 133 yards per game — was held to just 36 yards on 14 carries. Patrick Mahomes finished 165 passing yards with an interception as Kansas City managed only 213 total yards, 50 of them on the ground. The Seahawks have now gone 36 straight games without allowing a 100-yard rusher, the longest active streak in the league.',
      'Harrison Butker missed two field goals for Kansas City — a 58-yard attempt that fell short as the first half expired and a 45-yarder wide right in the fourth quarter — compounding a night where the only real bright spot was Travis Kelce passing Marvin Harrison and Cris Carter for fifth on the NFL\'s all-time receptions list. "All three phases we struggled, so we\'ve got to do better, and that\'s my responsibility," Chiefs coach Andy Reid said afterward.',
      'For Seattle, it\'s a signature win that head coach Mike Macdonald framed as a reminder rather than a ceiling: "I think this game reminds the guys what we\'re capable of... there\'s more levels to where we can go." The Chiefs travel to Denver next; the Seahawks host Chicago on Monday, November 2.',
    ],
    pull:'Seattle\'s defense didn\'t just beat the Chiefs — it held the NFL\'s leading rusher to 36 yards and Mahomes to a near-career-low night.',
  },

  {id:'pak-sl-2nd-t20i-recap', sport:'cricket', cat:'recap',
    headline:'Sadaqat\'s 96 Powers Pakistan to 215, Sri Lanka Crushed by 82 Runs',
    dek:'Maaz Sadaqat and Sahibzada Farhan put on a batting clinic in Rawalpindi as Pakistan posted 215/3 and bowled Sri Lanka out for 133, taking an unassailable 2-0 series lead.',
    byline:'Clutch Room Cricket Desk', mins:4, time:'Oct 12, 2026',
    qa:[['What was the final score?','Pakistan 215/3 beat Sri Lanka 133/7 by 82 runs.'],

    body:[
      'Pakistan have taken a 2-0 series lead over Sri Lanka after a dominant 82-run win in the 2nd T20I at Rawalpindi, built on a 215/3 total that leaned almost entirely on two batters. Maaz Sadaqat made 96 off 51 balls, with seven sixes, and was named Player of the Match; captain Sahibzada Farhan added 73 off 44.',
      'Sri Lanka never recovered. Mohammad Imran took 3/11 in four tight overs, and the chase fell apart to 133/7, with only Maheesh Theekshana (32* off 26) offering real resistance in a losing cause.',

  {id:'pak-sl-2nd-t20i-breakdown', sport:'cricket', cat:'analysis',
    headline:'Breaking Down Sadaqat\'s 96: How Pakistan Posted Their Highest T20I Total on Home Soil',
    dek:'A full statistical look at the innings that put the series away — the batting that built 215/3, the bowling discipline that made it unreachable, and what it means with one match left.',
    byline:'Clutch Room Cricket Desk', mins:7, time:'Oct 12, 2026',
    qa:[['What made Pakistan\'s total so imposing?','215/3 was built on a 51-ball 96 from Maaz Sadaqat (6 fours, 7 sixes, strike rate 188.2) and a 44-ball 73 from captain Sahibzada Farhan — the two put together the bulk of the total before either fell.'],
        ['How did Sri Lanka\'s chase fall apart?','Mohammad Imran removed Kusal Mendis, Sahan Arachchige and Sineth Jayawardena inside an economical 4-0-11-3 spell, and only Maheesh Theekshana\'s unbeaten 32 kept the margin from being even heavier.']],
    body:[
      'Pakistan\'s 215/3 is their highest T20I total on home soil, and the scorecard shows exactly how it was built: Fakhar Zaman got the innings moving with 22 off 17, but the platform really came from Sahibzada Farhan and Maaz Sadaqat, who combined for 169 of Pakistan\'s 215 runs. Farhan\'s 73 came off 44 balls with 4 fours and 5 sixes before he was caught off Dasun Shanaka\'s bowling; Sadaqat kept going well past that, eventually caught in the 19th over for 96 off just 51 balls — 6 fours and 7 sixes, a strike rate of 188.2 that earned him the Player of the Match award. Hasan Nawaz\'s unbeaten 19 off 9 at the death was almost an afterthought by comparison.',
      'What made the total genuinely out of reach wasn\'t just the runs — it was how little margin for error Pakistan\'s bowlers then gave Sri Lanka. Mohammad Imran was the standout, going for just 11 runs in his full four overs while taking 3 wickets, an economy rate of 2.75 in a format where anything under six is considered tight. He accounted for Kusal Mendis, Sahan Arachchige and Sineth Jayawardena — three of the top order gone cheaply against a bowler who simply didn\'t offer anything to hit.',
      'Sri Lanka\'s innings had one genuine bright spot: Maheesh Theekshana\'s unbeaten 32 off 26 at the bottom of the order, the only Sri Lankan batter to pass 30. Everyone above him managed at most 29 (Chamindu Wickramasinghe), and the middle order collapsed around Imran\'s opening burst — Sahan Arachchige was out for a golden duck, caught off the very delivery that started his innings.',
      'With the series already secured 2-0, Tuesday\'s third T20I at the same Rawalpindi venue is a dead rubber on the scoreboard but not necessarily in substance — it\'s the last chance for Sri Lanka\'s middle order to find answers before the tour moves into ODIs, and the last data point before Pakistan\'s selectors have to decide whether Sadaqat\'s breakout innings earns him a longer run in the XI.',
    ],
    related:'pak-sl-2nd-t20i-recap',
  },
  {id:'pak-sl-3rd-t20i-recap', sport:'cricket', cat:'recap',
    headline:'Mendis\' 87 Hands Sri Lanka a Consolation Win as Pakistan Take the Series 2-1',
    dek:'Kusal Mendis blazed an unbeaten 87 off 48 to chase down Pakistan\'s 168/8 with 17 balls to spare in the dead-rubber finale at Rawalpindi, denying the hosts a clean sweep.',
    byline:'Clutch Room Cricket Desk', mins:4, time:'Oct 13, 2026',
    qa:[['What was the final score?','Sri Lanka 172/2 beat Pakistan 168/8 by 8 wickets, with 17 balls remaining.'],
        ['Who starred for either side?','Kusal Mendis made an unbeaten 87 off 48 for Sri Lanka; Sahibzada Farhan top-scored for Pakistan with 76, and Dasun Shanaka took 3/21.']],
    body:[
      'Pakistan\'s bid for a clean sweep fell short in Rawalpindi as Sri Lanka ran down 168/8 with eight wickets and 17 balls to spare, Kusal Mendis leading the chase with an unbeaten 87 off just 48 balls.',
      'Sahibzada Farhan had given the hosts something to defend, top-scoring with 76, but Dasun Shanaka\'s 3/21 kept Pakistan below 170 on a ground that had produced 215 just two days earlier. It proved well short once Mendis found his range.',
      'The result means Sri Lanka become the first side to beat Pakistan in five T20Is on home soil, even as Pakistan close out the series 2-1 on the back of the first two games. The tour now shifts to the ODI leg.',

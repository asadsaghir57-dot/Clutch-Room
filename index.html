<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clutch Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF;
  --paper-raised:#F7F7F5;
  --ink:#121212;
  --ink-muted:#6B6A66;
  --line:#E3E2DD;
  --court:#B3261E;
  --court-soft:#F7E3E1;
  --clay:#7A2E22;
  --clay-soft:#EFE0DB;
  --gold:#96722A;
  --gold-soft:#F1E7D1;
  --away:#0A0A0A;
  --away-soft:#EAE9E6;
  --live:#B3261E;
  --shadow: 0 1px 0 rgba(18,18,18,0.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121110;
    --paper-raised:#1A1917;
    --ink:#F2F1EE;
    --ink-muted:#9F9D97;
    --line:#2B2A26;
    --court:#E2453B;
    --court-soft:#361E1A;
    --clay:#C96B57;
    --clay-soft:#301F19;
    --gold:#D1A851;
    --gold-soft:#302811;
    --away:#F6F5F1;
    --away-soft:#242320;
    --live:#E2453B;
    --shadow: 0 1px 0 rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --paper:#121110;
  --paper-raised:#1A1917;
  --ink:#F2F1EE;
  --ink-muted:#9F9D97;
  --line:#2B2A26;
  --court:#E2453B;
  --court-soft:#361E1A;
  --clay:#C96B57;
  --clay-soft:#301F19;
  --gold:#D1A851;
  --gold-soft:#302811;
  --away:#F6F5F1;
  --away-soft:#242320;
  --live:#E2453B;
  --shadow: 0 1px 0 rgba(0,0,0,0.4);
}

*{box-sizing:border-box;}
html{text-size-adjust:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Source Serif 4', Georgia, 'Times New Roman', serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
h1,h2,h3,.disp{
  font-family:'Anton', 'Arial Narrow', sans-serif;
  text-transform:uppercase;
  letter-spacing:0.01em;
  font-weight:400;
  text-wrap:balance;
  line-height:1.02;
  margin:0;
}
.mono{font-family:'JetBrains Mono', ui-monospace, Menlo, monospace;}
.tnum{font-variant-numeric:tabular-nums;}

/* ---------- layout shell ---------- */
#app{min-height:100%;}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px;}

/* ---------- masthead ---------- */
.masthead{position:relative;background:var(--paper);border-bottom:1px solid var(--line);}
.masthead-top{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:17px 20px;}
.logo{font-size:29px;display:flex;align-items:baseline;gap:7px;white-space:nowrap;letter-spacing:-0.01em;}
.logo .dot{color:var(--clay);}
.nav{display:flex;gap:2px;flex-wrap:wrap;align-items:center;}
.nav a{
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;
  padding:10px 14px;border-radius:5px;color:var(--ink-muted);position:relative;transition:color .12s ease;
}
.nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2px;border-radius:2px;background:var(--accent,var(--court));transform:scaleX(0);transition:transform .15s ease;transform-origin:left;}
.nav a:hover{color:var(--ink);}
.nav a:hover::after{transform:scaleX(1);}
.nav a.active{color:var(--ink);font-weight:700;}
.nav a.active::after{transform:scaleX(1);}
.nav a:focus-visible{outline:2px solid var(--court);outline-offset:1px;}
.nav-more{position:relative;}
.nav-more>a{display:inline-flex;align-items:center;gap:4px;}
.nav-more .chev{display:inline-block;font-size:9px;transition:transform .15s ease;}
.nav-more:hover .chev,.nav-more:focus-within .chev{transform:rotate(180deg);}
.nav-more-list{display:none;position:absolute;right:0;top:100%;margin-top:6px;background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 28px rgba(20,24,28,0.14);padding:6px;min-width:172px;z-index:20;}
.nav-more:hover .nav-more-list,.nav-more:focus-within .nav-more-list{display:block;}
.nav-more-list a{display:block;border-radius:5px;}
.nav-more-list a::after{display:none;}
.nav-more-list a:hover{background:var(--paper);}
.nav-divider{width:1px;height:20px;background:var(--line);margin:0 2px;}
.nav-icons{display:flex;align-items:center;gap:2px;}
.nav-icons .icon-btn{color:var(--ink-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;width:34px;height:34px;border-radius:50%;transition:background .12s ease,color .12s ease;}
.nav-icons .icon-btn:hover{color:var(--ink);background:var(--paper-raised);}

/* ---------- row 1: scoreboard strip ---------- */
.scorebar{background:var(--paper-raised);border-bottom:1px solid var(--line);}
.scorebar-inner{display:flex;align-items:stretch;min-height:50px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.scorebar-inner::-webkit-scrollbar{height:0;}
.scorebar-select-wrap{flex:none;border-right:1px solid var(--line);display:flex;align-items:center;}
.scorebar-select{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.03em;color:var(--ink);background-color:transparent;border:none;padding:9px 26px 9px 16px;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-muted) 50%),linear-gradient(135deg,var(--ink-muted) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
.scorebar-context{flex:none;display:flex;align-items:center;padding:0 16px;border-right:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.08em;color:var(--ink-muted);white-space:nowrap;}
.scorebar-games{flex:1;display:flex;}
.scorebar-empty{padding:0 18px;display:flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-muted);white-space:nowrap;}
.game-card{flex:0 0 auto;min-width:172px;border-right:1px solid var(--line);padding:7px 16px;display:flex;flex-direction:column;justify-content:center;gap:4px;}
.game-status{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-muted);}
.game-status.live{color:var(--live);}
.game-status.live::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--live);margin-right:5px;animation:pulse 1.3s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:0.5;}50%{opacity:1;}}
@media (prefers-reduced-motion: reduce){.game-status.live::before{animation:none;}}
.game-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.team{display:flex;align-items:center;gap:6px;min-width:0;}
.team-abbr{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;}
.team-record{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink-muted);}
.team-score{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;}
.scorebar-updated{flex:none;display:flex;align-items:center;padding:0 16px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-muted);white-space:nowrap;border-left:1px solid var(--line);font-variant-numeric:tabular-nums;}
.scorebar-full{flex:none;display:flex;align-items:center;padding:0 18px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--court);white-space:nowrap;border-left:1px solid var(--line);}

/* ---------- live tracker (db-backed, updates without a republish) ---------- */
.live-tracker{background:var(--ink);border-bottom:1px solid var(--line);}
.live-tracker-inner{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;overflow-x:auto;}
.lt-label{flex:none;display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#EDEDE8;}
.lt-label .dot{width:6px;height:6px;border-radius:50%;background:var(--court);animation:pulse 1.3s ease-in-out infinite;}
@media (prefers-reduced-motion: reduce){.lt-label .dot{animation:none;}}
.lt-card{flex:none;display:flex;align-items:center;gap:10px;background:#1A1917;border:1px solid #2B2A26;border-radius:999px;padding:7px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#EDEDE8;white-space:nowrap;text-decoration:none;transition:border-color .15s ease;}
.lt-card:hover{border-color:var(--court);}
.lt-card .st{font-weight:700;letter-spacing:0.05em;font-size:10px;padding:2px 7px;border-radius:3px;}
.lt-card .st.live{background:var(--court);color:#fff;}
.lt-card .st.upcoming{background:#2B2A26;color:#9F9D97;}
.lt-card .st.final{background:#2B2A26;color:#D1A851;}
.lt-card .score{font-weight:700;}
.lt-card .ago{color:#8A8F86;font-size:10.5px;}

/* ---------- row 3: contextual sub-nav ---------- */
.subnav{background:var(--paper);border-bottom:2px solid var(--accent,var(--court));}
.subnav-inner{display:flex;align-items:center;gap:22px;padding:0 20px;overflow-x:auto;max-width:1180px;margin:0 auto;}
.subnav-id{display:flex;align-items:center;gap:8px;padding:10px 0;flex:none;}
.subnav-id .mono-badge{width:22px;height:22px;border-radius:4px;background:var(--accent,var(--court));color:#fff;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;flex:none;}
.subnav-id .sp-name{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:16px;white-space:nowrap;}
.subtab{flex:none;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;color:var(--ink-muted);padding:13px 0;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap;}
.subtab:hover{color:var(--ink);}
.subtab.active{color:var(--ink);border-color:var(--accent,var(--court));}
.subtab.disabled{opacity:0.4;cursor:default;}

/* ---------- pills / tags ---------- */
.pill{
  display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;
  font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;line-height:1.5;
}
.pill-recap{background:var(--court-soft);color:var(--court);}
.pill-preview{background:var(--away-soft);color:var(--away);}
.pill-injury{background:var(--clay-soft);color:var(--clay);}
.pill-debate{background:var(--gold-soft);color:var(--gold);}
.pill-analysis{background:var(--ink);color:var(--paper);}
.chip{
  font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;letter-spacing:0.03em;
  padding:6px 11px;border:1px solid var(--line);border-radius:999px;color:var(--ink-muted);background:var(--paper-raised);
  cursor:pointer;transition:border-color .12s ease,color .12s ease;
}
.chip:hover{color:var(--ink);}
.chip.on{color:var(--ink);border-color:var(--accent,currentColor);background:color-mix(in srgb, var(--accent,var(--court)) 10%, var(--paper-raised));}
.fixtures-fallback{display:none;font-family:'JetBrains Mono',monospace;color:var(--ink-muted);font-size:12.5px;margin-top:12px;line-height:1.6;}

/* ---------- home hero ---------- */
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;padding:32px 0 10px;}
.hero-main{border:1px solid var(--line);background:var(--paper-raised);border-radius:6px;padding:28px;box-shadow:var(--shadow);}
.hero-kicker{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.1em;color:var(--court);text-transform:uppercase;margin-bottom:12px;display:block;}
.hero-main h1{font-size:44px;margin:0 0 14px;}
.hero-dek{font-size:18px;line-height:1.5;color:var(--ink-muted);font-style:italic;max-width:62ch;}
.hero-meta{margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-muted);}

.take-widget{border:1px solid var(--line);background:var(--paper-raised);border-radius:6px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;}
.take-widget h2{font-size:17px;margin-bottom:14px;}
.take-row{display:flex;flex-direction:column;gap:10px;flex:1;}
.take-side{border-left:3px solid var(--line);padding:4px 0 4px 12px;}
.take-side.for{border-color:var(--court);}
.take-side.against{border-color:var(--clay);}
.take-side .who{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-muted);display:block;margin-bottom:3px;}
.take-side p{margin:0;font-size:14.5px;line-height:1.45;}

/* ---------- bento grid (homepage) ---------- */
.bento-head{display:flex;align-items:baseline;justify-content:space-between;margin:40px 0 14px;}
.bento-head h2{font-size:20px;}
.bento-head .sub{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-muted);}
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.b-tile{border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);min-height:150px;position:relative;}
.b-tile.b-2{grid-column:span 2;}
.b-tile:not(.b-quote):not(.b-quiet){background:color-mix(in srgb, var(--accent, var(--court)) var(--tint,10%), var(--paper-raised));transition:background .15s ease, transform .15s ease;}
.b-tile:not(.b-quote):not(.b-quiet):hover{background:color-mix(in srgb, var(--accent, var(--court)) calc(var(--tint,10%) + 10%), var(--paper-raised));transform:translateY(-2px);}
.b-icon{width:30px;height:30px;color:var(--accent,var(--ink));flex:none;}
.b-tile .b-name{font-size:30px;color:var(--accent,var(--ink));}
.b-tile.b-2 .b-name{font-size:40px;}
.b-tile .b-status{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--ink-muted);letter-spacing:0.02em;}
.b-tile .b-peek{font-size:13.5px;color:var(--ink-muted);margin-top:auto;padding-top:10px;border-top:1px solid color-mix(in srgb, var(--accent,var(--court)) 25%, var(--line));}
.b-tile .b-go{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.04em;color:var(--accent,var(--court));position:absolute;top:22px;right:22px;}
.b-tile.b-live{border-color:var(--live);}
.b-live-badge{display:inline-flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.06em;color:var(--live);align-self:flex-start;}
.b-live-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--live);margin-right:6px;animation:pulse 1.3s ease-in-out infinite;}
@media (prefers-reduced-motion: reduce){.b-live-badge .dot{animation:none;}}
.b-tile.b-quote{background:#121212;color:#EDEDE8;border-color:#121212;}
.b-tile.b-quote .b-q-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#D1A851;}
.b-tile.b-quote .b-q-text{font-size:16px;line-height:1.4;font-style:italic;}
.b-tile.b-quote .b-q-who{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9F9D97;margin-top:auto;padding-top:10px;border-top:1px solid #2B2A26;}
.b-tile.b-quote .b-q-link{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;color:#D1A851;align-self:flex-start;}
.b-tile.b-quiet{background:var(--paper-raised);}
.b-tile.b-quiet .b-quiet-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-muted);}
.b-quiet-row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);}
.b-quiet-row:last-child{border-bottom:none;}
.b-quiet-row .nm{font-size:14px;font-weight:600;}
.b-quiet-row .st{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink-muted);}
@media (max-width:760px){.bento{grid-template-columns:repeat(2,1fr);}.b-tile.b-2{grid-column:span 2;}}

/* ---------- priority board ---------- */
.board-head{display:flex;align-items:baseline;justify-content:space-between;margin:38px 0 4px;border-bottom:2px solid var(--ink);padding-bottom:8px;}
.board-head h2{font-size:20px;}
.board-head .sub{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-muted);}
.board{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper-raised);}
.board-row{display:grid;grid-template-columns:34px 70px 1fr auto;align-items:center;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line);border-left:5px solid var(--accent,var(--court));background:color-mix(in srgb, var(--accent, var(--court)) var(--tint,6%), var(--paper-raised));transition:background .15s ease;}
.board-row:last-child{border-bottom:none;}
.board-row:hover{background:color-mix(in srgb, var(--accent, var(--court)) calc(var(--tint,6%) + 8%), var(--paper-raised));}
.board-row.tier-1{--tint:20%;padding:26px 24px;}
.board-row.tier-2{--tint:12%;padding:22px 22px;}
.board-row.tier-3{--tint:7%;}
.board-row .rank{font-family:'JetBrains Mono',monospace;color:var(--ink-muted);font-size:12px;font-weight:700;}
.board-row .name-wrap{display:flex;flex-direction:column;gap:3px;min-width:0;}
.board-row .status{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-muted);letter-spacing:0.03em;font-weight:600;}
.board-row .peek{font-size:13.5px;color:var(--ink-muted);margin-top:2px;}
.board-row .go{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;color:var(--accent,var(--court));white-space:nowrap;background:var(--paper);padding:7px 14px;border-radius:999px;border:1px solid var(--accent,var(--court));}
a.board-row{display:grid;}
.board-row.tier-1 .sport-name{font-size:42px;color:var(--accent,var(--ink));}
.board-row.tier-2 .sport-name{font-size:30px;}
.board-row.tier-3 .sport-name{font-size:21px;}
.heatmeter{display:flex;gap:2px;align-items:center;}
.heatmeter i{width:5px;height:14px;border-radius:1px;background:var(--line);display:block;}
.heatmeter i.on{background:var(--accent,var(--clay));}

.quiet-strip{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 6px;}
.quiet-chip{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:10px 14px;background:var(--paper-raised);flex:1 1 220px;}
.quiet-chip .status{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-muted);letter-spacing:0.03em;}

/* ---------- insider wire ---------- */
.wire{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;margin-top:14px;scroll-snap-type:x proximity;}
.wire::-webkit-scrollbar{height:6px;}
.wire::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.wire-card{flex:0 0 280px;scroll-snap-align:start;border:1px solid var(--line);border-radius:6px;background:var(--paper-raised);padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
.wire-top{display:flex;align-items:center;justify-content:space-between;}
.wire-team{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink);}
.wire-time{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-muted);}
.wire-note{font-size:14px;line-height:1.45;}
.wire-src{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-muted);display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:8px;margin-top:2px;}
.wire-src b{color:var(--ink);font-weight:700;}
.wire-src .src-link{color:var(--court);font-weight:600;}

/* ---------- hub ---------- */
.hub-head{padding:30px 0 20px;border-bottom:1px solid var(--line);}
.hub-head .hub-status{display:flex;align-items:center;gap:10px;margin-top:10px;}
.hub-head h1{font-size:50px;color:var(--accent,var(--ink));}
.league-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}

.rail-head{display:flex;align-items:baseline;gap:12px;margin:34px 0 14px;}
.rail-head h3{font-size:19px;}
.rail-head .pill{position:relative;top:-2px;}
.rail{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity;}
.rail::-webkit-scrollbar{height:6px;}
.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.card{
  flex:0 0 300px;scroll-snap-align:start;border:1px solid var(--line);border-radius:6px;background:var(--paper-raised);
  padding:16px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow);
}
.card h4{font-family:'Anton',sans-serif;text-transform:none;letter-spacing:0;font-size:18px;line-height:1.18;font-weight:400;}
.card p{font-size:13.5px;line-height:1.45;color:var(--ink-muted);margin:0;}
.card .meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-muted);display:flex;gap:8px;margin-top:auto;}

/* ---------- sports news (long-form) ---------- */
.sn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding:36px 0 60px;}
.sn-card{
  border:1px solid var(--line);border-radius:10px;background:var(--paper-raised);
  padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);
  transition:border-color .15s ease,transform .15s ease;
}
.sn-card:hover{border-color:var(--accent,var(--court));transform:translateY(-2px);}
.sn-card-top{display:flex;align-items:center;gap:10px;}
.sn-card-sport{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--accent,var(--court));}
.sn-card h3{font-family:'Anton',sans-serif;text-transform:none;letter-spacing:0;font-size:24px;line-height:1.15;font-weight:400;}
.sn-card p{font-size:14.5px;line-height:1.5;color:var(--ink-muted);margin:0;}
.sn-card .meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-muted);display:flex;gap:8px;margin-top:auto;}
.sn-empty{padding:60px 0;text-align:center;color:var(--ink-muted);border-top:1px solid var(--line);}
@media (max-width:760px){.sn-grid{grid-template-columns:1fr;}}

/* ---------- placeholder hub ---------- */
.ph-skel{border:1px dashed var(--line);border-radius:6px;padding:30px;margin-top:28px;text-align:center;color:var(--ink-muted);}
.ph-skel .disp{font-size:26px;color:var(--ink);margin-bottom:8px;}
.ph-cats{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}

/* ---------- article ---------- */
.breadcrumb{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-muted);padding:22px 0 0;}
.breadcrumb a:hover{color:var(--ink);text-decoration:underline;}
.article-head{padding:14px 0 28px;border-bottom:1px solid var(--line);}
.article-head h1{font-size:38px;margin:14px 0 12px;max-width:26ch;}
.article-dek{font-size:19px;font-style:italic;color:var(--ink-muted);max-width:60ch;line-height:1.5;}
.byline{margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.byline .prov{background:var(--court-soft);color:var(--court);padding:3px 8px;border-radius:3px;font-weight:600;}

.article-body{display:grid;grid-template-columns:1fr 280px;gap:40px;padding:28px 0 60px;align-items:start;}
.prose{font-size:17.5px;line-height:1.7;max-width:66ch;}
.prose p{margin:0 0 18px;}
.prose p:first-of-type::first-letter{
  font-family:'Anton',sans-serif;font-size:54px;float:left;line-height:0.78;padding:6px 8px 0 0;color:var(--accent,var(--court));
}
.qa{background:var(--paper-raised);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:26px;}
.qa .label{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:10px;display:block;}
.qa dt{font-weight:600;font-size:14.5px;margin-top:10px;}
.qa dt:first-of-type{margin-top:0;}
.qa dd{margin:3px 0 0;font-size:14.5px;color:var(--ink-muted);}
.qa dl{margin:0;}

.pullquote{border-left:3px solid var(--accent,var(--court));margin:26px 0;padding:2px 0 2px 20px;font-size:21px;line-height:1.4;font-style:italic;}
.related-callout{display:block;margin:30px 0 10px;padding:18px 20px;border:1px solid var(--line);border-radius:8px;background:var(--paper-raised);text-decoration:none;transition:border-color .15s ease;}
.related-callout:hover{border-color:var(--accent,var(--court));}
.related-callout .rc-label{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--accent,var(--court));margin-bottom:6px;}
.related-callout .rc-headline{display:block;font-family:'Anton',sans-serif;font-size:17px;color:var(--ink);}

.takes{display:flex;flex-direction:column;gap:14px;margin:26px 0;}
.take-card{border-radius:6px;padding:16px 18px;border:1px solid var(--line);}
.take-card.for{background:var(--court-soft);border-color:var(--court);}
.take-card.against{background:var(--clay-soft);border-color:var(--clay);}
.take-card .who{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;display:block;margin-bottom:6px;}
.take-card.for .who{color:var(--court);}
.take-card.against .who{color:var(--clay);}
.take-card p{margin:0;font-size:15.5px;line-height:1.5;}

.sidebar{display:flex;flex-direction:column;gap:18px;position:sticky;top:20px;}
.box{border:1px solid var(--line);border-radius:6px;background:var(--paper-raised);padding:16px 18px;}
.box h5{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 12px;}
.odds-row{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);}
.odds-row:last-child{border-bottom:none;}
.odds-row .line{color:var(--ink-muted);font-weight:600;}
.injury-item{padding:9px 0;border-bottom:1px solid var(--line);}
.injury-item:last-child{border-bottom:none;}
.injury-item .nm{font-weight:600;font-size:14px;}
.injury-item .st{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.04em;text-transform:uppercase;color:var(--clay);display:block;margin-top:1px;}
.injury-item .dt{font-size:12.5px;color:var(--ink-muted);margin-top:3px;}


/* ---------- MLB "Baseball Edition" hub ---------- */
.mlb-page{background:#0A0C0B;color:#EDEDE8;}
.mlb-progress{position:fixed;top:0;left:0;height:3px;background:#D1A851;z-index:50;width:0%;transition:width .1s linear;}
.mlb-nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid #22251F;max-width:1180px;margin:0 auto;}
.mlb-nav .mlb-logo{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:0.04em;color:#EDEDE8;}
.mlb-nav .mlb-links{display:flex;gap:26px;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.08em;color:#8A8F86;text-transform:uppercase;}
.mlb-nav .mlb-links a:hover{color:#EDEDE8;}
.mlb-hero{position:relative;min-height:380px;display:flex;align-items:center;padding:60px 0;overflow:hidden;max-width:1180px;margin:0 auto;}
.mlb-ghost{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Anton',sans-serif;font-size:clamp(90px,16vw,220px);color:transparent;-webkit-text-stroke:1px #2A2D26;letter-spacing:0.02em;white-space:nowrap;pointer-events:none;z-index:0;}
.mlb-hero-content{position:relative;z-index:1;max-width:760px;}
.mlb-hero-content .eyebrow{font-family:'JetBrains Mono',monospace;color:#D1A851;font-size:12px;font-weight:700;letter-spacing:0.12em;}
.mlb-hero-content h1{font-family:'Anton',sans-serif;font-size:clamp(32px,5vw,54px);color:#EDEDE8;margin:14px 0;text-transform:uppercase;line-height:1.05;}
.mlb-hero-content p{font-size:16px;color:#AEB3A8;line-height:1.6;max-width:56ch;}
.mlb-pins{position:relative;max-width:1180px;margin:0 auto;height:120px;}
.mlb-pin{position:absolute;display:flex;flex-direction:column;align-items:center;gap:0;}
.mlb-pin .circle{width:92px;height:92px;border-radius:50%;border:1px solid #D1A851;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;color:#D1A851;letter-spacing:0.03em;padding:6px;background:#0A0C0B;}
.mlb-pin .leader{width:1px;height:38px;background:#2A2D26;margin-top:0;}
.mlb-stat-line{font-family:'Anton',sans-serif;font-size:clamp(20px,3vw,34px);text-transform:uppercase;color:#EDEDE8;text-align:center;max-width:820px;margin:10px auto 50px;line-height:1.3;}
.mlb-stat-line b{color:#D1A851;}
.mlb-section{max-width:1180px;margin:0 auto;padding:10px 0 50px;position:relative;z-index:1;}
.mlb-section .rail-head h3,.mlb-section .board-head h2{color:#EDEDE8;}
.mlb-section .card{background:#13150F;border-color:#22251F;}
.mlb-section .card h4{color:#EDEDE8;}
.mlb-section .pill-recap{background:rgba(209,168,81,0.14);color:#D1A851;}
.mlb-section .pill-preview{background:rgba(237,237,232,0.08);color:#C7C5BE;}
.mlb-section .pill-injury{background:rgba(201,107,87,0.14);color:#C96B57;}

/* ---------- F1 page ---------- */
.f1-page{background:#FAFAF8;}
.f1-topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid #E4E4DF;max-width:1180px;margin:0 auto;}
.f1-topbar .f1-logo{font-family:'Anton',sans-serif;font-size:19px;letter-spacing:0.03em;color:#0B0B0B;text-transform:uppercase;}
.f1-topbar .f1-store{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.08em;color:#0B0B0B;text-transform:uppercase;}
.f1-track-wrap{max-width:1180px;margin:0 auto;padding:50px 0 20px;display:flex;justify-content:center;}
.f1-next{max-width:1180px;margin:0 auto;padding:0 0 50px;}
.f1-next .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;letter-spacing:0.1em;color:#8A8F86;text-transform:uppercase;}
.f1-next h1{font-family:'Anton',sans-serif;font-size:clamp(34px,5.5vw,58px);color:#0B0B0B;text-transform:uppercase;margin:8px 0 24px;}
.f1-countdown{display:flex;gap:30px;margin-bottom:26px;}
.f1-countdown .unit{text-align:left;}
.f1-countdown .num{font-family:'JetBrains Mono',monospace;font-size:clamp(34px,6vw,64px);font-weight:700;color:#0B0B0B;font-variant-numeric:tabular-nums;line-height:1;}
.f1-countdown .lbl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:#8A8F86;text-transform:uppercase;margin-top:4px;}
.f1-next p{font-size:15px;color:#4A4E47;max-width:62ch;line-height:1.6;margin-bottom:26px;}
.f1-pill-btn{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;background:#0B0B0B;color:#fff;padding:14px 24px;}

.f1-dark{background:#0B0B0B;color:#F2F2EC;position:relative;overflow:hidden;}
.f1-grid-lines{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg, rgba(242,242,236,0.06) 0, rgba(242,242,236,0.06) 1px, transparent 1px, transparent 160px);pointer-events:none;z-index:0;}
.f1-helmet-section{position:relative;max-width:1180px;margin:0 auto;padding:90px 0;min-height:70vh;display:flex;align-items:center;justify-content:center;z-index:1;}
.f1-helmet-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:30px;width:100%;}
.f1-helmet-stats{display:flex;flex-direction:column;gap:26px;}
.f1-helmet-stats.right{align-items:flex-end;text-align:right;}
.f1-helmet-stats .n{font-family:'Anton',sans-serif;font-size:36px;color:#F2F2EC;}
.f1-helmet-stats .l{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9A9D94;letter-spacing:0.05em;text-transform:uppercase;margin-top:2px;}
.f1-helmet-svg{filter:drop-shadow(0 20px 40px rgba(0,0,0,0.5));will-change:transform;}
.f1-quote{text-align:center;font-family:'Anton',sans-serif;font-size:clamp(18px,2.6vw,30px);line-height:1.35;max-width:820px;margin:60px auto 0;text-transform:uppercase;color:#D8D8CE;position:relative;z-index:1;}
.f1-quote b{color:#D1A851;}

.f1-schedule{max-width:1180px;margin:0 auto;padding:60px 0;}
.f1-schedule-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
.f1-schedule-head h2{font-family:'Anton',sans-serif;font-size:26px;text-transform:uppercase;color:#0B0B0B;}
.f1-tabs{display:flex;gap:18px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;}
.f1-tabs span{color:#8A8F86;padding-bottom:4px;}
.f1-tabs span.on{color:#0B0B0B;border-bottom:2px solid #0B0B0B;}
.f1-row{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid #E4E4DF;font-family:'JetBrains Mono',monospace;}
.f1-row .s{font-weight:700;letter-spacing:0.04em;text-transform:uppercase;font-size:13px;color:#0B0B0B;}
.f1-row .t{font-size:13px;color:#4A4E47;}

.f1-result-item{border-bottom:1px solid #E4E4DF;}
.f1-result-item summary{list-style:none;cursor:pointer;}
.f1-result-item summary::-webkit-details-marker{display:none;}
.f1-result-row{display:grid;grid-template-columns:18px 40px 1fr 170px 110px;gap:10px;padding:11px 0;font-family:'JetBrains Mono',monospace;font-size:12.5px;align-items:baseline;}
.f1-result-row::before{content:"▸";color:#8A8F86;transition:transform .15s ease;align-self:center;}
.f1-result-item[open] .f1-result-row::before{transform:rotate(90deg);}
.f1-result-row .rnd{font-weight:700;color:#8A8F86;}
.f1-result-row .gp{color:#0B0B0B;font-weight:600;}
.f1-result-row .win{color:#0B0B0B;}
.f1-result-row .win .note{color:#C76B1E;font-size:10.5px;margin-left:5px;}
.f1-result-row .tm{color:#4A4E47;text-align:right;}
.f1-podium{padding:2px 0 14px 68px;display:flex;flex-direction:column;gap:5px;}
.f1-podium-row{display:flex;gap:14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#4A4E47;}
.f1-podium-row .p{font-weight:700;width:22px;}
.f1-podium-row .p1{color:#9C7A2E;}
.f1-podium-row .d{color:#0B0B0B;font-weight:600;width:130px;}
.f1-podium-row .t{color:#6B6F66;flex:1;min-width:0;}
.f1-podium-row .g{color:#8A8F86;width:72px;text-align:right;flex:none;}
.f1-standing-row{display:grid;grid-template-columns:26px 140px 120px 1fr 48px;gap:12px;padding:10px 0;border-bottom:1px solid #E4E4DF;font-family:'JetBrains Mono',monospace;font-size:12.5px;align-items:center;}
.f1-standing-row .pos{font-weight:700;color:#8A8F86;}
.f1-standing-row.p1 .pos{color:#9C7A2E;}
.f1-standing-row .drv{color:#0B0B0B;font-weight:600;}
.f1-standing-row .tm{color:#4A4E47;}
.f1-standing-row .barwrap{height:6px;background:#E4E4DF;border-radius:3px;overflow:hidden;}
.f1-standing-row .bar{height:100%;background:#B3261E;border-radius:3px;}
.f1-standing-row .pts{text-align:right;font-weight:700;color:#0B0B0B;}

/* ---------- fixtures table ---------- */
.fx-wrap{margin-top:8px;}
.fx-group{margin-bottom:22px;}
.fx-group h4{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent,var(--ink-muted));margin:0 0 6px;}
.fx-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:13px;}
.fx-row:last-child{border-bottom:none;}
.fx-teams{font-weight:600;}
.fx-teams .vs{color:var(--ink-muted);font-weight:400;font-size:11px;}
.fx-score{font-weight:700;text-align:center;}
.fx-status{color:var(--ink-muted);font-size:11.5px;text-align:right;white-space:nowrap;}

/* ---------- team / competition directory ---------- */
.div-section{margin-top:44px;padding-top:30px;border-top:1px solid var(--line);}
.div-section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;}
.div-section-head h3{font-size:19px;}
.div-section-head .sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-muted);}
.div-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 24px;}
.div-col h4{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--accent,var(--court));margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line);}
.div-team{font-size:14px;padding:7px 0;border-bottom:1px solid var(--line);color:var(--ink);}
.div-team:last-child{border-bottom:none;}
.comp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.comp-item{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border:1px solid var(--line);border-radius:6px;background:var(--paper-raised);}
.comp-item .nm{font-weight:600;font-size:14px;}
.comp-item .sub-links{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-muted);letter-spacing:0.02em;}
@media (max-width:860px){.div-grid{grid-template-columns:repeat(2,1fr);}.comp-grid{grid-template-columns:1fr;}}

/* ---------- about page ---------- */
.about-hero{padding:50px 0 34px;border-bottom:1px solid var(--line);}
.about-hero .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.1em;color:var(--clay);text-transform:uppercase;}
.about-hero h1{font-size:clamp(34px,5vw,54px);margin:12px 0 16px;max-width:16ch;}
.about-hero p{font-size:18px;color:var(--ink-muted);max-width:62ch;line-height:1.6;}
.about-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:40px 0;}
.about-card{border:1px solid var(--line);border-radius:10px;padding:22px;background:var(--paper-raised);}
.about-card .n{font-family:'Anton',sans-serif;font-size:34px;color:var(--clay);}
.about-card .l{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-muted);letter-spacing:0.04em;text-transform:uppercase;margin-top:4px;}
.about-section{padding:30px 0;border-top:1px solid var(--line);max-width:760px;}
.about-section h2{font-size:22px;margin-bottom:12px;}
.about-section p{font-size:16px;line-height:1.7;color:var(--ink-muted);margin:0 0 14px;}
.about-steps{display:flex;flex-direction:column;gap:0;margin-top:10px;}
.about-step{display:grid;grid-template-columns:100px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line);}
.about-step:first-child{border-top:none;}
.about-step .st{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--clay);letter-spacing:0.06em;text-transform:uppercase;}
.about-step .sd h3{font-size:15px;margin:0 0 4px;}
.about-step .sd p{font-size:14px;color:var(--ink-muted);margin:0;line-height:1.55;}

/* ---------- motion ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.hero-main{animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) both;}
/* staggered scroll-reveal: hidden until each card/tile crosses into view, then cascades in by sibling order */
.b-tile,.card,.wire-card,.div-col,.comp-item{opacity:0;transform:translateY(16px);transition:opacity .5s cubic-bezier(.2,.7,.3,1),transform .5s cubic-bezier(.2,.7,.3,1);}
.b-tile.in-view,.card.in-view,.wire-card.in-view,.div-col.in-view,.comp-item.in-view{opacity:1;transform:translateY(0);}
#app{animation:fadeIn .25s ease both;}
.icon-btn svg,.chev{transition:transform .15s ease;}
.icon-btn:hover svg{transform:scale(1.12);}
.b-icon{transition:transform .2s cubic-bezier(.34,1.56,.64,1);}
.b-tile:hover .b-icon{transform:scale(1.15) rotate(-4deg);}
.scorebar-live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--live);margin-right:6px;animation:pulse 1.3s ease-in-out infinite;}
@media (prefers-reduced-motion: reduce){
  .hero-main,#app{animation:none !important;}
  .b-tile,.card,.wire-card,.div-col,.comp-item{opacity:1 !important;transform:none !important;transition:none !important;}
  .b-tile:hover .b-icon{transform:none;}
  .scorebar-live-dot{animation:none;}
}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);margin-top:40px;}
.foot-wrap{padding:28px 20px 40px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;}
footer .disp{font-size:18px;}
footer p{font-size:12.5px;color:var(--ink-muted);max-width:52ch;line-height:1.6;margin:8px 0 0;}
.engine-note{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-muted);max-width:360px;line-height:1.7;}

      'Cleveland now turns around for an even bigger challenge: the Tampa Bay Rays, who swept the Yankees to reach the ALCS and have had extra rest waiting for an opponent. Game 1 is tonight at Tropicana Field.',
    ],
  },

  {id:'ucl-recap', sport:'football', league:'Champions League', cat:'recap',
    headline:'Tresoldi\'s Hat-Trick Sinks Inter as Barcelona and Arsenal Win Big on Matchday 2',
    dek:'Nicolò Tresoldi\'s treble fired Club Brugge to a 4-3 San Siro thriller, Lamine Yamal set up both Barcelona goals in a comeback win, and Sabah won a Champions League match for the first time in their history.',

    qa:[['What were Tuesday\'s results?','Barcelona 4-1 Galatasaray, Arsenal 3-0 Lille, Sporting CP 2-0 Lens, Viking 3-3 Bayern Munich, Inter 3-4 Club Brugge, Atlético Madrid 2-0 Manchester United, Sabah 2-0 Slavia Praha, Villarreal 3-1 Napoli, Leipzig 1-0 PSV.'],

    body:[
      'Nicolò Tresoldi scored a hat-trick as Club Brugge beat Inter 4-3 in a genuine San Siro thriller, the night\'s best individual performance on a matchday that had no shortage of them. Barcelona came from behind to beat Galatasaray 4-1 behind two Lamine Yamal assists, and Arsenal cruised past Lille 3-0 with Jurriën Timber named Player of the Match.',
      'Elsewhere, Sporting CP\'s Luis Suárez became the club\'s outright all-time leading scorer in the competition during a 2-0 win at Lens, Harry Kane extended his Champions League scoring streak to nine straight games (a penalty and a header) but still only salvaged a 3-3 draw for Bayern Munich at Viking, and Sabah beat Slavia Praha 2-0 for the first Champions League win in the club\'s history.',
      'Atlético Madrid beat Manchester United 2-0, Villarreal beat Napoli 3-1, and Leipzig edged PSV 1-0 in a tighter, quieter corner of the matchday. Wednesday still has the two heaviest remaining fixtures to come — Manchester City host PSG, and Roma face Real Madrid.',

  {id:'ucl-breakout-performances', sport:'football', league:'Champions League', cat:'analysis',
    headline:'The Breakout Night: Tresoldi, Mickels and the Players Who Made Matchday 2',
    dek:'A hat-trick from a forward most casual fans had never heard of, a historic first win for the competition\'s smallest club, and a teenager setting up goals for fun — the real story of Matchday 2 was written by players outside the usual headlines.',
    byline:'Clutch Room Football Desk', mins:7, time:'Oct 14, 2026',
    qa:[['Who was the standout performer of the matchday?','Nicolò Tresoldi, who scored a hat-trick for Club Brugge in a 4-3 win away at Inter Milan — arguably the single best individual performance of Matchday 2.'],
        ['What made Sabah\'s result historic?','Their 2-0 win over Slavia Praha, sealed by Joy-Lance Mickels, was the first Champions League win in the Azerbaijani club\'s history.']],
    body:[
      'Every Champions League matchday has its headline result, but Matchday 2\'s most interesting story wasn\'t at the top of the table — it was the players making their names inside games that weren\'t supposed to be about them. Nicolò Tresoldi\'s hat-trick for Club Brugge, away at a full San Siro against Inter, is the kind of performance that changes how a player gets talked about overnight. Brugge won 4-3 in a genuine shootout of a match, and Tresoldi was directly responsible for more of it than anyone else on the pitch.',
      'Lamine Yamal didn\'t need to score to be the best player on the field in Barcelona\'s 4-1 comeback win over Galatasaray — he set up both Fermín López\'s header and Anthony Gordon\'s goal, continuing to look like a teenager operating on a completely different timeline than his actual age. He was a deserved Player of the Match, and at this point in his career, that\'s becoming the expectation rather than the story.',
      'The quieter breakout belongs to Sabah. Beating Slavia Praha 2-0, sealed by a goal from Joy-Lance Mickels, doesn\'t sound like a historic result on paper — until you know it\'s the first Champions League win in the Azerbaijani club\'s history. For a team whose entire competitive existence in Europe\'s top competition had been winless, that\'s a result worth more to the club than three points usually are.',
      'A few players extended rather than started their stories: Luis Suárez became Sporting CP\'s all-time leading scorer in the competition, a record built over time rather than in one night, while Harry Kane\'s penalty and header stretched his Champions League scoring run to nine consecutive games — a streak that now says as much about his consistency as any single performance could. Jurriën Timber\'s Player of the Match award in Arsenal\'s comfortable 3-0 win over Lille was the night\'s most conventional kind of good, the sort of performance that holds a clean sheet together without ever needing a moment of individual brilliance to be noticed.',
      'Put together, Matchday 2 is a reminder of what the Champions League\'s league phase was actually built to surface: not just the usual superclub storylines, but a 20-year-old forward most casual fans had never heard of a day ago, and a club from Azerbaijan writing its first real sentence in the competition\'s history.',
    ],
    related:'ucl-recap',
  },

  {id:'f1-singapore-press-day', sport:'f1', cat:'preview',

  {id:'f1-singapore-race-breakdown', sport:'f1', cat:'analysis',
    headline:'Lights to Flag: Breaking Down Verstappen\'s Dominant Singapore Weekend',
    dek:'A full look at how Red Bull turned pole position into a start-to-finish win at Marina Bay, who else moved up the order, and what it means for a championship race that\'s suddenly tighter than the points gap suggests.',
    byline:'Clutch Room F1 Desk', mins:7, time:'Oct 12, 2026',
    qa:[['Did anyone seriously challenge Verstappen?','No — leading every lap means there was no safety-car reshuffle or strategy gamble that put him under real pressure; Leclerc\'s 7.3-second gap at the flag was as close as it got.'],
        ['What happened to Hamilton after his strong Friday and sprint pole?','He finished sixth, 53.2 seconds off the win in the Grand Prix — a reminder that single-lap pace and full-race race pace are different problems at Marina Bay.']],
    body:[
      'There\'s a version of "led every lap" that still involves late drama — a safety car bunching the field, a slow pit stop, a late-race tire gamble from a rival. Singapore wasn\'t that. Max Verstappen converted pole into the lead at turn one and was never seriously challenged for it, crossing the line 7.335 seconds clear of Charles Leclerc\'s Ferrari. It was his first win at this circuit in 250 career starts — a genuinely rare hole in his résumé, now filled.',
      'The full order behind him tells its own story about where the grid actually stands heading into the season\'s final stretch. Kimi Antonelli held third for Mercedes despite carrying the championship lead and all the pressure that comes with it, finishing 24.6 seconds back. Lando Norris and Oscar Piastri were fourth and fifth for McLaren, a result that keeps the team in touch without threatening the podium picture. Lewis Hamilton\'s race was the real disappointment of the weekend: after topping Friday practice and talking confidently about Ferrari\'s pace, he slipped to sixth, over 53 seconds behind Verstappen by the finish — a gap that single-lap speed on a Friday simply didn\'t predict.',
      'George Russell\'s recovery drive to ninth, from the grid penalty picked up after his Sepang engine change, was a quietly useful result for Mercedes\' constructors\' points, even if it did nothing for his own championship math. Further back, Pierre Gasly, Oliver Bearman, Esteban Ocon and Carlos Sainz all finished a lap down, and three cars failed to see the finish: Lance Stroll, Franco Colapinto and Gabriel Bortoleto all retired, Bortoleto\'s race ending after just seven laps.',
      'The standings now read Antonelli 335, Russell 238, Hamilton 222, Verstappen 213, Leclerc 209 — numbers that still have Antonelli comfortably in front, but a 335-to-213 gap with races still to run is a very different conversation after back-to-back Verstappen wins than it was before Malaysia. Red Bull has found real pace at exactly the point in the season where it matters most to be peaking, and a driver who\'d gone winless for most of the year now has two in a row.',
    ],
    related:'f1-singapore-race-recap',
  },

  {id:'nfl-week5-sunday-recap', sport:'nfl', cat:'recap',
    headline:'Ravens Erase an Eight-Point Deficit in 40 Seconds, Win in Overtime',
    dek:'Tyler Huntley threw a tying touchdown with 40 seconds left and scored the OT winner himself as Baltimore beat Atlanta 30-23 on a Sunday that also saw the Patriots and Lions post 45-point blowouts.',

    body:[
      'Baltimore trailed Atlanta 23-15 with 40 seconds on the clock and needed a touchdown and a two-point conversion just to survive. They got both: Tyler Huntley, filling in for the injured Lamar Jackson, found Devontez Walker for a 7-yard score, and Derrick Henry powered in on a direct-snap run to tie it at 23. In overtime, Huntley drove Baltimore 68 yards on 14 plays and finished it himself on a short touchdown run, sealed by a game-ending Kyle Hamilton interception. Huntley\'s final line: 24-of-32 for 201 yards and two touchdowns.',
      'Elsewhere, Sunday had no shortage of lopsided scores: New England beat Las Vegas 45-17, Detroit beat Arizona 45-21, Pittsburgh beat Indianapolis 34-22, and Green Bay beat Chicago 31-7. New York Giants and Washington played to a 27-27 overtime tie, and San Francisco survived Seattle 32-29.',
      'Full board: Jacksonville 19, Philadelphia 17 · Green Bay 31, Chicago 7 · Houston 26, Tennessee 3 · Cincinnati 31, Miami 24 · New England 45, Las Vegas 17 · Minnesota 23, New Orleans 13 · New York Jets 17, Cleveland 12 · Pittsburgh 34, Indianapolis 22 · New York Giants 27, Washington 27 (OT) · Denver 23, Los Angeles Chargers 17 · Detroit 45, Arizona 21 · San Francisco 32, Seattle 29 · Baltimore 30, Atlanta 23 (OT).',

  {id:'nfl-week5-sunday-breakdown', sport:'nfl', cat:'analysis',
    headline:'Huntley\'s Finest Hour: Inside the Ravens\' Overtime Classic, and What a 45-Point Sunday Says About the Rest of the Field',
    dek:'Baltimore\'s backup quarterback delivered the signature win of his career filling in for an injured Lamar Jackson — and a wild Week 5 Sunday reshuffled more than one division race in the process.',
    byline:'Clutch Room NFL Desk', mins:8, time:'Oct 12, 2026',
    qa:[['What does the Ravens\' win mean for the standings?','It gives Baltimore sole possession of first place in the AFC North at 4-1.'],
        ['Why was Tyler Huntley starting?','Lamar Jackson is out with an ankle injury; Huntley was filling in as Baltimore\'s starter.']],
    body:[
      'Forty seconds. That was the window Tyler Huntley had to save Baltimore\'s Sunday, down 23-15 with the Falcons about to run out the clock on a real upset. He used it as well as a backup quarterback possibly could: a 7-yard strike to Devontez Walker to make it a one-score game, then handing off to Derrick Henry on a direct snap for the two-point conversion that tied it at 23 and sent the game to overtime.',
      'What Huntley did next is the part that turns a nice finish into a signature win. Rather than a quick defensive stand and a short field goal drive, Baltimore methodically marched 68 yards across 14 plays — over seven minutes of game clock — and Huntley finished the drive himself on a short touchdown run. Kyle Hamilton\'s interception on Atlanta\'s ensuing possession made sure it stuck. Huntley\'s final numbers, 24-of-32 for 201 yards and two touchdowns, undersell what the day actually required of him: command of a 14-play game-winning drive with his starting job on the line and his franchise quarterback watching from the sideline with an ankle injury.',
      'The result moves Baltimore to 4-1 and sole possession of first in the AFC North — a division that was expected to be a dogfight all year and now has a clear, if unlikely, pacesetter while its best player is hurt. That\'s the real story underneath the box score: good backup quarterback play is often the difference between a playoff seed and a bad August for a team with real aspirations, and Sunday was the first real evidence Baltimore has that answer covered.',
      'Zoom out from Baltimore and Sunday had a split personality. Four games finished decided by three points or less, including the Ravens\' OT classic and a Giants-Commanders game that went to overtime and still couldn\'t be separated, ending 27-27. But the day was just as defined by its blowouts — New England\'s 45-17 rout of Las Vegas and Detroit\'s 45-21 demolition of Arizona both point to teams rounding into form at exactly the right time of year, five weeks in, with the results now substantial enough to mean something beyond a single Sunday.',
      'None of that changes what will be remembered first from Week 5: a backup quarterback, forty seconds, and a franchise that now has to decide how much of its season plan just got rewritten.',
    ],
    related:'nfl-week5-sunday-recap',
  },

  {id:'pak-sl-2nd-t20i-breakdown', sport:'cricket', cat:'analysis',
    headline:'Breaking Down Sadaqat\'s 96: How Pakistan Posted Their Highest T20I Total on Home Soil',
    dek:'A full statistical look at the innings that put the series away — the batting that built 215/3, the bowling discipline that made it unreachable, and what it means with one match left.',
    byline:'Clutch Room Cricket Desk', mins:7, time:'Oct 12, 2026',
    qa:[['What made Pakistan\'s total so imposing?','215/3 was built on a 51-ball 96 from Maaz Sadaqat (6 fours, 7 sixes, strike rate 188.2) and a 44-ball 73 from captain Sahibzada Farhan — the two put together the bulk of the total before either fell.'],
        ['How did Sri Lanka\'s chase fall apart?','Mohammad Imran removed Kusal Mendis, Sahan Arachchige and Sineth Jayawardena inside an economical 4-0-11-3 spell, and only Maheesh Theekshana\'s unbeaten 32 kept the margin from being even heavier.']],
    body:[
      'Pakistan\'s 215/3 is their highest T20I total on home soil, and the scorecard shows exactly how it was built: Fakhar Zaman got the innings moving with 22 off 17, but the platform really came from Sahibzada Farhan and Maaz Sadaqat, who combined for 169 of Pakistan\'s 215 runs. Farhan\'s 73 came off 44 balls with 4 fours and 5 sixes before he was caught off Dasun Shanaka\'s bowling; Sadaqat kept going well past that, eventually caught in the 19th over for 96 off just 51 balls — 6 fours and 7 sixes, a strike rate of 188.2 that earned him the Player of the Match award. Hasan Nawaz\'s unbeaten 19 off 9 at the death was almost an afterthought by comparison.',
      'What made the total genuinely out of reach wasn\'t just the runs — it was how little margin for error Pakistan\'s bowlers then gave Sri Lanka. Mohammad Imran was the standout, going for just 11 runs in his full four overs while taking 3 wickets, an economy rate of 2.75 in a format where anything under six is considered tight. He accounted for Kusal Mendis, Sahan Arachchige and Sineth Jayawardena — three of the top order gone cheaply against a bowler who simply didn\'t offer anything to hit.',
      'Sri Lanka\'s innings had one genuine bright spot: Maheesh Theekshana\'s unbeaten 32 off 26 at the bottom of the order, the only Sri Lankan batter to pass 30. Everyone above him managed at most 29 (Chamindu Wickramasinghe), and the middle order collapsed around Imran\'s opening burst — Sahan Arachchige was out for a golden duck, caught off the very delivery that started his innings.',
      'With the series already secured 2-0, Tuesday\'s third T20I at the same Rawalpindi venue is a dead rubber on the scoreboard but not necessarily in substance — it\'s the last chance for Sri Lanka\'s middle order to find answers before the tour moves into ODIs, and the last data point before Pakistan\'s selectors have to decide whether Sadaqat\'s breakout innings earns him a longer run in the XI.',
    ],
    related:'pak-sl-2nd-t20i-recap',
  },

function renderF1Results(){
  return F1_SEASON_RESULTS.map(r=>{
    const rows = r.results
      ? r.results.map(d=>`<div class="f1-podium-row"><span class="p ${d.pos<=3?'p'+d.pos:''}">P${d.pos}</span><span class="d">${d.driver}</span><span class="t">${d.team}</span><span class="g tnum">${d.gap}</span></div>`).join('')
      : r.podium.map((p,i)=>`<div class="f1-podium-row"><span class="p p${i+1}">P${i+1}</span><span class="d">${p.driver}</span><span class="t">${p.team}</span></div>`).join('');
    return `<details class="f1-result-item">
    <summary class="f1-result-row">
      <span class="rnd">R${r.round}</span>
      <span class="gp">${r.gp}</span>
      <span class="win">${r.winner}${r.note ? ` <span class="note">· ${r.note}</span>` : ''}</span>
      <span class="tm">${r.team}</span>
    </summary>
    <div class="f1-podium">${rows}</div>
  </details>`;
  }).join('');
}
function renderF1Standings(){
  const max = F1_STANDINGS[0].pts;
  return F1_STANDINGS.map(d=>`<div class="f1-standing-row ${d.pos===1?'p1':''}">
    <span class="pos">${d.pos}</span>
    <span class="drv">${d.driver}</span>
    <span class="tm">${d.team}</span>
    <div class="barwrap"><div class="bar" style="width:${Math.round(d.pts/max*100)}%"></div></div>
    <span class="pts tnum">${d.pts}</span>
  </div>`).join('');
}

function articleCard(a){
  const s = sportById(a.sport);
  return `<a class="card" href="#/article/${a.id}" style="--accent:var(--${s.accent})" data-league="${a.league || 'All'}">

    <div class="meta"><span>${a.byline}</span><span>·</span><span>${a.mins} min read</span></div>

function heatMeter(heat){
  const lit = Math.round(heat/100*6);
  let out='<div class="heatmeter">';
  for(let i=0;i<6;i++){ out += `<i class="${i<lit?'on':''}"></i>`; }
  return out+'</div>';
}

function gameCardHtml(g){

    ${score!==undefined ? `<span class="team-score tnum">${score}</span>` : ''}
  </div>`;
  return `<div class="game-card">
    <span class="game-status ${live?'live':''}">${g.status}${g.note?' · '+g.note:''}</span>
    ${row(g.away, g.away_score)}
    ${row(g.home, g.home_score)}

}

function scrollToRail(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); }

function filterLeague(league){
  document.querySelectorAll('.league-chips .chip').forEach(c=>{
    c.classList.toggle('on', c.dataset.league===league);
  });
  document.querySelectorAll('#app .card[data-league]').forEach(card=>{
    card.style.display = (league==='All' || card.dataset.league===league) ? '' : 'none';
  });
  let anyRailVisible = false;
  ['recap','preview','injury','debate'].forEach(cat=>{
    const rail = document.getElementById('rail-'+cat);
    if(!rail) return;
    const anyVisible = Array.from(rail.querySelectorAll('.card')).some(c=>c.style.display!=='none');
    rail.style.display = anyVisible ? '' : 'none';
    if(anyVisible) anyRailVisible = true;
  });
  const noArticles = document.getElementById('no-league-articles');
  if(noArticles) noArticles.style.display = anyRailVisible ? 'none' : 'block';
  const showFixtures = league==='All' || league==='Champions League';
  const fxUcl = document.getElementById('fixtures-ucl');
  const fxFallback = document.getElementById('fixtures-fallback');
  if(fxUcl) fxUcl.style.display = showFixtures ? '' : 'none';
  if(fxFallback) fxFallback.style.display = showFixtures ? 'none' : 'block';
}

function renderHome(){
  const hero = articleById('pak-sl-1st-t20i-recap');
  const debate = ARTICLES.find(a=>a.cat==='debate' && a.sport==='football');
  const ranked = [...SPORTS].sort((a,b)=>b.heat-a.heat);
  const main = ranked.filter(s=>tierOf(s.heat)<=3);
  const quiet = ranked.filter(s=>tierOf(s.heat)===4);
  const peekFor = id => {
    const forSport = ARTICLES.filter(a=>a.sport===id);
    const recaps = forSport.filter(a=>a.cat==='recap');
    return recaps.length ? recaps[recaps.length-1] : forSport[0];
  };
  const forTake = debate.takes.find(t=>t.side==='for');

  const sportTileHtml = (s,i) => {
    const peek = peekFor(s.id);
    const big = tierOf(s.heat) === 1;
    const accent = s.live ? 'live' : s.accent;
    return `<a class="b-tile ${big?'b-2':''} ${s.live?'b-live':''}" href="#/sport/${s.id}" style="--accent:var(--${accent});--tint:${s.live?26:big?22:tierOf(s.heat)===2?13:8}%;">
      <span class="b-go">${String(i+1).padStart(2,'0')} →</span>
      ${s.live ? `<span class="b-live-badge"><span class="dot"></span>LIVE</span>` : ''}
      <span class="b-icon">${SPORT_ICONS[s.id]||''}</span>
      <span class="b-name disp">${s.name}</span>
      <span class="b-status">${s.status}</span>
      ${peek ? `<span class="b-peek">${peek.headline}</span>` : ''}
    </a>`;
  };

  return `
  ${masthead({sport:null})}
  <main class="wrap">
    <a class="hero-main" href="#/article/${hero.id}" style="display:block;margin-top:28px;">
      <span class="hero-kicker">Top Story · ${sportById(hero.sport).name}</span>
      <h1>${hero.headline}</h1>
      <p class="hero-dek">${hero.dek}</p>
      <div class="hero-meta">${hero.byline} · ${hero.time} · ${hero.mins} min read</div>
    </a>

    <div class="bento-head"><h2>What's Happening Right Now</h2><span class="sub">Ranked by heat, not alphabet — ${main.length} sports in play</span></div>
    <div class="bento">
      ${main.map((s,i)=>sportTileHtml(s,i)).join('')}
      <a class="b-tile b-quote" href="#/article/${debate.id}">
        <span class="b-q-label">Today's Debate</span>
        <span class="b-q-text">"${forTake.text}"</span>
        <span class="b-q-who">${forTake.who}</span>
        <span class="b-q-link">Read both sides →</span>
      </a>
      <div class="b-tile b-quiet">
        <span class="b-quiet-label">Quiet This Week</span>
        ${quiet.map(s=>`<a class="b-quiet-row" href="#/sport/${s.id}" style="color:inherit;text-decoration:none;"><span class="nm">${s.name}</span><span class="st">${s.status}</span></a>`).join('')}
      </div>
    </div>

    <div class="bento-head"><h2>Insider Wire</h2><span class="sub">Beat reporter notes, continuously tracked</span></div>
    <div class="wire">${INSIDER.map(insiderCard).join('')}</div>
  </main>
  ${footer()}`;
}

    <div class="about-hero">
      <span class="eyebrow">About Clutch Room</span>
      <h1 class="disp">Coverage ranked by what's actually happening.</h1>
      <p>Most sports sites give every league the same amount of homepage real estate, whether it's a championship weekend or a bye week. Clutch Room ranks coverage by heat — what's live, what's close, what just happened — so the biggest story on the slate is always the one you see first.</p>
    </div>

    <div class="about-grid">
      <div class="about-card"><div class="n">10</div><div class="l">Sports tracked</div></div>
      <div class="about-card"><div class="n">24/7</div><div class="l">Heat re-ranked continuously</div></div>
      <div class="about-card"><div class="n">3</div><div class="l">Full desks live today</div></div>
    </div>

    <div class="about-section">
      <h2 class="disp" style="font-size:24px;">What we cover</h2>
      <p>Football (Premier League, Champions League, La Liga, Serie A, Bundesliga, MLS, Saudi Pro League), MLB, Tennis, NFL, NBA, Padel, Cricket, UFC, Boxing and F1 — recaps the morning after, previews and odds before kickoff, injury watches as news breaks, and debate-style takes on the stories worth arguing about.</p>
    </div>

    <div class="about-section">
      <h2 class="disp" style="font-size:24px;">How a story gets made</h2>
      <div class="about-steps">
        <div class="about-step"><div class="st">01 · Feed</div><div class="sd"><h3>Live data in</h3><p>Scores, odds and injury news come in from licensed sports-data feeds and the public reporting of named outlets — never scraped from a platform's own terms-of-service-protected content.</p></div></div>
        <div class="about-step"><div class="st">02 · Rank</div><div class="sd"><h3>Heat, not habit</h3><p>Every sport is re-scored by what's actually in play right now, which is what decides its size and position on the homepage.</p></div></div>
        <div class="about-step"><div class="st">03 · Draft</div><div class="sd"><h3>First draft, fast</h3><p>A recap or preview draft is generated within minutes of a result or a lineup change, built around a direct, citable Quick-Answers block for search and AI answer engines.</p></div></div>
        <div class="about-step"><div class="st">04 · Edit</div><div class="sd"><h3>Human review</h3><p>A desk editor checks facts, tightens the voice, and signs off before anything publishes — every article is marked with its provenance.</p></div></div>
      </div>
    </div>

    <div class="about-section" style="border-bottom:1px solid var(--line);padding-bottom:40px;">
      <h2 class="disp" style="font-size:24px;">A note on this build</h2>
      <p>This site is a working design preview, not a commercial product. Match facts, schedules and storylines are researched from real public sources (ESPN, official league sites, team sites, etc.) and kept current by a scheduled background job — but the "takes" in debate-style pieces are Clutch Room's own invented editorial voice, not real quotes, and any outlet credited in the Insider Wire (ESPN, The Athletic) is cited as a source type, not implying a live partnership.</p>
    </div>
  </main>
  ${footer()}`;
}

function renderPlaceholderHub(sport){
  const s = sportById(sport);
  const quiet = s.heat < 20;
  return `
  ${masthead({sport:sport})}
  <main class="wrap" style="--accent:var(--${s.accent})">
    <div class="hub-head">
      <h1 class="disp">${s.name}</h1>
      <div class="sport-sub mono">${s.sub}</div>
      <div class="hub-status">${heatMeter(s.heat)}<span class="mono" style="font-size:11px;color:var(--ink-muted);">${s.status}</span></div>
    </div>
    <div class="ph-skel">
      <div class="disp">${quiet ? 'NOTHING MAJOR THIS WEEK' : 'HUB IN PRODUCTION'}</div>
      <p>${quiet
        ? `No top-tier fixtures or storylines in play for ${s.name} right now — we'll be here the moment that changes.`
        : `Recaps, previews, odds and injury coverage for ${s.name} launch with the next build phase, using the same desk structure as Football, MLB and Tennis.`}</p>
      ${quiet ? '' : `<div class="ph-cats">${Object.values(CAT).map(c=>`<span class="pill ${c.cls}" style="opacity:.55">${c.label}</span>`).join('')}</div>`}
    </div>
  </main>
  ${footer()}`;
}

function renderArticle(id){
  const a = articleById(id);
  if(!a){ return `${masthead({sport:null})}<main class="wrap"><p style="padding:60px 0;">Article not found.</p></main>${footer()}`; }
  const s = sportById(a.sport);
  return `
  ${masthead({sport:a.sport})}
  <main class="wrap">
    <div class="breadcrumb"><a href="#/">Clutch Room</a> / <a href="#/sport/${a.sport}">${s.name}</a>${a.league ? ' / '+a.league : ''}</div>
    <div class="article-head" style="--accent:var(--${s.accent})">
      ${catPill(a.cat)}
      <h1>${a.headline}</h1>
      <p class="article-dek">${a.dek}</p>
      <div class="byline">
        <span>${a.byline}</span><span>·</span><span>${a.time}</span><span>·</span><span>${a.mins} min read</span>
        <span class="prov">Auto-drafted from live data · edited by desk</span>
      </div>
    </div>

    <div class="article-body" style="--accent:var(--${s.accent})">
      <div class="prose">
        ${a.qa ? `<div class="qa"><span class="label">Quick Answers</span><dl>${a.qa.map(([q,ans])=>`<dt>${q}</dt><dd>${ans}</dd>`).join('')}</dl></div>` : ''}
        ${a.body.map((p,i)=> i===1 && a.pull ? `<p>${p}</p><div class="pullquote">${a.pull}</div>` : `<p>${p}</p>`).join('')}
        ${a.takes ? `<div class="takes">${a.takes.map(t=>`<div class="take-card ${t.side}"><span class="who">${t.who}</span><p>${t.text}</p></div>`).join('')}</div>` : ''}
        ${a.related ? (()=>{ const r = articleById(a.related); return r ? `<a class="related-callout" href="#/article/${r.id}">
          <span class="rc-label">${a.cat==='analysis' ? 'Read the quick recap' : 'Read the full breakdown'} →</span>
          <span class="rc-headline">${r.headline}</span>
        </a>` : ''; })() : ''}
      </div>

      <div class="sidebar">
        ${a.odds ? `<div class="box"><h5>${a.odds.title}</h5>${a.odds.rows.map(r=>`<div class="odds-row"><span>${r[0]}</span><span class="line tnum">${r[1]}</span></div>`).join('')}<div class="odds-row" style="border:none;color:var(--ink-muted);font-size:11px;">${a.odds.asOf}</div></div>` : ''}
        ${a.injuries ? `<div class="box"><h5>Injury Watch</h5>${a.injuries.map(x=>`<div class="injury-item"><div class="nm">${x.name}</div><span class="st">${x.status}</span><div class="dt">${x.detail}</div></div>`).join('')}</div>` : ''}
        <div class="box"><h5>More in ${s.name}</h5>
          ${ARTICLES.filter(x=>x.sport===a.sport && x.id!==a.id).slice(0,3).map(x=>`<div class="injury-item"><a href="#/article/${x.id}"><div class="nm" style="font-weight:600;">${x.headline}</div></a><div class="dt">${CAT[x.cat].label}</div></div>`).join('')}
        </div>
      </div>
    </div>
  </main>
  ${footer()}`;
}

/* ---------------- router ---------------- */
function route(){
  const hash = location.hash.replace(/^#\/?/,'');
  const app = document.getElementById('app');
  if(hash.startsWith('sport/')){
    const id = hash.split('/')[1];
    const s = sportById(id);
    if(id==='mlb'){ app.innerHTML = renderMLBHub(); }
    else if(id==='f1'){ app.innerHTML = renderF1Hub(); }
    else if(id==='nfl'){ app.innerHTML = renderNFLHub(); }
    else if(!s){ app.innerHTML = renderPlaceholderHub('cricket'); }
    else if(s.deep==='full'){ app.innerHTML = renderHub(id); }
    else if(s.deep==='light'){ app.innerHTML = renderLightHub(id); }
    else { app.innerHTML = renderPlaceholderHub(id); }
  } else if(hash.startsWith('article/')){
    app.innerHTML = renderArticle(hash.split('/')[1]);
  } else if(hash === 'about'){
    app.innerHTML = renderAbout();
  } else if(hash === 'sports-news'){
    app.innerHTML = renderSportsNews();
  } else {
    app.innerHTML = renderHome();
  }
  window.scrollTo(0,0);
  onScrollEffects();
  initScrollReveal();
  updatedSecs = 0;
  const secsEl = document.getElementById('updated-secs');
  if(secsEl) secsEl.textContent = '0';
}
window.addEventListener('hashchange', route);

/* ---------------- staggered scroll-reveal ---------------- */
let revealEls = [];
let revealScrollBound = false;
function onRevealScroll(){
  if(revealScrollTicking) return;
  revealScrollTicking = true;
  requestAnimationFrame(checkReveals);
}
let revealScrollTicking = false;
function checkReveals(){
  revealScrollTicking = false;
  if(!revealEls.length) return;
  const vh = window.innerHeight || 800;
  const stepIndex = new Map();
  revealEls = revealEls.filter(el=>{
    if(el.getBoundingClientRect().top >= vh - 40) return true;
    const parent = el.parentElement;
    const idx = stepIndex.get(parent) || 0;
    stepIndex.set(parent, idx+1);
    el.style.transitionDelay = (Math.min(idx,9) * 55) + 'ms';
    el.classList.add('in-view');
    return false;
  });
}
function initScrollReveal(){
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const els = document.querySelectorAll('.b-tile,.card,.wire-card,.div-col,.comp-item');
  if(reduceMotion){
    els.forEach(el=>el.classList.add('in-view'));
    revealEls = [];
    return;
  }
  revealEls = Array.from(els);
  checkReveals();
  if(!revealScrollBound){
    window.addEventListener('scroll', onRevealScroll, {passive:true});
    window.addEventListener('resize', onRevealScroll);
    revealScrollBound = true;
  }
}


let updatedSecs = 0;
setInterval(function(){
  updatedSecs++;
  const el = document.getElementById('updated-secs');
  if(el) el.textContent = String(updatedSecs);
}, 1000);

/* ---------------- F1 scroll-driven helmet + MLB scroll progress ---------------- */
const F1_RACE_TARGET = new Date('2026-10-25T20:00:00Z').getTime();
let scrollTicking = false;
function onScrollEffects(){
  const helmet = document.getElementById('f1-helmet');
  if(helmet && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    const rect = helmet.getBoundingClientRect();
    const vh = window.innerHeight || 800;
    const progress = Math.min(1, Math.max(0, 1 - (rect.top + rect.height/2) / vh));
    const spin = progress * 360;
    const tilt = (progress - 0.5) * 10;
    const scale = 0.82 + progress * 0.32;
    helmet.style.transform = `perspective(900px) rotateY(${spin}deg) rotateZ(${tilt}deg) scale(${scale})`;
  }
  const bar = document.getElementById('mlb-progress');
  if(bar){
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const pct = docHeight > 0 ? Math.min(100, Math.max(0, (window.scrollY / docHeight) * 100)) : 0;
    bar.style.width = pct + '%';
  }
}
window.addEventListener('scroll', function(){
  if(!scrollTicking){
    requestAnimationFrame(function(){ onScrollEffects(); scrollTicking = false; });
    scrollTicking = true;
  }
});
setInterval(function(){
  const dEl = document.getElementById('f1-d');
  if(!dEl) return;
  let diff = F1_RACE_TARGET - Date.now();
  if(diff < 0) diff = 0;
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  const secs = Math.floor((diff % 60000) / 1000);
  dEl.textContent = String(days).padStart(2,'0');
  document.getElementById('f1-h').textContent = String(hours).padStart(2,'0');
  document.getElementById('f1-m').textContent = String(mins).padStart(2,'0');
  document.getElementById('f1-sec').textContent = String(secs).padStart(2,'0');
}, 1000);

route();
</script>
